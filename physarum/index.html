<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime Network</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; image-rendering:auto; }
  * { cursor:none; }
  /* #info, the type tokens and the four language surfaces live in wall.css.

     THIS PAGE USED TO CARRY TWO PERMANENT BLOCKS - a title band for nine
     seconds and a caption for the whole run - and the caption said the same
     thing about slime moulds in general no matter which of the four species
     was on screen. Photographed twice 48 seconds apart, a green net and a
     blue net carried byte-identical words. Both blocks are gone; language is
     now an episode beat through Wall.lane(). See WALL_REVIEW.md.

     The full-width scrim went with them. It was doing almost nothing - in the
     photograph the words "one of" crossed a bright vein and half-dissolved
     into it - and the Lane's fitted plate at the measured .70 alpha is what
     replaces it. */
</style>
<link rel="stylesheet" href="wall.css">
<!-- wall.js must load in the HEAD: every page here runs its setup at the
     end of an INLINE script, which executes before any deferred bottom
     tag. Loaded at the bottom, Wall was undefined exactly when the first
     episode tried to speak. It touches the DOM only inside its calls, so
     the head is safe. nav.js stays at the bottom and still sees it. -->
<script src="wall.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="info"></div>
<script>
/* ---- rotation navigation (remote D-pad) --------------------------------
   Right steps to the next piece in the wall's rotation, left to the previous
   one. The ring is listed explicitly rather than derived from nextPage,
   because nextPage only points forwards - there is no way to walk it
   backwards. Keep this list in step with the nextPage chain. */
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  const here = (location.pathname.split('/').pop() || 'kiosk.html');
  let i = ROTATION.indexOf(here);
  if (i < 0) i = 0;
  location.href = ROTATION[(i + step + ROTATION.length) % ROTATION.length];
}

/* =======================================================================
   Physarum transport networks.

   Every agent follows three rules and nothing else:
     1. sniff the trail map ahead-left, ahead, ahead-right
     2. turn toward whichever smells strongest
     3. step forward and deposit a little trail of its own

   The trail map blurs and decays each frame. That is the whole model - there
   is no notion of a network anywhere in the code - yet branching transport
   networks appear, compete, and continuously reorganise. It is the same
   question as the tree work (why do branching networks look like this?) asked
   from transport efficiency instead of carbon.

   Named for the slime mould Physarum polycephalum, which solves mazes and
   reproduces rail maps with no nervous system at all.
   ======================================================================= */

const CONFIG = {
  targetCells: 620000,   // grid budget; the blur is the cost, so cap area not width
  agentsPerCell:  0.22,  // population relative to grid area
  /* WHAT FRACTION OF THE AGENTS ARE DRAWN AS THEMSELVES.

     They were not drawn at all. The page rendered only the TRAIL each agent
     deposits, so what reached the screen was the network and never the things
     building it - while the caption said "each dot follows three rules",
     which was a promise the picture did not keep. Joe's note was that the
     individual dots are almost invisible and it is hard to tell what you are
     looking at; they were not almost invisible, they were absent.

     Not all of them: at 0.22 agents per cell, drawing every one would put a
     lit pixel on a fifth of the grid and the trail underneath would vanish
     under its own workforce. A sample of one in sixteen is enough to read as
     a swarm, and leaves the network it is drawing plainly visible through it. */
  agentShown:    0.062,
  holdMs:       48000,   // how long one species runs before the next
  speciesPerTurn:   2,   // species shown before handing the screen on
  fadeMs:        1400,
  nextPage: '' /* standalone: nowhere to hand on to; start again */
};
const PINNED = /[?&]pin\b/.test(location.search);

/* Species differ ONLY in sensing geometry and chemistry, never in code path.
   Small changes here produce dramatically different morphologies, which is the
   point worth showing. */
const SPECIES = [
  /* The single most important relationship here is TURN vs SENSOR ANGLE.
     With turn < sensorAng an agent cannot steer sharply enough to leave a
     trail it has joined, so every filament merges into a handful of thick
     smooth mega-curves and no network forms. Jones's original uses a rotation
     angle about twice the sensor angle, which is what lets filaments split
     as readily as they merge. */
  { name: 'Veins',      line:  'This one looks a long way ahead, so it lays down few roads and runs them a long way.',
    sensorAng: 0.39, sensorDist: 9,  turn: 0.79, speed: 1.00, deposit: 1.00, decay: 0.920 },
  { name: 'Lace',       line:  'This one only looks as far as its own body, and weaves a mesh that never opens out.',
    sensorAng: 0.72, sensorDist: 5,  turn: 1.40, speed: 0.90, deposit: 1.00, decay: 0.900 },
  { name: 'Roots',      line:  'This one forgets slowly. Every road it finds stays, and the busy ones grow fat.',
    sensorAng: 0.30, sensorDist: 13, turn: 0.62, speed: 1.10, deposit: 1.10, decay: 0.950 },
  { name: 'Turbulence', line:  'This one forgets almost at once, so nothing it builds ever gets the chance to settle.',
    sensorAng: 0.22, sensorDist: 7,  turn: 1.60, speed: 1.35, deposit: 0.90, decay: 0.880 }
];

/* Palettes: trail strength -> colour. Deliberately dark at the bottom so the
   empty field reads as black on a TV rather than as grey haze. */
const PALETTES = [
  [[0,0,0],[8,20,40],[10,80,120],[40,180,200],[190,245,255],[255,255,255]],
  [[0,0,0],[30,8,40],[110,20,70],[220,70,60],[255,180,60],[255,250,220]],
  [[0,0,0],[6,26,14],[20,90,45],[90,180,70],[210,235,120],[255,255,235]],
  [[0,0,0],[18,14,44],[70,40,130],[150,80,200],[230,170,240],[255,255,255]]
];
function ramp(pal, t) {
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const x = t*(pal.length-1), i = Math.min(pal.length-2, Math.floor(x)), f = x-i;
  const a = pal[i], b = pal[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d', { alpha:false });
const infoEl = document.getElementById('info');

let GW=0, GH=0;                 // grid dimensions
let trail=null, next=null;      // trail map and blur scratch
let img=null, buf=null, buf32=null;
let ax=null, ay=null, ah=null;  // agent x, y, heading
let nAgents=0;
let species=null, palette=null, speciesIndex=-1, startedAt=0;
let lut=null;                   // trail -> packed colour lookup
let fps=0, lastFrame=performance.now(), paused=false, handingOff=false;

function rnd() { return Math.random(); }

function sizeGrid() {
  /* A VIEWPORT WITH NO SIZE. A browser that lays this page out before the
     window has been given one reports innerWidth and innerHeight as 0, and
     0/0 is NaN while anything/0 is Infinity. Either reaches createImageData
     as "not a long", the exception kills the script BEFORE the animation loop
     has been scheduled, and the page is a permanent black rectangle that the
     resize afterwards cannot rescue. Fall back to a plain 16:9 and let that
     resize redo the grid properly. */
  const aspect = (innerWidth || 1920)/(innerHeight || 1080);
  GH = Math.max(180, Math.round(Math.sqrt(CONFIG.targetCells/aspect)));
  GW = Math.round(GH*aspect);
  canvas.width = GW; canvas.height = GH;   // CSS scales it up to the panel
  trail = new Float32Array(GW*GH);
  next  = new Float32Array(GW*GH);
  img = ctx.createImageData(GW, GH);
  buf = img.data;
  buf32 = new Uint32Array(buf.buffer);
}

/* Packed ABGR, the same byte order buf32 uses.

   COOL, BECAUSE EVERY TRAIL PALETTE IS WARM. The first attempt drew the
   agents warm-white and they disappeared into the very filaments they had
   just built - the trunks saturate near white, so a white dot on a trunk is
   no dot at all. Against a fire palette a pale cyan is the one hue that
   cannot be mistaken for trail at any brightness, so the swarm reads as
   something moving OVER the structure rather than as part of it. */
const AGENT_PIX = (255<<24) | (255<<16) | (238<<8) | 178;

/* A 256-entry lookup turns the per-pixel colour mapping into one array read.
   Computing the ramp per pixel would cost more than the simulation. */
function buildLut(pal) {
  lut = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    const c = ramp(pal, i/255);
    lut[i] = (255<<24) | (Math.round(c[2])<<16) | (Math.round(c[1])<<8) | Math.round(c[0]);
  }
}

function seedAgents() {
  nAgents = Math.round(GW*GH*CONFIG.agentsPerCell);
  ax = new Float32Array(nAgents);
  ay = new Float32Array(nAgents);
  ah = new Float32Array(nAgents);
  /* Scatter over the WHOLE field with random headings. Seeding a disc instead
     collapses everything into one thick ring: with every agent starting in the
     same place facing outward they reinforce a single trail before any
     competing structure can form. Uniform noise lets many filaments start
     independently and then find each other, which is where the network
     actually comes from. */
  for (let i = 0; i < nAgents; i++) {
    ax[i] = rnd()*GW;
    ay[i] = rnd()*GH;
    ah[i] = rnd()*Math.PI*2;
  }
  trail.fill(0);
}

function newSpecies() {
  speciesIndex++;
  species = SPECIES[Math.floor(Math.random()*SPECIES.length)];
  palette = PALETTES[Math.floor(Math.random()*PALETTES.length)];
  buildLut(palette);
  seedAgents();
  startedAt = performance.now();

  /* ---- the episode's one sentence -------------------------------------
     A new species IS a new episode, so this is where the wall speaks. Two
     sentences alternate by position in the turn rather than both firing:

       MECHANISM - why this page is science and not a screensaver. It is the
         only thing here worth saying twice, so it opens a turn and comes
         round every third episode.
       CHARACTER - what THIS net is about to do, which is the sentence the
         old permanent caption could never be, because it was written once
         for all four species.

     Firing both back to back would put roughly 27 of every 48 seconds under
     glass, and the whole point is that two thirds of the time the wall is
     only the net. */
  const MECHANISM = 'Each dot sniffs ahead, turns toward the strongest trail, '
                  + 'and leaves one of its own. Nothing here knows what a network is.';
  Wall.episode(speciesIndex % 3 === 0 ? MECHANISM : species.line);
}

/* Bilinear-free point sample: agents are dense enough that nearest-neighbour
   sensing is indistinguishable and about three times cheaper. */
function sense(x, y) {
  let ix = x|0, iy = y|0;
  if (ix < 0) ix += GW; else if (ix >= GW) ix -= GW;
  if (iy < 0) iy += GH; else if (iy >= GH) iy -= GH;
  return trail[iy*GW + ix];
}

function stepAgents() {
  const sa = species.sensorAng, sd = species.sensorDist;
  const turn = species.turn, sp = species.speed, dep = species.deposit;
  for (let i = 0; i < nAgents; i++) {
    const h = ah[i], x = ax[i], y = ay[i];
    const fC = sense(x + Math.cos(h)*sd,      y + Math.sin(h)*sd);
    const fL = sense(x + Math.cos(h-sa)*sd,   y + Math.sin(h-sa)*sd);
    const fR = sense(x + Math.cos(h+sa)*sd,   y + Math.sin(h+sa)*sd);

    let nh = h;
    if (fC > fL && fC > fR)      { /* straight on */ }
    else if (fL > fR)            { nh -= turn*(0.5 + rnd()*0.5); }
    else if (fR > fL)            { nh += turn*(0.5 + rnd()*0.5); }
    else                         { nh += (rnd()-0.5)*turn; }

    let nx = x + Math.cos(nh)*sp;
    let ny = y + Math.sin(nh)*sp;
    // Wrap: a bounded box would pile agents along the walls and the network
    // would grow a rectangular frame that has nothing to do with the model.
    if (nx < 0) nx += GW; else if (nx >= GW) nx -= GW;
    if (ny < 0) ny += GH; else if (ny >= GH) ny -= GH;

    ax[i] = nx; ay[i] = ny; ah[i] = nh;
    const idx = (ny|0)*GW + (nx|0);
    trail[idx] += dep;
  }
}

/* Separable 3-wide box blur plus exponential decay, done in one pass per axis.
   This is the expensive step, which is why the grid is budgeted by AREA. */
function diffuseDecay() {
  const dk = species.decay;
  // horizontal
  for (let y = 0; y < GH; y++) {
    const row = y*GW;
    let prev = trail[row + GW - 1];
    let cur  = trail[row];
    for (let x = 0; x < GW; x++) {
      const nxt = trail[row + (x+1 === GW ? 0 : x+1)];
      next[row + x] = (prev + cur + nxt)*0.3333333;
      prev = cur; cur = nxt;
    }
  }
  // vertical + decay
  for (let x = 0; x < GW; x++) {
    let prev = next[(GH-1)*GW + x];
    let cur  = next[x];
    for (let y = 0; y < GH; y++) {
      const yn = (y+1 === GH ? 0 : y+1);
      const nxt = next[yn*GW + x];
      trail[y*GW + x] = (prev + cur + nxt)*0.3333333*dk;
      prev = cur; cur = nxt;
    }
  }
}

function render() {
  const n = GW*GH;
  for (let i = 0; i < n; i++) {
    /* Square-root mapping, not linear. A busy trunk carries perhaps forty
       times the trail of the faint web connecting it to its neighbours, so a
       linear ramp saturates the trunks to flat white and pushes the web below
       the first visible step - which makes a connected network look like a
       field of unrelated worms. The sqrt lifts the low end where the
       structure actually lives. */
    let v = Math.sqrt(trail[i]*0.055);
    if (v > 1) v = 1;
    buf32[i] = lut[(v*255)|0];
  }

  /* THE AGENTS, ON TOP OF THE FIELD THEY MADE. Written straight into the
     pixel buffer rather than drawn as canvas shapes: there are thousands of
     them every frame and a fillRect each would cost more than the entire
     simulation. Sampled by stride rather than at random so a given agent is
     drawn every frame or never - a random sample twinkles, and twinkling
     reads as noise rather than as motion. */
  /* TWO CELLS ACROSS, not one. The grid is about 1050 wide and the screen is
     3840, so one cell is under four screen pixels - roughly a millimetre on
     the glass, which is below what anybody can see from a sofa. A 2x2 block
     is about 7 px, which reads. */
  const stride = Math.max(1, Math.round(1/CONFIG.agentShown));
  const last = GW*GH - GW - 1;
  for (let k = 0; k < nAgents; k += stride) {
    const gx = ax[k]|0, gy = ay[k]|0;
    if (gx < 0 || gy < 0 || gx >= GW-1 || gy >= GH-1) continue;
    const o = gy*GW + gx;
    if (o > last) continue;
    buf32[o] = AGENT_PIX; buf32[o+1] = AGENT_PIX;
    buf32[o+GW] = AGENT_PIX; buf32[o+GW+1] = AGENT_PIX;
  }

  ctx.putImageData(img, 0, 0);
}

function updateInfo() {
  infoEl.textContent =
    `species   ${species.name}\n` +
    `grid      ${GW} x ${GH}\n` +
    `agents    ${nAgents.toLocaleString()}\n` +
    `sensor    ${species.sensorAng.toFixed(2)} rad @ ${species.sensorDist}px\n` +
    `turn      ${species.turn.toFixed(2)} rad\n` +
    `speed     ${species.speed.toFixed(2)}   deposit ${species.deposit.toFixed(2)}\n` +
    `decay     ${species.decay}\n` +
    `elapsed   ${((performance.now()-startedAt)/1000).toFixed(0)}s\n` +
    `fps       ${fps.toFixed(0)}${paused ? '  [PAUSED]' : ''}`;
}

function handOff() {
  if (handingOff) return;
  handingOff = true;
  /* Kill the language schedule before the fade. A Lane beat that fires during
     the hand-off writes into a document that is on its way out, and one that
     is still lit while the page dissolves reads as the NEXT page's caption. */
  Wall.clearEpisode(); Wall.clearTimers();
  document.body.style.transition = `opacity ${CONFIG.fadeMs}ms ease-in-out`;
  document.body.style.opacity = '0';
  /* An EMPTY nextPage means there is nowhere to hand on to - which is what
     build_github.py leaves behind when it cuts this page out of the wall's
     rotation for publishing. Start again instead. */
  setTimeout(() => { if (CONFIG.nextPage) location.href = CONFIG.nextPage;
                     else location.reload(); }, CONFIG.fadeMs);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - lastFrame; lastFrame = now;
  fps = fps ? fps*0.9 + (1000/dt)*0.1 : 1000/dt;
  if (paused || handingOff) return;

  if (now - startedAt > CONFIG.holdMs) {
    if (!PINNED && speciesIndex + 1 >= CONFIG.speciesPerTurn) { handOff(); return; }
    newSpecies();
  }
  stepAgents();
  diffuseDecay();
  render();
  if (document.body.classList.contains('showinfo')) updateInfo();
}

addEventListener('resize', () => { sizeGrid(); buildLut(palette); seedAgents(); });
addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
    case 'n': case 'N': newSpecies(); break;
    case 'p': case 'P': case ' ': paused = !paused; updateInfo(); break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    default:
      if (/^[0-9]$/.test(e.key)) {
        const score = e.key === '0' ? 10 : parseInt(e.key, 10);
        console.log('[physarum] RATING STUB - score', score, 'species', species && species.name);
      }
  }
});

sizeGrid();
newSpecies();
requestAnimationFrame(frame);
</script>
<script src="nav.js"></script>
</body>
</html>
