  * { cursor:none; }
  /* #info and every type token live in wall.css */
  /* #info, the type tokens and the four language surfaces live in wall.css.

     THE TITLE BAND AND THE PERMANENT CAPTION ARE GONE. The caption was
     identical across two completely different patterns photographed 46
     seconds apart - cream Maze and teal Spots - and it talked about "U" and
     "V", two letters that are never defined and never drawn. At three and a
     half metres that is noise wearing the costume of an explanation.

     The dark bottom scrim went with them, and it was actively harmful here:
     this page is bright cream about half the time, so a dark gradient was
     laid over the lightest artwork in the rotation. Language is now an
     episode beat through Wall.lane(), on a fitted plate that covers its own
     ground whatever the palette is doing. See WALL_REVIEW.md. */
</style>

<!-- wall.js must load in the HEAD: every page here runs its setup at the

<body>
<canvas id="cv"></canvas>
<div id="info"></div>
<script>
/* ---- rotation navigation (remote D-pad) --------------------------------
   Right steps to the next piece in the wall's rotation, left to the previous
   one. The ring is listed explicitly rather than derived from nextPage,
   because nextPage only points forwards - there is no way to walk it
   backwards. Keep this list in step with the nextPage chain. */
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  /* The next ENABLED piece, not simply the next one listed. Joe, 2026-09-13:
     "if I try to skip to the next one it goes to the next one in the ring,
     regardless if that one is turned on or not." Wall.step() walks the ring
     honouring the setup screen's switches; ROTATION below is the fallback for
     a page opened outside the wall, where there are no settings to read. */
  const want = (window.Wall && Wall.step) ? Wall.step(step) : null;
  if (want) { location.href = want; return; }
  const here = (location.pathname.split('/').pop() || 'kiosk.html');
  let i = ROTATION.indexOf(here);
  if (i < 0) i = 0;
  location.href = ROTATION[(i + step + ROTATION.length) % ROTATION.length];
}

/* =======================================================================
   reaction.html · v1.0 · 2026-09-13

   Gray-Scott reaction-diffusion: Turing's answer to how a leopard gets
   its spots.

   Two chemicals on a grid. U is fed in from outside; V converts U into more
   of itself and is removed. Both diffuse, but U diffuses TWICE AS FAST as V.

     dU/dt = Du*lap(U) - U*V^2 + F*(1 - U)
     dV/dt = Dv*lap(V) + U*V^2 - (F + k)*V

   The counter-intuitive part, and Turing's insight in 1952, is that
   DIFFUSION - the process that smooths everything out - is what creates the
   pattern. A local patch of V eats U and grows; it also depletes U in a ring
   around itself faster than V can spread there, so the patch cannot merge
   with its neighbours. Short-range activation, long-range inhibition. The
   spacing you see is set by the ratio of the two diffusion rates.

   Every pattern below comes from the same four lines above. Only F (feed) and
   k (kill) differ - a two-number parameter plane that contains spots,
   stripes, mazes, and things that divide like cells.
   =======================================================================

   CHANGED
     v1.0  versioning starts here; this file predates the scheme
*/

const CONFIG = {
  targetCells: 125000,   // grid budget; upscaled to the panel by CSS
  /* SOLVER STEPS PER RENDERED FRAME - and this is the flashiness knob.

     At 22 the whole field reorganises several times a second: every spot in a
     mitosis pattern divides, everywhere, continuously, and the eye has nothing
     still to rest on. Joe's word was "sickening", which is the right word for
     small-scale high-contrast motion filling the visual field - it is the
     same mechanism as motion sickness in a bad camera shake.

     At 8 the chemistry is identical and takes about three times as long to
     get there, which it has: a pattern gets 46 seconds and reaches its
     character in well under that. What changes is that you can now watch a
     single spot divide instead of watching the whole field seethe. */
  iters:            8,   // solver steps per rendered frame
  /* Du/Dv must be ~1.0/0.5 against F,k of order 0.05, not 0.16/0.08.
     The pattern's length scale goes as sqrt(Dv/F): at Dv=0.08 that is about
     one grid cell, so structures cannot spread and every seed collapses to an
     isolated speck. dt is then bounded by stability - this stencil's extreme
     eigenvalue is -2, so explicit Euler needs dt*Du <= 1. */
  Du:             1.0,
  Dv:             0.5,
  dt:             1.0,
  /* THE PIECE NO LONGER ENDS. It used to show two fixed patterns of 46 s and
     hand on; it now settles once and then wanders the (F,k) plane for as long
     as the viewer's dwell allows, so it is a "runs on" piece like the ecology
     and the clocks, and the setup screen gives it minutes. */
  minutes:          6,
  fadeMs:        1400,
  nextPage: '' /* standalone: nowhere to hand on to; start again */
};
const PINNED = /[?&]pin\b/.test(location.search);

/* The (F, k) plane, sampled ON PURPOSE rather than by habit.

   The six presets this replaces were all real, but five of the six sat at a
   characteristic feature size of 6 to 9 grid cells. Feature SIZE is what the
   eye picks up first from across a room - far more than topology - so a maze,
   a coral and a field of worms at the same scale read as the same picture
   with the lines moved around. That is why they all looked alike.

   The living region is much wider than that. Sweeping 289 points of the plane
   with the exact solver below (4000 steps, then a fine pass over the low-F
   corner) found feature scales from 6 to 61 cells, and a whole family near
   F=0.02 whose ACTIVITY - how much the field still changes per step once
   settled - runs 0.10 against 0.003 to 0.02 for everything above. Those are
   soft-edged, restless, cloudy things that look nothing like the crisp
   lattices, and none of the old presets went anywhere near them.

   Every entry below was run on FOUR seeds and kept only if its worst seed
   stayed alive and structured; `scale` and `act` are the measured medians.
   `band` is what the selector stratifies on, so two patterns in a row cannot
   both be fine-grained.

   Mitosis was dropped from this list after the fact. On paper it is a distinct
   regime - blobs that grow and split - but measured against Spots at the
   length the wall actually shows it, the two are the same picture: spectral
   cosine 0.98 to 0.998 and coverage within 0.03 of each other at EVERY point
   through the hold, not merely at the end. The splitting never becomes
   something a viewer could tell apart from spots sitting still. Pores replaces
   it, chosen as the candidate least like anything already here (worst
   similarity 0.57 against the whole set, where Spots/Mitosis scored 0.98), and
   it brings a polarity nothing else had: dark features on a pale ground. */
const PATTERNS = [
  { name:'Maze',     F:0.0290, k:0.0570, band:'fine',   scale:7,  line:'The stripes wander, join, and dead-end into a labyrinth.' },
  { name:'Spots',    F:0.0350, k:0.0645, band:'fine',   scale:7,  line:'The blobs push each other away until they are evenly spaced.' },
  { name:'Pores',    F:0.0240, k:0.0520, band:'mid',    scale:8,  line:'A pale field opens into dark pits - spots turned inside out.' },
  { name:'Solitons', F:0.0300, k:0.0620, band:'fine',   scale:7,  line:'These pulses travel, collide, and pass straight through one another.' },
  { name:'Worms',    F:0.0800, k:0.0600, band:'fine',   scale:8,  line:'The filaments lengthen, writhe, and reconnect without ever settling.' },
  { name:'Cells',    F:0.0750, k:0.0600, band:'mid',    scale:8,  line:'Thick walls close in until the field is a froth of rounded compartments.' },
  { name:'Foam',     F:0.0900, k:0.0570, band:'mid',    scale:10, line:'A few large chambers press together; their walls thin, meet and rearrange.' },
  { name:'Bacilli',  F:0.0850, k:0.0600, band:'mid',    scale:20, line:'Short rods grow end to end, then drift apart across an empty field.' },
  { name:'Flecks',   F:0.0750, k:0.0630, band:'coarse', scale:30, line:'Sparse dashes scatter slowly, leaving darkness between them.' },
  { name:'Plankton', F:0.0180, k:0.0530, band:'cloud',  scale:10, line:'A soft-edged swarm divides and drifts apart, over and over.' },
  { name:'Drift',    F:0.0200, k:0.0500, band:'cloud',  scale:22, line:'Blurred shoals swell, merge, and pull away from one another again.' },
  { name:'Bloom',    F:0.0180, k:0.0470, band:'cloud',  scale:26, line:'Broad soft blooms open into one another.' },
  { name:'Nebula',   F:0.0160, k:0.0440, band:'cloud',  scale:50, line:'Great slow rings swell, collide, and swallow one another.' }
];

/* Pick something UNLIKE the last few. A viewer sees only two patterns per
   visit, so leaving the choice to chance means seeing two fine-grained mazes
   and concluding, fairly, that it always looks the same. Recent names are kept
   across visits so the next one differs from what was on screen last night. */
const RECENT_KEY = 'reaction:recent';
function recentList(){
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch(e) { return []; }
}
function pushRecent(name){
  try {
    const r = recentList(); r.push(name);
    localStorage.setItem(RECENT_KEY, JSON.stringify(r.slice(-5)));
  } catch(e) { /* private mode: variety within the session still works */ }
}
function pickPattern(){
  const recent = recentList();
  const lastBand = pattern ? pattern.band : null;
  // first choice: a band we did not just show, and a name we have not shown lately
  let pool = PATTERNS.filter(p => p.band !== lastBand && !recent.includes(p.name));
  if (!pool.length) pool = PATTERNS.filter(p => p.band !== lastBand);
  if (!pool.length) pool = PATTERNS.filter(p => !recent.includes(p.name));
  if (!pool.length) pool = PATTERNS;
  const p = pool[Math.floor(Math.random()*pool.length)];
  pushRecent(p.name);
  return p;
}

/* EVERY ONE OF THESE USED TO END AT PAPER WHITE, and with the tone curve
   below lifting the mid-range as well, most of the active field sat near the
   top of the ramp. A screen of small bright shapes churning against near
   black is the glare half of Joe's complaint. The top stop is now a tinted
   near-white around 88% rather than 100%, which keeps the full range of the
   pattern visible and takes roughly a stop of glare off the peaks. */
const PALETTES = [
  [[3,4,10],[12,30,70],[20,110,150],[70,190,180],[176,222,216],[224,236,232]],
  [[6,3,6],[50,10,40],[140,25,60],[214,88,52],[232,176,88],[236,224,206]],
  [[2,6,4],[10,40,25],[25,105,55],[108,180,80],[196,218,132],[230,232,212]],
  [[6,4,14],[35,20,70],[95,45,150],[162,94,202],[212,168,220],[232,228,236]]
];
function ramp(pal, t) {
  t = t<0?0:t>1?1:t;
  const x=t*(pal.length-1), i=Math.min(pal.length-2, Math.floor(x)), f=x-i;
  const a=pal[i], b=pal[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}

const canvas=document.getElementById('cv');
const ctx=canvas.getContext('2d',{alpha:false});
const infoEl=document.getElementById('info');

let GW=0,GH=0,U=null,V=null,U2=null,V2=null,img=null,buf32=null,lut=null;
let pattern=null, patternIndex=-1, startedAt=0, ticks=0, lastPal=0;
let fps=0,lastFrame=performance.now(),paused=false,handingOff=false;

function sizeGrid(){
  /* A VIEWPORT WITH NO SIZE. A browser that lays this page out before the
     window has been given one reports innerWidth and innerHeight as 0, and
     0/0 is NaN while anything/0 is Infinity. Either reaches createImageData
     as "not a long", the exception kills the script BEFORE the animation loop
     has been scheduled, and the page is a permanent black rectangle that the
     resize afterwards cannot rescue. Fall back to a plain 16:9 and let that
     resize redo the grid properly. */
  const aspect=(innerWidth||1920)/(innerHeight||1080);
  GH=Math.max(150,Math.round(Math.sqrt(CONFIG.targetCells/aspect)));
  GW=Math.round(GH*aspect);
  canvas.width=GW; canvas.height=GH;
  const n=GW*GH;
  U=new Float32Array(n); V=new Float32Array(n);
  U2=new Float32Array(n); V2=new Float32Array(n);
  img=ctx.createImageData(GW,GH);
  buf32=new Uint32Array(img.data.buffer);
}

function buildLut(pal){
  lut=new Uint32Array(256);
  for(let i=0;i<256;i++){
    const c=ramp(pal,i/255);
    lut[i]=(255<<24)|(Math.round(c[2])<<16)|(Math.round(c[1])<<8)|Math.round(c[0]);
  }
}

function seed(){
  U.fill(1); V.fill(0);
  /* Scatter seeds of V, at a density set by the AREA of the grid rather than a
     fixed count.

     A few dozen discs was tuned on some smaller grid and left as an absolute
     number. At 4K this field is 471x265 - about 125,000 cells - where 35 discs
     seed barely 2% of it, against the ~16% they cover on a 128x128 test grid.
     Patterns that spread and fill on their own, like Maze and Foam, do not
     care. The sparse regimes never recover: measured on this grid, Flecks
     reached 5% of the field alive from a fixed count and 24% when the seeding
     was scaled to area, and Bacilli 13% against 37%. They were not dying, they
     were simply never sown. */
  const COVER = 0.16;                       // fraction of the field seeded
  const r0 = 3, r1 = 8, rMid = (r0+r1)/2;
  const blobs = Math.max(8, Math.round(COVER*GW*GH/(Math.PI*rMid*rMid) * (0.85+Math.random()*0.3)));
  for(let b=0;b<blobs;b++){
    const cx=Math.random()*GW, cy=Math.random()*GH, r=r0+Math.random()*(r1-r0);
    for(let y=Math.max(0,cy-r|0); y<Math.min(GH,cy+r); y++){
      for(let x=Math.max(0,cx-r|0); x<Math.min(GW,cx+r); x++){
        const dx=x-cx, dy=y-cy;
        /* Canonical seeding: leave U at 1 and set V to 1 inside the blob.
           Seeding V=0.25 with U=0.5 puts the patch almost exactly on the
           break-even between growth (U*V^2) and loss ((F+k)*V), so the moment
           diffusion thins it, every seed dies and the screen goes black. */
        if(dx*dx+dy*dy<r*r){ const i=y*GW+x; V[i]=1.0; }
      }
    }
  }
}

function newPattern(){
  patternIndex++;
  pattern=pickPattern();
  /* Palette avoids an immediate repeat for the same reason the pattern does:
     two greens in a row read as one long green piece. */
  lastPal = (lastPal + 1 + Math.floor(Math.random()*(PALETTES.length-1))) % PALETTES.length;
  buildLut(PALETTES[lastPal]);
  seed(); ticks=0; startedAt=performance.now();
  /* The preset is the STARTING POINT of the wander, not the whole show. */
  wF=pattern.F; wK=pattern.k; wTheta=Math.random()*Math.PI*2;
  walking=false; haven=null; sick=0; sdRef=0; okStreak=0; sinceSeed=0; rescues=0; nearest=pattern;
  /* ---- the episode's one sentence -------------------------------------
     A new pattern IS a new episode. Two sentences alternate by position
     rather than both firing, so the wall is silent most of every 46 seconds:

       MECHANISM - the physics, and it no longer contains a letter. The old
         wording named "U" and "V", neither of which is defined or drawn
         anywhere, so from the sofa it explained nothing. Same physics, no
         algebra. F and k stay in the diagnostics box, where the person who
         wants them is sitting at a keyboard.
       CHARACTER - what THIS pattern does, which the old permanent caption
         could never say because one sentence had to cover all thirteen.

     The plate is --plate-solid on every episode rather than chosen from the
     palette. Mean luminance is the wrong test for a field that is 55% cream
     ribbons and 45% near-black gaps IN THE SAME FRAME: the mean says "light"
     and a pale plate would land half over near-black. An opaque plate covers
     its own ground and the question stops mattering. */
  /* Joe's note: the old wording never said WHAT the picture shows. It is
     the concentration of the self-copying substance in a Gray-Scott
     reaction-diffusion cell - an abstract chemistry, so it is named by its
     role rather than by a formula it does not have. */
  const MECHANISM = 'Two dissolved substances share this dish: a feedstock '
                  + 'seeping in evenly everywhere, and a self-copying substance '
                  + 'that eats it. The picture is the self-copier\u2019s '
                  + 'concentration \u2014 bright where it is dense. Nobody drew '
                  + 'this pattern.';
  Wall.episode(patternIndex % 3 === 0 ? MECHANISM : pattern.line);
}


/* ===================== THE WANDER =====================================
   Joe, 2026-09-13: "let the visualization run for a bit until the pattern
   stabilizes, then slowly meander the parameter values ... The parameter
   meander should make slow changes so that the emergence of the pattern has
   time to catch up ... If it turns out that parts of the parameter space lead
   to no pattern, then we can confine the wander."

   WHERE IT MAY GO, MEASURED. 576 points of the (F,k) plane were run to 6,000
   steps with this page's own numerics and its own seeding, and scored on the
   spread of the self-copier: structure present, and not the saturated full
   field that k below about 0.035 gives (mean 0.92 - alive everywhere, which is
   not a pattern). 80 of 576 passed, dilated to 164 because the grid step is
   coarse next to a sharp boundary. All thirteen named patterns fall inside it.

   THE FIRST SWEEP WAS WRONG and it is worth saying why. It seeded U=0.5,
   V=0.25 and reported everything above F=0.056 dead - which would have
   condemned five of this page's own presets. The comment in seed() had already
   written down the reason: that patch sits on the break-even between growth
   and loss, so every seed dies. Rendering the real page at three of the
   "dead" presets showed healthy patterns, which is what sent me back.

   THE MASK IS A GUIDE, NOT A FENCE. It is 24x24 over a plane whose boundaries
   are sharp, so the fine edge is held by the page WATCHING ITS OWN FIELD: if
   the spread collapses or the dish saturates, the walk turns round and goes
   back to the last place it was healthy. That check cannot be wrong about the
   grid it is actually running on. */
const WALK = {
  F0:0.0050, F1:0.1200, k0:0.0300, k1:0.0750, n:24,
  mask:'000000000000000000000000000001110011110000000000000001111111111100000000000001111111111111000000000000001111111111100000000000000001111111110000000000000000111111110000000000000000011111111000000000000000001111111000000000000000001111111000000000000000000111111000000000000000000111111000000000000000000111111000000000000000000111111000000000000000001111110000000000000000001111110000000000000000011111110000000000000000011111100000000000000000111111100000000000000001111111000000000000000001111110000000000000000011111100000000000000000111111000000000000000000011000000000000',
  settleSteps: 4500,     /* let the pattern find its character before moving */
  rate:      2.5e-6,     /* normalised units per SOLVER STEP - paced by the
                            chemistry's own clock, not by the frame rate, so
                            the show is the same speed on the Pi as here */
  turn:       0.105,     /* radians of heading change per check - measured at
                            0.055 the path ran almost straight up in F */
  checkEvery:    45      /* frames between health checks */
};
let wF=0, wK=0, wTheta=0, walking=false, haven=null, sick=0, nearest=null, sdRef=0;
let okStreak=0, sinceSeed=0, rescues=0;

const wFn = () => (wF - WALK.F0)/(WALK.F1 - WALK.F0);
const wKn = () => (wK - WALK.k0)/(WALK.k1 - WALK.k0);
function maskAt(fn, kn){
  if(fn<0||fn>1||kn<0||kn>1) return false;
  const i=Math.min(WALK.n-1, Math.floor(fn*WALK.n)), j=Math.min(WALK.n-1, Math.floor(kn*WALK.n));
  return WALK.mask.charCodeAt(i*WALK.n+j) === 49;
}
/* Is the dish still making a pattern? Sampled, because this runs every frame-ish
   and the grid is 125,000 cells. */
function health(){
  let n=0, sum=0, sum2=0;
  for(let i=0;i<V.length;i+=7){ const v=V[i]; sum+=v; sum2+=v*v; n++; }
  const mean=sum/n, sd=Math.sqrt(Math.max(0, sum2/n - mean*mean));
  return { mean, sd, ok: sd > 0.020 && mean < 0.60 };
}
/* HOW CLOSE IS THE EDGE, AND WHICH WAY IS IN. The band is narrow - around
   Foam it is barely two mask cells wide - so waiting until the pattern dies is
   waiting too long. Probe a ring of directions and lean away from whichever
   are already outside. */
function edgeBias(){
  const fn=wFn(), kn=wKn(), R=0.055;
  let bx=0, by=0, out=0;
  for(let a=0; a<8; a++){
    const th=a*Math.PI/4;
    if(!maskAt(fn+Math.cos(th)*R, kn+Math.sin(th)*R)){ bx-=Math.cos(th); by-=Math.sin(th); out++; }
  }
  return out ? { x:bx, y:by, out } : null;
}
function stepWalk(frames){
  const d = WALK.rate * CONFIG.iters * frames;
  for(let attempt=0; attempt<6; attempt++){
    const fn = wFn() + Math.cos(wTheta)*d, kn = wKn() + Math.sin(wTheta)*d;
    if(maskAt(fn, kn)){
      wF = WALK.F0 + fn*(WALK.F1-WALK.F0);
      wK = WALK.k0 + kn*(WALK.k1-WALK.k0);
      return;
    }
    /* Off the edge: turn rather than stop. Stopping at a boundary parks the
       picture there for the rest of the visit, which is the one thing a
       wander must not do. */
    wTheta += (Math.PI/3) * (attempt%2 ? 1 : -1) * (1 + (attempt>>1));
  }
  if(haven){ wF=haven.F; wK=haven.k; wTheta=Math.random()*Math.PI*2; }
}
/* WHAT THE FIRST LONG RUN TAUGHT, and it could only be learnt by running it.
   Four minutes in a real browser: the walk left Plankton, marched more or less
   straight up in F, washed out at F=0.0298 and then sat there for 160 seconds
   with the spread at 0.01 and the dish going quietly uniform.

   TWO THINGS WERE WRONG.

   1. THE MAP OVERSTATES THE GROUND. Every point in the sweep was started from
      a fresh seed. Gray-Scott is multistable - where you END UP depends on
      where you came FROM - so a point you WALK into can settle into the
      uniform state even though seeding there directly gives a pattern. The
      mask is therefore an upper bound on the safe region, never a guarantee,
      and the only reliable fence is the live reading.

   2. RETREATING TO "THE LAST HEALTHY POINT" RETREATS NOWHERE. That point is
      by definition one step inside the boundary you just fell off, so the walk
      turned round, immediately failed again, and oscillated on the edge.

   So the haven is kept a real distance behind, retreating RESEEDS the dish -
   a washed-out field will not recover on its own, because uniform is a stable
   state, and a fresh seed is exactly how the page starts in the first place -
   and the walk now turns away when the pattern starts FADING rather than
   waiting until it is gone. */
const HAVEN_GAP = 0.045;     /* normalised distance a haven must be behind */
function checkWalk(){
  sinceSeed++;
  const h = health();
  /* A freshly sown dish is uniform by construction. Judging it in the first
     couple of seconds after a reseed is judging the seed, not the chemistry. */
  if(sinceSeed < 4) return h;

  wTheta += (Math.random()-0.5)*2*WALK.turn;

  /* Lean away from the edge of the measured region while there is still room
     to turn. */
  const b = edgeBias();
  if(b){
    const want = Math.atan2(b.y, b.x);
    let d = want - wTheta;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    wTheta += d * Math.min(0.5, 0.12*b.out);
  }

  if(h.ok){
    sick=0; okStreak++;
    sdRef = Math.max(h.sd, sdRef*0.98);
    /* THE HAVEN MUST HAVE PROVED ITSELF. Health is a reading of the FIELD, and
       the field lags the parameters: a point can look healthy on the strength
       of a pattern built somewhere else a moment ago. Measured - the first
       version adopted a haven that did not pattern at all, retreated to it,
       reseeded, died, and did that twenty-four times in five minutes. So a
       point is only a haven after the dish has stayed healthy there for a
       while, and only once we are a real distance from the last one. */
    if(okStreak >= 8){
      if(!haven) haven={F:wF, k:wK};
      else {
        const df=(wF-haven.F)/(WALK.F1-WALK.F0), dk=(wK-haven.k)/(WALK.k1-WALK.k0);
        if(Math.sqrt(df*df+dk*dk) > HAVEN_GAP) haven={F:wF, k:wK};
      }
      rescues = 0;
    }
    if(sdRef > 0 && h.sd < 0.55*sdRef) wTheta += (Math.random()<0.5?-1:1)*(0.6+Math.random()*0.6);
  } else {
    sick++; okStreak=0;
    if(sick>=2){
      rescues++;
      /* Twice rescued without the dish coming back means the haven is no good
         either. Go to one of the thirteen named patterns, which are known to
         work because the page has been showing them for a year. */
      if(rescues>=2 || !haven){
        const p = PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
        wF=p.F; wK=p.k; haven=null; rescues=0;
      } else {
        wF=haven.F; wK=haven.k;
      }
      wTheta=Math.random()*Math.PI*2;
      seed(); ticks=0; walking=false; sick=0; sdRef=0; okStreak=0; sinceSeed=0;
    }
  }
  return h;
}
/* The nearest named pattern, so the panel can say where in the plane we are
   and the wall can speak when the character changes. */
function nearestPattern(){
  let best=null, bd=1e9;
  for(const p of PATTERNS){
    const df=(p.F-wF)/(WALK.F1-WALK.F0), dk=(p.k-wK)/(WALK.k1-WALK.k0);
    const d=df*df+dk*dk;
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}

/* One solver step. The Laplacian is the standard 9-point stencil (0.05 on
   diagonals, 0.2 on edges, -1 centre) which is noticeably less grid-aligned
   than the 5-point version - with 5-point, stripes visibly prefer to run
   along the axes, which looks like an artefact because it is one. */
function step(){
  const F=wF, k=wK, Du=CONFIG.Du, Dv=CONFIG.Dv, dt=CONFIG.dt;
  for(let y=0;y<GH;y++){
    const ym=((y-1+GH)%GH)*GW, y0=y*GW, yp=((y+1)%GH)*GW;
    for(let x=0;x<GW;x++){
      const xm=(x-1+GW)%GW, xp=(x+1)%GW;
      const i=y0+x;
      const u=U[i], v=V[i];
      const lu = 0.05*(U[ym+xm]+U[ym+xp]+U[yp+xm]+U[yp+xp])
               + 0.20*(U[ym+x]+U[yp+x]+U[y0+xm]+U[y0+xp]) - u;
      const lv = 0.05*(V[ym+xm]+V[ym+xp]+V[yp+xm]+V[yp+xp])
               + 0.20*(V[ym+x]+V[yp+x]+V[y0+xm]+V[y0+xp]) - v;
      const uvv = u*v*v;
      let nu = u + (Du*lu - uvv + F*(1-u))*dt;
      let nv = v + (Dv*lv + uvv - (F+k)*v)*dt;
      U2[i] = nu<0?0:nu>1?1:nu;
      V2[i] = nv<0?0:nv>1?1:nv;
    }
  }
  let t;
  t=U; U=U2; U2=t;
  t=V; V=V2; V2=t;
  ticks++;
}

function render(){
  const n=GW*GH;
  for(let i=0;i<n;i++){
    /* V tops out near 0.45 and averages under 0.01, so a linear stretch
       clips every active region to flat white and floors the gradients
       between them to black - which renders a filled, structured field as
       bare outlines. Normalise to the actual ceiling and lift the low end. */
    let v=V[i]*2.6;
    if(v>1) v=1;
    /* 0.62 lifted the low end hard, which was right when the worry was that
       faint structure fell below the first visible step - but it also dragged
       the broad mid-range up towards the bright end, so most of the field
       read as "lit". 0.78 keeps the faint gradients and lets the quiet parts
       stay quiet. */
    v=Math.pow(v,0.78);
    buf32[i]=lut[(v*255)|0];
  }
  ctx.putImageData(img,0,0);
}

/* The permanent readout: where in the plane the dish is, right now. A wander
   with no numbers on screen is just a picture that will not hold still. */
let lastHealth = null;
function panel(){
  Wall.instrument({ place:'tr', cols:1, rows:[
    { k:'feed F',  v:wF.toFixed(4) },
    { k:'kill k',  v:wK.toFixed(4) },
    { k:'nearest', v: walking ? (nearest?nearest.name:'\u2014') : 'settling' }
  ]});
}
function updateInfo(){
  infoEl.textContent =
    `start     ${pattern.name}\n` +
    `feed F    ${wF.toFixed(5)}  (start ${pattern.F.toFixed(4)})\n` +
    `kill k    ${wK.toFixed(5)}  (start ${pattern.k.toFixed(4)})\n` +
    `walking   ${walking?'yes':'settling'}  sick ${sick}  ok ${okStreak}  rescues ${rescues}\n` +
    `health    ${lastHealth?('sd '+lastHealth.sd.toFixed(3)+' mean '+lastHealth.mean.toFixed(3)+(lastHealth.ok?' ok':' LOW')):'-'}\n` +
    `nearest   ${nearest?nearest.name:'-'}\n` +
    `grid      ${GW} x ${GH}\n` +
    `steps     ${ticks}  (${CONFIG.iters}/frame)\n` +
    `elapsed   ${((performance.now()-startedAt)/1000).toFixed(0)}s\n` +
    `fps       ${fps.toFixed(0)}${paused?'  [PAUSED]':''}`;
}

function handOff(){
  /* Stop the language schedule before the fade, or a beat fires into a
     document on its way out and reads as the next page's caption. */
  Wall.clearEpisode(); Wall.clearTimers();
  if(handingOff) return;
  handingOff=true;
  document.body.style.transition=`opacity ${CONFIG.fadeMs}ms ease-in-out`;
  document.body.style.opacity='0';
  /* An EMPTY nextPage means there is nowhere to hand on to - which is what
     build_github.py leaves behind when it cuts this page out of the wall's
     rotation for publishing. Start again instead. */
  setTimeout(()=>{ if(CONFIG.nextPage) location.href=Wall.nextPage(CONFIG.nextPage);
                   else location.reload(); },CONFIG.fadeMs);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=now-lastFrame; lastFrame=now;
  fps=fps?fps*0.9+(1000/dt)*0.1:1000/dt;
  if(paused||handingOff) return;
  if(!PINNED && now-startedAt > Wall.holdMs(CONFIG.minutes)){ handOff(); return; }
  for(let s=0;s<CONFIG.iters;s++) step();

  /* Settle first, then wander - the point of the whole thing is that you can
     watch the pattern emerge, and only then watch it change. */
  if(!walking && ticks >= WALK.settleSteps){ walking=true; if(!haven) haven={F:wF,k:wK,sd:0}; }
  if(walking){
    stepWalk(1);
    if(ticks % (WALK.checkEvery*CONFIG.iters) < CONFIG.iters){
      lastHealth = checkWalk();
      const n = nearestPattern();
      if(n !== nearest){ nearest = n; Wall.lane(n.line); }
    }
  }
  render();
  panel();
  if(document.body.classList.contains('showinfo')) updateInfo();
}

addEventListener('resize',()=>{ sizeGrid(); seed(); });
addEventListener('keydown',(e)=>{
  switch(e.key){
    case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
    case 'n': case 'N': newPattern(); break;
    case 'p': case 'P': case ' ': paused=!paused; updateInfo(); break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    default:
      if(/^[0-9]$/.test(e.key)){
        const score=e.key==='0'?10:parseInt(e.key,10);
        console.log('[reaction] RATING STUB - score',score,'pattern',pattern&&pattern.name);
      }
  }
});

sizeGrid();
newPattern();
requestAnimationFrame(frame);
</script>
<script src="nav.js"></script>
