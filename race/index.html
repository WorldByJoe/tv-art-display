<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Race</title>
<!-- ==========================================================================
  race.html - a mountain-bike race across a Strata landscape. Joe, 2026-09-07.
  The show, in four acts (his order):
    1. THE LAND. A Strata world folds and erodes for three hundred thousand
       years (strata_engine.js in a worker, strata_view.js drawing), then
       freezes: the race course will be cut into this.
    2. THE COURSE. The engine picks a scale (a 50 m erosion cell becomes 10 m,
       so a 16 km block becomes 3.2 km - slopes are unchanged, so cliffs stay
       cliffs), finds a straight gentle two-track for the start, and searches
       for a 2-5 mile loop: grade capped at 12%, cliffs off limits, turns
       priced - the switchbacks are found, not drawn (race_planner.js in a
       worker). The search is shown on the geologic map as it happens.
    3. THE RACERS. Eight riders on cards: climbing watts, sprint, how truly
       they read the ground, how near the limit they can ride, how near it
       they choose to, and how long they last (race_sim.js) - so you know
       who to root for. (No favourite is named - Joe, 2026-09-08.)
    4. THE RACE. Two laps at four times real time. One view of the whole
       course with every rider on it (the cached geologic map, LEFT), one
       view for the exciting moments (the ray-marcher, top of the RIGHT
       column, pointed by a director at the closest battle, a pass, a crash,
       the finish) - the two never overlap (Joe, 2026-09-08: the window had
       covered half the course). Under the window, the board: every rider's
       position, gap, and a live line - speed, watts, energy left, what they
       are doing on which rock; across the bottom of the window, the physics
       of the followed rider - grade, rock, grip, the true limit, what the
       rider perceives, their speed. Ground speckle by rock roughness and a
       trail ribbon coloured by bed, dashed where loose (his ask: see the
       trail conditions and how the riders manage them). Physics-limited: a rider
       who enters a bend faster than it allows slides - down for a few
       seconds on open ground, OUT over an edge. Tired riders make mistakes.
       Then the results, and a new land.
  Preview with ?pin (pinned, it reloads itself with a new seed after each
  race, which keeps the wall's watchdog quiet). ?act=2|3|4&seed=N (and
  &race=SECONDS for act 4) runs synchronously to that point for a photograph.
  Not in the ring.
========================================================================== -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060c; overflow:hidden; }
  * { cursor:none; }
  #cv { position:fixed; inset:0; width:100vw; height:100vh; transition:opacity 1.6s ease-in-out; }
  #ui { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; }
  /* the chase window: a PANEL top-right, the one picture-in-picture on the wall */
  #chase { position:fixed; right:var(--safe-x); top:var(--safe-y); width:calc(1280*var(--wu)); height:calc(720*var(--wu));
    border:1px solid var(--edge); border-radius:var(--r); box-shadow:var(--shadow); display:none; background:#04060c; }
  #heli { position:fixed; display:none; opacity:0; transition:opacity 1.4s ease-in-out; border-radius:calc(8*var(--wu)); }
  #chasecap { position:fixed; right:var(--safe-x); top:calc(var(--safe-y) + 720*var(--wu) + 16*var(--wu)); z-index:6;
    font:400 var(--t4)/1.3 var(--font-num); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2);
    text-shadow:0 1px 5px rgba(0,0,0,.85); display:none; max-width:calc(1280*var(--wu)); text-align:right; }
  body .instr.bl { bottom: calc(var(--band) + 120*var(--wu)); }
  #pname { position:fixed; left:var(--safe-x); top:var(--safe-y); z-index:6;
    font:italic 400 var(--t1)/1.1 Georgia, "Times New Roman", serif; color:var(--ink);
    text-shadow:0 1px 5px rgba(0,0,0,.85), 0 0 18px rgba(0,0,0,.6); }
</style>
<link rel="stylesheet" href="wall.css">
<script src="wall.js"></script>
<script src="nav.js"></script>
<script>document.write(['strata_engine.js','strata_view.js','race_planner.js','race_sim.js'].map(f=>'<script src="'+f+'?v='+Date.now()+'"><\/script>').join(''));</script>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<canvas id="ui"></canvas>
<canvas id="chase" width="960" height="540"></canvas>
<canvas id="heli" width="960" height="540"></canvas>
<div id="chasecap"></div>
<div id="pname">The Race</div>
<div id="info"></div>
<script>
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){ const here=(location.pathname.split('/').pop()||'kiosk.html'); let i=ROTATION.indexOf(here); if(i<0) i=0; location.href=ROTATION[(i+step+ROTATION.length)%ROTATION.length]; }
const CONFIG = {
  freezeStep: 600,        // erosion steps before the land is frozen (300,000 model years)
  raceCell: 10,           // metres per erosion cell at the race scale
  loop:{minLen:3200, maxLen:8000, targetLen:5000},   // 2-5 miles
  /* gradeCap is no longer set here: the planner picks a grade of difficulty for
     the day and the cap comes with it (easy 10%, medium 18%, hard 30%). Add
     ?grade=easy|medium|hard to demand one, or ?cap=0.24 to override outright. */
  slopeMax:0.7,
  riders: 8, laps: 2,
  timeScale: 4,           // race seconds per real second
  rosterSec: 30,          // how long the cards stand
  resultsSec: 45,         // the ranked cards at the end
  mapSec: 40, heliSec: 30,  // the overview alternates: flat map, then the helicopter orbit
  orbitSec: 490, vexag:1.8, fpsCap:8,
  nextPage: '' /* standalone: nowhere to hand on to; start again */,  // back to the mosaic when the race is over
  holdMin:20,             // NOT the pacing - a full show runs ~11 min. This is the
                          // deadline for a show that has somehow stalled.
};
const Q=new URLSearchParams(location.search), PINNED=Q.has('pin');
let seed=Q.has('seed')?(Q.get('seed')|0):((Math.random()*1e9)|0);
const SYNC_ACT=Q.has('act')?(Q.get('act')|0):0, SYNC_RACE=Q.has('race')?(+Q.get('race')):0, FORCE_HELI=Q.has('heli');
const SELF=location.pathname.split('/').pop()||'race.html';

/* ---- the ladder ---- */
const TIER={t0:160,t1:80,t2:58,t3:44,t4:32,t5:26}, FLOOR={t0:56,t1:30,t2:22,t3:17,t4:13,t5:11};
const TS=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ts'))||1;
let DPR=1, WU=1, T=k=>0;
function setTypeScale(){ DPR=devicePixelRatio||1; WU=(innerWidth/3840)*DPR; T=k=>Math.max(FLOOR[k]*DPR, TIER[k]*TS*WU); }
const INK='rgba(240,246,253,.95)', INK2='rgba(210,224,242,.80)', WARM='rgba(255,226,176,.96)', PLATE='rgba(8,11,18,.70)', EDGE='rgba(255,255,255,.16)';
const MONO='ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace', UI='ui-sans-serif, system-ui, sans-serif';

/* ---- state ---- */
const cv=document.getElementById('cv'), ui=document.getElementById('ui'), uctx=ui.getContext('2d');
const chaseCv=document.getElementById('chase'), cctx=chaseCv.getContext('2d'), chaseCap=document.getElementById('chasecap');
const heliCv=document.getElementById('heli'), hctx=heliCv.getContext('2d');
const view=StrataView.create(cv), chaseView=StrataView.create(chaseCv); let heliView=null;   // the helicopter canvas is sized to the map frame at race start
let day=null, painter=null, heliOn=false, heliAt=0, prevPos=null, lastHeli=0, mapFrame=null;
/* flash text goes over the upper part of the map, where nothing else lives */
function flash(text){ const at=mapFrame?{x:(mapFrame.x+mapFrame.W/2)/DPR, y:(mapFrame.y+mapFrame.H*0.2)/DPR}:null; Wall.moment(text, at?{at,exact:true}:{}); }
let w=null, act=0, t0=performance.now(), actAt=performance.now(), frozen=false, plan=null;
let mapAlpha=0, revealed=0, worker=null, busy=false, planner=null;
let trail=null, riders=null, race=null, fav=null, cam=null, director={subject:null,until:0,text:'',kind:''}, lastEvent=0;

/* the erosion worker (as in strata.html) */
function makeWorker(){
  const body=`(${StrataFactory.toString()})(self); let w=null;
    self.onmessage=(e)=>{ const m=e.data;
      if(m.cmd==='new'){ w=Strata.makeWorld(m.seed); self.postMessage({cmd:'ready'}); }
      else if(m.cmd==='step'&&w){ for(let i=0;i<m.n;i++) Strata.step(w); self.postMessage({cmd:'state', z:w.z.slice(0), rain:w.rain.slice(0), step:w.step, removed:w.removed}); } };`;
  const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
  wk.onmessage=(e)=>{ const m=e.data; if(m.cmd==='ready') busy=false; else if(m.cmd==='state'){ w.z.set(m.z); w.rain.set(m.rain); w.step=m.step; w.removed=m.removed; busy=false; } };
  return wk;
}
/* the planner worker */
function makePlanner(){
  const body=`(${RacePlannerFactory.toString()})(self);
    self.onmessage=(e)=>{ const m=e.data; const L=RacePlanner.loop(m.z,m.nx,m.ny,m.cell,m.opts); if(L){ delete L.P; } self.postMessage({cmd:'plan', L}); };`;
  const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
  wk.onmessage=(e)=>{ onPlan(e.data.L); };
  return wk;
}
function raceZ(){ const s=CONFIG.raceCell/w.dx, z=new Float64Array(w.N); for(let i=0;i<w.N;i++) z[i]=w.z[i]*s; return z; }
function planOpts(){
  const q=new URLSearchParams(location.search);
  const o=Object.assign({seed:seed*7+1,tries:12,slopeMax:CONFIG.slopeMax},CONFIG.loop);
  if(q.get('grade')) o.difficulty=q.get('grade');
  if(q.get('cap')) o.gradeCap=parseFloat(q.get('cap'));
  return o;
}   // attempts per start line; each is tens of ms
function onPlan(L){
  plan=L; revealed=0;
  if(!L){ Wall.lane('No rideable loop on this land. A new one folds.'); Wall.after(8000,()=>nextWorld()); return; }
  /* Name the course by what it IS, measured off its own line, not by the cap
     the router was given. An easy course zigzags because it may not climb hard;
     a hard one goes at the pitch head on and pays for it in the legs. */
  const g=L.grade||{mean:0,max:0};
  const say={easy:'An easy course',medium:'A middling course',hard:'A hard course'}[L.tier]||'A course';
  Wall.lane(say+': '+(L.length/1000).toFixed(1)+' km, '+Math.round(L.climb)+' m of climbing, '+
            L.switchbacks+' switchbacks. Grades average '+(100*g.mean).toFixed(1)+' % and reach '+
            (100*g.max).toFixed(0)+' %; cliffs are off limits, so the trail zigzags where it must.');
}
function nextWorld(){ const next=(seed*1664525+1013904223)>>>0; if(PINNED) location.replace(SELF+'?pin&seed='+next); else newWorld(next); }

function newWorld(s){
  seed=s; w=Strata.makeWorld(seed); view.setWorld(w); frozen=false; plan=null; trail=null; riders=null; race=null; mapAlpha=0; revealed=0;
  act=1; t0=actAt=performance.now(); cv.style.opacity='1'; chaseCv.style.display='none'; chaseCap.style.display='none';
  Wall.clearEpisode(); Wall.clearTimers();
  if(SYNC_ACT){
    for(let i=0;i<CONFIG.freezeStep;i++) Strata.step(w); frozen=true;
    if(SYNC_ACT>=2){ act=2; mapAlpha=1; cv.style.opacity='0'; onPlan(RacePlanner.loop(raceZ(),w.nx,w.ny,CONFIG.raceCell,planOpts())); revealed=1e9; }
    if(SYNC_ACT>=3 && plan){ startRoster(); }
    if(SYNC_ACT>=4 && plan){ startRace(); for(let t=0;t<SYNC_RACE;t+=0.1) RaceSim.step(race,0.1); direct(true); while(painter&&!painter.done) painter.paintRows(200); }
    if(SYNC_ACT>=5 && plan){ while(!race.done && race.t<7200) RaceSim.step(race,0.1); race.resultsAt=performance.now(); showResults(); }
  } else {
    if(!worker) worker=makeWorker(); busy=true; worker.postMessage({cmd:'new',seed});
    Wall.episode('First the land: folded beds, rained on for three hundred thousand years, then frozen. The race will be cut into this.');
  }
  Wall.every(100,tick);
}
function startRoster(){
  act=3; actAt=performance.now(); riders=RaceSim.makeRiders(seed^0x5bd1e995,CONFIG.riders); fav=RaceSim.favourite(riders);
  trail=RaceSim.buildTrail(plan,w,CONFIG.raceCell,2); day=RaceSim.makeDay(seed);
  /* the crisp zoomed map is painted now, in chunks, while the cards stand */
  const r=courseRect(); setTypeScale(); const SX=134*WU, floor=(200*TS+120)*WU, boxW=ui.width-2*SX-(1280+60)*WU, boxH=ui.height-floor-76*WU-T('t1')*1.4;
  const sc=Math.min(boxW/r.w, boxH/r.h); painter=StrataView.mapPainter(view,r,Math.round(r.w*sc),Math.round(r.h*sc));
  heliOn=false; heliAt=performance.now(); prevPos=null;
  Wall.lane('Race day: '+day.label+'. Eight riders, each drawn at random: climb, sprint, sight, skill, nerve, stamina and heat.',{hold:12000});
}
/* two laps, three when the planner had to settle for a short loop (under 2 miles) */
function lapsFor(){ return plan && plan.length<3200 ? 3 : CONFIG.laps; }
function startRace(){
  act=4; actAt=performance.now(); race=RaceSim.makeRace(trail,riders,lapsFor(),seed,day);
  chaseView.setWorld(w); chaseCv.style.display='block'; chaseCap.style.display='block'; heliCv.style.display='block'; cam=null; lastEvent=0;
  /* the helicopter canvas takes the map frame's aspect, about half a megapixel */
  { const r=courseRect(); setTypeScale(); const SX=134*WU, floor=(200*TS+120)*WU, boxW=ui.width-2*SX-(1280+60)*WU, boxH=ui.height-floor-76*WU-T('t1')*1.4;
    const sc=Math.min(boxW/r.w, boxH/r.h), fw=r.w*sc, fh=r.h*sc, cw=Math.round(Math.sqrt(520000*fw/fh)), chh=Math.round(520000/cw);
    heliCv.width=cw; heliCv.height=chh; heliView=StrataView.create(heliCv); heliView.setWorld(w); }
  heliOn=!!FORCE_HELI; heliAt=performance.now(); prevPos=race.riders.map(r=>r.pos);
  Wall.lane((lapsFor()===3?'Three laps':'Two laps')+'. The start is the two-track, wide enough to sprint; after that the trail is one bike wide and passing needs a straight.',{hold:9000});
}
function tick(){
  if(!w) return; const now=performance.now();
  if(act===1){
    if(!frozen){ if(!busy && w.step<CONFIG.freezeStep){ busy=true; worker.postMessage({cmd:'step',n:6}); }
      if(w.step>=CONFIG.freezeStep){ frozen=true; actAt=now; Wall.lane('Frozen. Now the scale: one cell is '+CONFIG.raceCell+' m, the block '+(w.nx*CONFIG.raceCell/1000).toFixed(1)+' by '+(w.ny*CONFIG.raceCell/1000).toFixed(1)+' km - the slopes are the same, so the cliffs are still cliffs.'); } }
    else if(now-actAt>9000){ act=2; actAt=now; if(!planner) planner=makePlanner(); planner.postMessage({z:raceZ(),nx:w.nx,ny:w.ny,cell:CONFIG.raceCell,opts:planOpts()}); }
  }
  else if(act===2){ mapAlpha=Math.min(1,(now-actAt)/1600); cv.style.opacity=String(1-mapAlpha); if(plan){ revealed+=0.4; if(revealed*40>plan.segs.reduce((a,s)=>a+s.explored.length,0)+plan.path.length*2+320) startRoster(); } }
  else if(act===3){ if(now-actAt>CONFIG.rosterSec*1000) startRace(); }
  else if(act===4){
    if(!race.done && !race.resultsAt){ for(let i=0;i<CONFIG.timeScale;i++){ RaceSim.step(race,0.1); if(race.done) break; }
      passes();
      if(race.done || (race.finished>0 && race.t-race.riders.filter(r=>r.finish).reduce((a,r)=>Math.min(a,r.finish),1e9)>150)) race.resultsAt=now; }
    else if(race.resultsAt && !race.resultsSaid){ showResults(); }
    /* the overview alternates between the flat map and the helicopter */
    if(!FORCE_HELI && now-heliAt>(heliOn?CONFIG.heliSec:CONFIG.mapSec)*1000){ heliOn=!heliOn; heliAt=now; }
    heliCv.style.opacity=heliOn?'1':'0';
    direct(false);
  }
  if(!PINNED && now-t0>CONFIG.holdMin*60000) handOff();     // the stalled-show deadline; the normal exit is showResults()
}
/* a change of order between two riders on the trail: flash it, and cut to it */
function passes(){
  const now=performance.now(); const R=race.riders;
  for(const r of R){ const was=prevPos[r.i]; if(r.pos<was && r.status==='riding' && race.t>30){
      const passed=R.find(o=>o.pos===r.pos+1); if(passed && passed.status==='riding' && Math.abs(passed.gapAhead)<12){
        flash('#'+r.num+' '+r.name+' passes #'+passed.num);
        director={subject:r,until:now+6000,kind:'pass',text:'#'+r.num+' '+r.name+' passes #'+passed.num+' '+passed.name}; } } }
  prevPos=R.map(r=>r.pos);
}
/* the results: the cards again, ranked, with the tallies; then a new land */
function showResults(){
  race.resultsSaid=true; act=5; actAt=performance.now();
  chaseCv.style.display='none'; chaseCap.style.display='none'; heliCv.style.display='none';
  const p=race.riders.filter(r=>r.finish).sort((a,b)=>a.finish-b.finish);
  Wall.lane(p.length?('#'+p[0].num+' '+p[0].name+' wins in '+clockStr(p[0].finish)+(p[1]?', #'+p[1].num+' '+p[1].name+' at +'+clockStr(p[1].finish-p[0].finish):'')+'. '+(race.out?race.out+' out over the edge. ':'')+'Calories and litres are what the day cost each rider.'):'Nobody finished.',{hold:16000});
  /* THE SHOW IS OVER, SO LEAVE (Joe, 2026-09-10: the wall should advance on
     COMPLETION, not on a clock). In the ring the page hands on as soon as the
     results cards have had their time; pinned, it folds a new land instead. */
  Wall.after(CONFIG.resultsSec*1000,()=>{ if(!PINNED && CONFIG.nextPage) handOff(); else nextWorld(); });
}
function handOff(){ Wall.clearEpisode(); Wall.clearTimers(); document.body.style.transition='opacity 1400ms ease-in-out'; document.body.style.opacity='0'; setTimeout(()=>{ location.href=CONFIG.nextPage; },1500); }

/* ---- the director: what the chase window shows, and what the lane says ---- */
function direct(sync){
  const now=performance.now(); const R=race.riders;
  /* new events since last look */
  for(let i=lastEvent;i<race.events.length;i++){ const e=race.events[i];
    if(e.kind==='crash'){ director={subject:e.rider,until:now+7000,kind:'crash',text:'#'+e.rider.num+' '+e.rider.name+' down on the '+e.seg.bed}; if(!sync) flash('#'+e.rider.num+' '+e.rider.name+' goes down on the '+e.seg.bed); }
    else if(e.kind==='out'){ director={subject:e.rider,until:now+8000,kind:'out',text:'#'+e.rider.num+' '+e.rider.name+' over the edge · out'}; if(!sync) Wall.lane('#'+e.rider.num+' '+e.rider.name+' carries too much speed into the '+e.seg.bed+' and goes over the edge. Out of the race.'); }
    else if(e.kind==='finish'&&e.place===1){ director={subject:e.rider,until:now+8000,kind:'finish',text:'#'+e.rider.num+' '+e.rider.name+' takes the win'}; }
    else if(e.kind==='lap'&&e.rider.pos===1&&e.lap<race.laps){ if(!sync) flash('#'+e.rider.num+' '+e.rider.name+' leads into lap '+(e.lap+1)); }
  }
  lastEvent=race.events.length;
  if(now>director.until || !director.subject || director.subject.status==='out'||director.subject.status==='finished'){
    /* the closest battle on the trail, else the leader */
    const on=R.filter(r=>r.status==='riding'||r.status==='down').sort((a,b)=>a.pos-b.pos);
    let best=null, bg=1e9;
    for(let i=1;i<on.length;i++){ const g=(on[i-1].lap*trail.L+on[i-1].s)-(on[i].lap*trail.L+on[i].s); if(g<bg){ bg=g; best=on[i]; } }
    if(best && bg<25){ director={subject:best,until:now+12000,kind:'battle',text:'#'+best.num+' '+best.name+' on the wheel of #'+on[on.indexOf(best)-1].num+' · '+bg.toFixed(0)+' m'}; }
    else if(on.length){ const ld=on[0]; director={subject:ld,until:now+12000,kind:'leader',text:'#'+ld.num+' '+ld.name+' leads · lap '+(ld.lap+1)+' of '+race.laps}; }
    else director={subject:null,until:now+5000,kind:'none',text:'the race is over'};
  }
  chaseCap.textContent=director.text;
}

/* ---- drawing ---- */
let lastFrame=0;
function frame(now){ if(now-lastFrame>=1000/CONFIG.fpsCap){ lastFrame=now; draw(now); } requestAnimationFrame(frame); }
function draw(now){
  setTypeScale();
  if(ui.width!==Math.round(innerWidth*DPR)||ui.height!==Math.round(innerHeight*DPR)){ ui.width=Math.round(innerWidth*DPR); ui.height=Math.round(innerHeight*DPR); }
  const W=ui.width, H=ui.height; uctx.clearRect(0,0,W,H);
  if(!w) return;
  if(act===1 || (act===2 && mapAlpha<1)) view.render(StrataView.orbitCamera(w,(now-t0)/1000,CONFIG.orbitSec),{vexag:CONFIG.vexag, rain:!frozen});
  if(painter && !painter.done) painter.paintRows(act===3?90:40);     // the crisp map, a few rows a frame
  if(act===2 || act===4){
    const SX=134*WU, SY=76*WU, floor=(200*TS+120)*WU;
    const right=act===4?(1280+60)*WU:0;                              // the right column: chase window + board
    const box={x:SX, y:SY+T('t1')*1.4, W:W-2*SX-right, H:H-floor-SY-T('t1')*1.4};
    uctx.globalAlpha=mapAlpha; uctx.fillStyle='#04060c'; uctx.fillRect(0,0,W,H);
    /* in the race the map is zoomed to the course (Joe, 2026-09-08), crisp once painted */
    let M;
    if(act===4 && painter && painter.done){ const r=painter.src, sc=Math.min(box.W/r.w, box.H/r.h), px0=box.x+(box.W-r.w*sc)/2, py0=box.y+(box.H-r.h*sc)/2;
      uctx.drawImage(painter.canvas,px0,py0,r.w*sc,r.h*sc); M={x0:px0-r.x0*sc, y0:py0-r.y0*sc, s:sc, frame:{x:px0,y:py0,W:r.w*sc,H:r.h*sc}}; }
    else M=StrataView.drawMap(uctx,view,box,act===4?courseRect():null);
    if(M && plan) drawCourse(M, act===4);
    if(M && act===4) drawRiders(M);
    if(M && act===4) placeHeli(M);
    uctx.globalAlpha=1;
  }
  if(act===3) drawRoster(W,H,false);
  if(act===5) drawRoster(W,H,true);
  if(act===4){ drawChase(); if(heliOn||FORCE_HELI) drawHeli(now); drawBoard(W,H); }
  drawInstrument();
}
const cellToMap=(M)=>{ const U=StrataView.U; return (x,y)=>[M.x0+x*U*M.s, M.y0+y*U*M.s]; };
/* the course's bounding box in fine cells, with a margin, for the zoomed map */
function courseRect(){
  if(courseRect.c && courseRect.c.trail===trail) return courseRect.c.r;
  const U=StrataView.U; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

/* act 4: the chase window - the ray-marcher behind the director's subject */
function groundZ(x,y){ const nx=w.nx, xi=Math.max(0,Math.min(nx-2,x|0)), yi=Math.max(0,Math.min(w.ny-2,y|0)), fx=x-xi, fy=y-yi, c=yi*nx+xi;

  const proj=(X,Y,Z)=>{ const dx=X-cam.x, dy=Y-cam.y; let rel=Math.atan2(dy,dx)-cam.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); if(Math.abs(rel)>1.1) return null;

  cctx.fillStyle='rgba(210,224,242,.80)'; cctx.fillText(line2,16,RH-sh*0.50); cctx.fillText(line3,16,RH-sh*0.22);
}
/* the helicopter: the ray-marcher orbiting the course, laid over the map box */
function placeHeli(M){ const f=M.frame; mapFrame=f; heliCv.style.left=(f.x/DPR)+'px'; heliCv.style.top=(f.y/DPR)+'px'; heliCv.style.width=(f.W/DPR)+'px'; heliCv.style.height=(f.H/DPR)+'px'; }
function drawHeli(now){
  if(now-lastHeli<200) return; lastHeli=now;                           // 5 fps is plenty for a slow orbit
  const r=courseRect(), U=StrataView.U, cx=(r.x0+r.w/2)/U, cy=(r.y0+r.h/2)/U, ext=Math.max(r.w,r.h)/U;
  const a=((now-actAt)/1000)/150*2*Math.PI, rad=0.75*ext+12;
  let zmax=-1e9, zmean=0, n=0; for(let i=0;i<trail.n;i+=8){ const e=trail.S[i].zE; if(e>zmax) zmax=e; zmean+=e; n++; } zmean/=n;

  const RW=heliCv.width, RH=heliCv.height, f=(Math.max(RW,RH)/2)/Math.tan(StrataView.FOV/2), horizon=RH/2-f*Math.tan(hc.pitch);
  const proj=(X,Y,Z)=>{ const dx=X-hc.x, dy=Y-hc.y; let rel=Math.atan2(dy,dx)-hc.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); if(Math.abs(rel)>1.1) return null;

/* the instrument: bottom-left, one plate */
