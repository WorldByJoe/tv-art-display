<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Race</title>
<!-- ==========================================================================
  race.html · v2.0 · 2026-10-13
  a mountain-bike race across a Strata landscape. Joe, 2026-09-07.
  The show, in four acts (his order):
    1. THE LAND. A Strata world folds and erodes for three hundred thousand
       years (strata_engine.js in a worker, strata_view.js drawing), then
       freezes: the race course will be cut into this.
    2. THE COURSE. The engine picks a scale (a 50 m erosion cell becomes 10 m,
       so a 16 km block becomes 3.2 km - slopes are unchanged, so cliffs stay
       cliffs), finds a straight gentle two-track for the start, and searches
       for a 2-5 mile loop: grade capped at 12%, cliffs off limits, turns
       priced - the switchbacks are found, not drawn (race_planner.js in a
       worker). The search is shown on the geologic map as it happens.
    3. THE RACERS. Eight riders on cards: climbing watts, sprint, how truly
       they read the ground, how near the limit they can ride, how near it
       they choose to, and how long they last (race_sim.js) - so you know
       who to root for. (No favourite is named - Joe, 2026-09-08.)
    4. THE RACE. One lap at four times real time (Joe, 2026-10-13: one longer
       lap, not two), sped up once the winner is home so the field finishes.
       Under the map, a chart of every rider's place against distance (his
       ask, the same day). One view of the whole
       course with every rider on it (the cached geologic map, LEFT), one
       view for the exciting moments (the ray-marcher, top of the RIGHT
       column, pointed by a director at the closest battle, a pass, a crash,
       the finish) - the two never overlap (Joe, 2026-09-08: the window had
       covered half the course). Under the window, the board: every rider's
       position, gap, and a live line - speed, watts, energy left, what they
       are doing on which rock; across the bottom of the window, the physics
       of the followed rider - grade, rock, grip, the true limit, what the
       rider perceives, their speed. Ground speckle by rock roughness and a
       trail ribbon coloured by bed, dashed where loose (his ask: see the
       trail conditions and how the riders manage them). Physics-limited: a rider
       who enters a bend faster than it allows slides - down for a few
       seconds on open ground, OUT over an edge. Tired riders make mistakes.
       Then the results, and a new land.
  Preview with ?pin (pinned, it reloads itself with a new seed after each
  race, which keeps the wall's watchdog quiet). ?act=2|3|4&seed=N (and
  &race=SECONDS for act 4) runs synchronously to that point for a photograph.
  Not in the ring.
==========================================================================

  CHANGED
    v2.0  Joe, 2026-10-13: one longer lap (6-11 km) laid round the map by the
          new planner, two-track drawn as a double line and the only place to
          pass, a place-by-distance chart under the map, crash alerts give the
          energy and the time down, riders wear random three-digit plates
    v1.2  declares WALL_SECONDS_PER_RUN (690 s), so a count of three or more
          races is not cut by the stall watchdog
    v1.1  CONFIG restored - the 2026-09-13 rotateTo rewrite had deleted the
          whole block, so every tick threw and the page froze on its name
    v1.0  versioning starts here; this file predates the scheme
-->
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060c; overflow:hidden; }
  * { cursor:none; }
  #cv { position:fixed; inset:0; width:100vw; height:100vh; transition:opacity 1.6s ease-in-out; }
  #ui { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; }
  /* the chase window: a PANEL top-right, the one picture-in-picture on the wall */
  #chase { position:fixed; right:var(--safe-x); top:var(--safe-y); width:calc(1280*var(--wu)); height:calc(720*var(--wu));
    border:1px solid var(--edge); border-radius:var(--r); box-shadow:var(--shadow); display:none; background:#04060c; }
  /* the chase window in WebGL sits under the same rectangle; #chase then
     carries only the physics strip, on a clear background */
  #chase3d { position:fixed; right:var(--safe-x); top:var(--safe-y); width:calc(1280*var(--wu)); height:calc(720*var(--wu));
    border-radius:var(--r); display:none; background:#04060c; }
  #chase.over3d { background:transparent; }
  #heli { position:fixed; display:none; opacity:0; transition:opacity 1.4s ease-in-out; border-radius:calc(8*var(--wu)); }
  #chasecap { position:fixed; right:var(--safe-x); top:calc(var(--safe-y) + 720*var(--wu) + 16*var(--wu)); z-index:6;
    font:400 var(--t4)/1.3 var(--font-num); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap;
    text-shadow:0 1px 5px rgba(0,0,0,.85); display:none; max-width:calc(1280*var(--wu)); text-align:right; }
  body .instr.bl { bottom: calc(var(--band) + 120*var(--wu)); }
  /* a crash alert is two short lines: who and where, then how hard and how long */
  body .moment { white-space:pre-line; max-width:calc(2100*var(--wu)); }   /* never across into the chase window */
  #pname { position:fixed; left:var(--safe-x); top:var(--safe-y); z-index:6;
    font:italic 400 var(--t1)/1.1 Georgia, "Times New Roman", serif; color:var(--ink);
    text-shadow:0 1px 5px rgba(0,0,0,.85), 0 0 18px rgba(0,0,0,.6); }
</style>

<body>
<canvas id="cv" width="1280" height="720"></canvas>
<canvas id="ui"></canvas>
<canvas id="chase3d" width="1280" height="720"></canvas>
<canvas id="chase" width="960" height="540"></canvas>
<canvas id="heli" width="960" height="540"></canvas>
<div id="chasecap"></div>
<div id="pname">The Race</div>
<div id="info"></div>
<script>
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  /* The next ENABLED piece, not simply the next one listed. Joe, 2026-09-13:
     "if I try to skip to the next one it goes to the next one in the ring,
     regardless if that one is turned on or not." Wall.step() walks the ring
     honouring the setup screen's switches; ROTATION below is the fallback for
     a page opened outside the wall, where there are no settings to read. */
  const want = (window.Wall && Wall.step) ? Wall.step(step) : null;
  if (want) { location.href = want; return; }
  const here = (location.pathname.split('/').pop() || 'kiosk.html');
  let i = ROTATION.indexOf(here);
  if (i < 0) i = 0;
  location.href = ROTATION[(i + step + ROTATION.length) % ROTATION.length];
}
/* ---- the piece's own pacing and scale ----------------------------------
   RESTORED 2026-09-14. This block was deleted by accident on 2026-09-13 when
   rotateTo() above was rewritten for Wall.step: the old rotateTo was a single
   line followed immediately by "const CONFIG = {", and the replacement ran on
   through CONFIG's closing brace. Every reference to CONFIG below therefore
   threw at the first tick and the page sat on a black screen showing only its
   name until the Pi's watchdog restarted the kiosk 27 minutes later.
   Restored from the published copy at 84f9d9f, with nextPage put back to the
   wall's value (the published build blanks it for the standalone page). */
/* ONE SHOW, for the stall watchdog (wall.js stallSecs): a full race show runs
   about 11 min (CONFIG.holdMin below is only the stalled-show deadline).
   Without it, repeats reload the same URL and three races in a row passed the
   flat 25-minute limit in the third. */
window.WALL_SECONDS_PER_RUN = 1080;      // one lap of 6-11 km: the longest measured show was ~17 min

const CONFIG = {
  freezeStep: 600,        // erosion steps before the land is frozen (300,000 model years)
  raceCell: 10,           // metres per erosion cell at the race scale
  loop:{minLen:6000, maxLen:11000, targetLen:8000},  // one lap of 4-7 miles (Joe, 2026-10-13)
  /* gradeCap is no longer set here: the planner picks a grade of difficulty for
     the day and the cap comes with it (easy 12%, medium 18%, hard 32%). Add
     ?grade=easy|medium|hard to demand one, or ?cap=0.24 to override outright. */
  slopeMax:0.95,          // steeper than this is cliff; below it a trail can be benched in
  riders: 8, laps: 1,
  timeScale: 4,           // race seconds per real second
  finishScale: 4,         // and four times that once the winner is home, so the rest finish
  rosterSec: 30,          // how long the cards stand
  resultsSec: 45,         // the ranked cards at the end
  mapSec: 40, heliSec: 30,  // the overview alternates: flat map, then the helicopter orbit
  orbitSec: 490, vexag:1.8, fpsCap:8,
  nextPage: '' /* standalone: nowhere to hand on to; start again */,  // on to the flowers (2026-09-12); only a fallback - Wall.nextPage reads the ring
  holdMin:20,             // NOT the pacing - a full show runs ~11 min. This is the
                          // deadline for a show that has somehow stalled.
};
const Q=new URLSearchParams(location.search), PINNED=Q.has('pin');
let seed=Q.has('seed')?(Q.get('seed')|0):((Math.random()*1e9)|0);
const SYNC_ACT=Q.has('act')?(Q.get('act')|0):0, SYNC_RACE=Q.has('race')?(+Q.get('race')):0, FORCE_HELI=Q.has('heli');
const SELF=location.pathname.split('/').pop()||'race.html';

/* ---- the ladder ---- */
const TIER={t0:160,t1:80,t2:58,t3:44,t4:32,t5:26}, FLOOR={t0:56,t1:30,t2:22,t3:17,t4:13,t5:11};
const TS=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ts'))||1;
let DPR=1, WU=1, T=k=>0;
function setTypeScale(){ DPR=devicePixelRatio||1; WU=(innerWidth/3840)*DPR; T=k=>Math.max(FLOOR[k]*DPR, TIER[k]*TS*WU); }
const INK='rgba(240,246,253,.95)', INK2='rgba(210,224,242,.80)', WARM='rgba(255,226,176,.96)', PLATE='rgba(8,11,18,.70)', EDGE='rgba(255,255,255,.16)';
const MONO='ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace', UI='ui-sans-serif, system-ui, sans-serif';

/* ---- state ---- */
const cv=document.getElementById('cv'), ui=document.getElementById('ui'), uctx=ui.getContext('2d');
const chaseCv=document.getElementById('chase'), cctx=chaseCv.getContext('2d'), chaseCap=document.getElementById('chasecap');
const heliCv=document.getElementById('heli'), hctx=heliCv.getContext('2d');
const view=StrataView.create(cv), chaseView=StrataView.create(chaseCv); let heliView=null;   // the helicopter canvas is sized to the map frame at race start
/* the chase window in WebGL (race_chase3d.js); null where WebGL is missing, and
   then the old ray-marcher draws it as before */
const chase3dCv=document.getElementById('chase3d');
let chase3d=null; try{ chase3d=(window.RaceChase3D&&RaceChase3D.create(chase3dCv))||null; }catch(e){ chase3d=null; }
let tickAt=0;
let day=null, painter=null, heliOn=false, heliAt=0, lastHeli=0, mapFrame=null;
/* flash text goes over the upper part of the map, where nothing else lives */
function flash(text,force){ const at=mapFrame?{x:(mapFrame.x+mapFrame.W/2)/DPR, y:(mapFrame.y+mapFrame.H*0.2)/DPR}:null; Wall.moment(text, Object.assign(at?{at,exact:true}:{},force?{force:true}:{})); }
/* HOW HARD A CRASH WAS (Joe, 2026-10-13: "tell us how severe the crash is
   (joules?) and how long the rider will be down"). The sim grades a crash by
   the energy the rider sheds per kilogram (race_sim.js crash()); the alert
   gives the whole body's worth in kilojoules, the grade in words, and the
   seconds down in race time. */
function crashWords(e){
  const band=e.kind==='out'?'too hurt to go on':e.e<10?'a slide':e.e<40?'off the bike':'a hard hit';
  const kJ=(e.e*e.rider.kg/1000).toFixed(1)+' kJ';
  return e.kind==='out'?band+' · '+kJ:band+' · '+kJ+' · down '+Math.round(e.down)+' s';
}
let w=null, act=0, t0=performance.now(), actAt=performance.now(), frozen=false, plan=null;
let mapAlpha=0, revealed=0, worker=null, busy=false, planner=null;
let trail=null, riders=null, race=null, fav=null, cam=null, director={subject:null,until:0,text:'',kind:''}, lastEvent=0;

/* the erosion worker (as in strata.html) */
function makeWorker(){
  const body=`(${StrataFactory.toString()})(self); let w=null;
    self.onmessage=(e)=>{ const m=e.data;
      if(m.cmd==='new'){ w=Strata.makeWorld(m.seed); self.postMessage({cmd:'ready'}); }
      else if(m.cmd==='step'&&w){ for(let i=0;i<m.n;i++) Strata.step(w); self.postMessage({cmd:'state', z:w.z.slice(0), rain:w.rain.slice(0), step:w.step, removed:w.removed}); } };`;
  const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
  wk.onmessage=(e)=>{ const m=e.data; if(m.cmd==='ready') busy=false; else if(m.cmd==='state'){ w.z.set(m.z); w.rain.set(m.rain); w.step=m.step; w.removed=m.removed; busy=false; } };
  return wk;
}
/* the planner worker */
function makePlanner(){
  const body=`(${RacePlannerFactory.toString()})(self);
    self.onmessage=(e)=>{ const m=e.data; const L=RacePlanner.loop(m.z,m.nx,m.ny,m.cell,m.opts); if(L){ delete L.P; } self.postMessage({cmd:'plan', L}); };`;
  const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
  wk.onmessage=(e)=>{ onPlan(e.data.L); };
  return wk;
}
function raceZ(){ const s=CONFIG.raceCell/w.dx, z=new Float64Array(w.N); for(let i=0;i<w.N;i++) z[i]=w.z[i]*s; return z; }
function planOpts(){
  const q=new URLSearchParams(location.search);
  const o=Object.assign({seed:seed*7+1,tries:8,slopeMax:CONFIG.slopeMax},CONFIG.loop);
  if(q.get('grade')) o.difficulty=q.get('grade');
  if(q.get('cap')) o.gradeCap=parseFloat(q.get('cap'));
  return o;
}   // attempts per start line; each is tens of ms
function onPlan(L){
  plan=L; revealed=0;
  if(!L){ Wall.lane('No rideable loop on this land. A new one folds.'); Wall.after(8000,()=>nextWorld()); return; }
  /* Name the course by what it IS, measured off its own line, not by the cap
     the router was given. An easy course zigzags because it may not climb hard;
     a hard one goes at the pitch head on and pays for it in the legs. */
  const g=L.grade||{mean:0,max:0};
  const say={easy:'An easy course',medium:'A middling course',hard:'A hard course'}[L.tier]||'A course';
  const two=L.twoTrack?L.twoTrack.frac:0;
  Wall.lane(say+': one lap of '+(L.length/1000).toFixed(1)+' km, '+Math.round(L.climb)+' m of climbing, '+
            Math.round(100*two)+' % of it two-track. Grades average '+(100*g.mean).toFixed(1)+' % and reach '+
            (100*g.max).toFixed(0)+' %; the singletrack is benched into the hillsides, and only cliffs are off limits.');
}
function nextWorld(){ const next=(seed*1664525+1013904223)>>>0; if(PINNED) location.replace(SELF+'?pin&seed='+next); else newWorld(next); }

function newWorld(s){
  seed=s; w=Strata.makeWorld(seed); view.setWorld(w); frozen=false; plan=null; trail=null; riders=null; race=null; mapAlpha=0; revealed=0;
  act=1; t0=actAt=performance.now(); cv.style.opacity='1'; chaseCv.style.display='none'; chaseCap.style.display='none'; chase3dCv.style.display='none';
  Wall.clearEpisode(); Wall.clearTimers();
  if(SYNC_ACT){
    for(let i=0;i<CONFIG.freezeStep;i++) Strata.step(w); frozen=true;
    if(SYNC_ACT>=2){ act=2; mapAlpha=1; cv.style.opacity='0'; onPlan(RacePlanner.loop(raceZ(),w.nx,w.ny,CONFIG.raceCell,planOpts())); revealed=1e9; }
    if(SYNC_ACT>=3 && plan){ startRoster(); }
    if(SYNC_ACT>=4 && plan){ startRace(); for(let t=0,k=0;t<SYNC_RACE;t+=0.1,k++){ RaceSim.step(race,0.1); if(k%10===0) record(); } direct(true); while(painter&&!painter.done) painter.paintRows(200); }
    if(SYNC_ACT>=5 && plan){ while(!race.done && race.t<7200) RaceSim.step(race,0.1); race.resultsAt=performance.now(); showResults(); }
  } else {
    if(!worker) worker=makeWorker(); busy=true; worker.postMessage({cmd:'new',seed});
    Wall.episode('First the land: folded beds, rained on for three hundred thousand years, then frozen. The race will be cut into this.');
  }
  Wall.every(100,tick);
}
function startRoster(){
  act=3; actAt=performance.now(); riders=RaceSim.makeRiders(seed^0x5bd1e995,CONFIG.riders); fav=RaceSim.favourite(riders);
  trail=RaceSim.buildTrail(plan,w,CONFIG.raceCell,2); day=RaceSim.makeDay(seed);
  /* the crisp zoomed map is painted now, in chunks, while the cards stand */
  const r=courseRect(); sizeUI(); const b=leftColumn(ui.width,ui.height,true).map;
  const sc=Math.min(b.W/r.w, b.H/r.h); painter=StrataView.mapPainter(view,r,Math.round(r.w*sc),Math.round(r.h*sc));
  heliOn=false; heliAt=performance.now();
  Wall.lane('Race day: '+day.label+'. Eight riders, each drawn at random: climb, sprint, sight, skill, nerve, stamina and heat.',{hold:12000});
}
/* THE LEFT COLUMN: the map, and in the race the place chart under it (Joe,
   2026-10-13). One function, so the painter, the helicopter and the frame agree. */
function sizeUI(){ setTypeScale(); const w=Math.round(innerWidth*DPR), h=Math.round(innerHeight*DPR); if(ui.width!==w||ui.height!==h){ ui.width=w; ui.height=h; } }
function leftColumn(W,H,race4){
  const SX=134*WU, SY=76*WU, floor=(200*TS+120)*WU, right=race4?(1280+60)*WU:0;
  const top=SY+T('t1')*1.4, x=SX, w=W-2*SX-right, h=H-floor-top;
  if(!race4) return {map:{x,y:top,W:w,H:h},chart:null};
  const ch=Math.max(420*WU,h*0.30), gap=36*WU;
  return {map:{x,y:top,W:w,H:h-ch-gap},chart:{x,y:top+h-ch,W:w,H:ch}};
}
function startRace(){
  act=4; actAt=performance.now(); race=RaceSim.makeRace(trail,riders,CONFIG.laps,seed,day);
  hist=race.riders.map(()=>[]); prevD=null;
  chaseView.setWorld(w); chaseCv.style.display='block'; chaseCap.style.display='block'; heliCv.style.display='block'; cam=null; lastEvent=0;
  if(chase3d){ sizeUI(); const pw=Math.round(1280*WU), ph=Math.round(720*WU);
    chaseCv.width=pw; chaseCv.height=ph; chaseCv.classList.add('over3d'); chase3dCv.style.display='block';
    if(view.fine.step!==w.step) StrataView.refreshFine(view.fine);
    try{ chase3d.setSize(pw,ph); chase3d.setRace(w,view.fine,trail,race.riders,day,CONFIG.raceCell); }
    catch(e){ console.error(e); chase3d=null; chase3dCv.style.display='none'; chaseCv.classList.remove('over3d'); chaseCv.width=960; chaseCv.height=540; } }
  /* the helicopter canvas takes the map frame's aspect, about half a megapixel */
  { const r=courseRect(); sizeUI(); const b=leftColumn(ui.width,ui.height,true).map;
    const sc=Math.min(b.W/r.w, b.H/r.h), fw=r.w*sc, fh=r.h*sc, cw=Math.round(Math.sqrt(520000*fw/fh)), chh=Math.round(520000/cw);
    heliCv.width=cw; heliCv.height=chh; heliView=null; heliBusy=false;
    if(!drawChase.tex) drawChase.tex=w.layers.map(l=>RaceSim.BED[l.type].rough);
    if(!heliWorker) heliWorker=makeHeliWorker();
    if(heliWorker) heliWorker.postMessage({cmd:'world',W:cw,H:chh,w:{nx:w.nx,ny:w.ny,dx:w.dx,z:w.z,F:w.F,layers:w.layers,rain:w.rain,zb:w.zb,step:w.step}});
    else { heliView=StrataView.create(heliCv); heliView.setWorld(w); } }
  heliOn=!!FORCE_HELI; heliAt=performance.now();
  let twoKm=0; for(const s of trail.S) if(s.two) twoKm+=trail.ds/1000;
  Wall.lane('One lap of '+(trail.L/1000).toFixed(1)+' km. Passing only on the two-track, the double line on the map: '+twoKm.toFixed(1)+' km of it. The singletrack is one bike wide.',{hold:9000});
}
function tick(){
  if(!w) return; const now=performance.now();
  if(act===1){
    if(!frozen){ if(!busy && w.step<CONFIG.freezeStep){ busy=true; worker.postMessage({cmd:'step',n:6}); }
      if(w.step>=CONFIG.freezeStep){ frozen=true; actAt=now; Wall.lane('Frozen. Now the scale: one cell is '+CONFIG.raceCell+' m, the block '+(w.nx*CONFIG.raceCell/1000).toFixed(1)+' by '+(w.ny*CONFIG.raceCell/1000).toFixed(1)+' km - the slopes are the same, so the cliffs are still cliffs.'); } }
    else if(now-actAt>9000){ act=2; actAt=now; if(!planner) planner=makePlanner(); planner.postMessage({z:raceZ(),nx:w.nx,ny:w.ny,cell:CONFIG.raceCell,opts:planOpts()}); }
  }
  else if(act===2){ mapAlpha=Math.min(1,(now-actAt)/1600); cv.style.opacity=String(1-mapAlpha);
    /* the search, then the course, drawn over about eighteen seconds whatever their size */
    if(plan){ const total=plan.segs.reduce((a,s)=>a+s.explored.length,0)+plan.path.length*2+320; revealed+=Math.max(0.4,total/40/180); if(revealed*40>total) startRoster(); } }
  else if(act===3){ if(now-actAt>CONFIG.rosterSec*1000) startRace(); }
  else if(act===4){
    if(!race.done && !race.resultsAt){ const n=CONFIG.timeScale*(race.finished>0?CONFIG.finishScale:1);
      for(const r of race.riders) r._prevD=r.lap*trail.L+r.s; tickAt=now;      // the 3D window interpolates from here
      for(let i=0;i<n;i++){ RaceSim.step(race,0.1); if(race.done) break; }
      passes(); record();
      /* the show ends when everyone is home, or 25 race-minutes after the winner */
      if(race.done || (race.finished>0 && race.t-race.riders.filter(r=>r.finish).reduce((a,r)=>Math.min(a,r.finish),1e9)>1500)) race.resultsAt=now; }
    else if(race.resultsAt && !race.resultsSaid){ showResults(); }
    /* the overview alternates between the flat map and the helicopter */
    if(!FORCE_HELI && now-heliAt>(heliOn?CONFIG.heliSec:CONFIG.mapSec)*1000){ heliOn=!heliOn; heliAt=now; }
    heliCv.style.opacity=heliOn?'1':'0';
    direct(false);
  }
  if(!PINNED && now-t0>CONFIG.holdMin*60000) handOff();     // the stalled-show deadline; the normal exit is showResults()
}
/* a pass is one rider going by another ON THE TRAIL, both riding: not a change
   of rank because somebody ahead crashed out */
let prevD=null, hist=null;
function passes(){
  const now=performance.now(), R=race.riders, L=trail.L, D=r=>r.lap*L+r.s;
  if(prevD && race.t>30) for(const a of R){ if(a.status!=='riding') continue;
    for(const b of R){ if(b===a || b.status!=='riding') continue;
      if(prevD[a.i]<prevD[b.i] && D(a)>=D(b) && D(a)-D(b)<15){
        flash('#'+a.num+' '+a.name+' passes #'+b.num);
        director={subject:a,until:now+6000,kind:'pass',text:'#'+a.num+' '+a.name+' passes #'+b.num+' '+b.name}; } } }
  prevD=R.map(D);
}
/* the place chart's record: each rider's place against their own distance */
function record(){
  const L=trail.L*race.laps;

    if(!last || (d-last[0]>=L/500) || (last[1]!==r.pos && r.status!=='out')) h.push([d,r.pos]);

/* ---- the director: what the chase window shows, and what the lane says ---- */
function direct(sync){
  const now=performance.now(); const R=race.riders;
  /* new events since last look */
  for(let i=lastEvent;i<race.events.length;i++){ const e=race.events[i];
    if(e.kind==='crash'){ director={subject:e.rider,until:now+7000,kind:'crash',text:'#'+e.rider.num+' '+e.rider.name+' down · '+(e.e*e.rider.kg/1000).toFixed(1)+' kJ · '+Math.round(e.down)+' s'}; if(!sync) flash('#'+e.rider.num+' '+e.rider.name+' down on the '+e.seg.bed+'\n'+crashWords(e),true); }
    else if(e.kind==='out'){ director={subject:e.rider,until:now+8000,kind:'out',text:'#'+e.rider.num+' '+e.rider.name+' out · '+(e.e*e.rider.kg/1000).toFixed(1)+' kJ'}; if(!sync) Wall.lane('#'+e.rider.num+' '+e.rider.name+' crashes on the '+e.seg.bed+(e.seg.exposed?' and goes over the edge':'')+': '+(e.e*e.rider.kg/1000).toFixed(1)+' kJ, too hurt to go on. Out of the race.'); }
    else if(e.kind==='finish'&&e.place===1){ director={subject:e.rider,until:now+8000,kind:'finish',text:'#'+e.rider.num+' '+e.rider.name+' takes the win'}; }
    else if(e.kind==='lap'&&e.rider.pos===1&&e.lap<race.laps){ if(!sync) flash('#'+e.rider.num+' '+e.rider.name+' leads into lap '+(e.lap+1)); }
  }
  lastEvent=race.events.length;
  if(now>director.until || !director.subject || director.subject.status==='out'||director.subject.status==='finished'){
    /* the closest battle on the trail, else the leader */
    const on=R.filter(r=>r.status==='riding'||r.status==='down').sort((a,b)=>a.pos-b.pos);
    let best=null, bg=1e9;
    for(let i=1;i<on.length;i++){ const g=(on[i-1].lap*trail.L+on[i-1].s)-(on[i].lap*trail.L+on[i].s); if(g<bg){ bg=g; best=on[i]; } }
    if(best && bg<25){ director={subject:best,until:now+12000,kind:'battle',text:'#'+best.num+' '+best.name+' · '+bg.toFixed(0)+' m off #'+on[on.indexOf(best)-1].num}; }
    else if(on.length){ const ld=on[0]; director={subject:ld,until:now+12000,kind:'leader',text:'#'+ld.num+' '+ld.name+' leads · '+(Math.max(0,ld.lap*trail.L+ld.s)/1000).toFixed(1)+' of '+(trail.L*race.laps/1000).toFixed(1)+' km'}; }
    else director={subject:null,until:now+5000,kind:'none',text:'the race is over'};
  }
  chaseCap.textContent=director.text;
}

const cellToMap=(M)=>{ const U=StrataView.U; return (x,y)=>[M.x0+x*U*M.s, M.y0+y*U*M.s]; };
/* the course's bounding box in fine cells, with a margin, for the zoomed map */
function courseRect(){

/* THE PLACE CHART (Joe, 2026-10-13): race distance across, place down (first at
   the top), one line per rider in their ink, each rider's place recorded at
   their own distance - so a line steps up where its rider passes and down where
   they are passed or lie on the ground. The two-track is shaded behind, because
   that is the only place a pass can happen. Every line ends in a dot with the
   rider's plate number; a rider out of the race ends in a cross. */

  uctx.fillStyle=PLATE; roundRect(uctx,b.x,b.y,b.W,b.H,16*WU); uctx.fill(); uctx.strokeStyle=EDGE; uctx.lineWidth=WU; uctx.stroke();

  for(let p=1;p<=n;p++){ const y=Y(p); uctx.beginPath(); uctx.moveTo(x0,y); uctx.lineTo(x1,y); uctx.stroke(); uctx.fillText(String(p),x0-14*WU,y); }
  uctx.textBaseline='top'; uctx.textAlign='center';
  for(let k=0;k<=L/1000+1e-6;k++){ const x=X(k*1000); uctx.fillText(k===0?'0 KM':String(k),x,y1+18*WU); }

    const sub=r===director.subject;
    if(sub){ uctx.fillStyle='rgba(255,226,176,.10)'; uctx.fillRect(x+10*WU,py-4*WU,bw-20*WU,rowH-2*WU); }
    uctx.fillStyle=r.color; uctx.fillRect(px,py+T('t3')*0.12,T('t3')*0.62,T('t3')*0.62);
    uctx.fillStyle=r.status==='out'?INK2:INK; uctx.font='300 '+T('t3')+'px '+UI; uctx.textAlign='left'; uctx.textBaseline='top';
    uctx.fillText(r.pos+'  #'+r.num+' '+r.name,px+T('t3')*0.95,py);
    let gap; if(r.status==='out') gap='out'; else if(r.finish) gap=clockStr(r.finish); else if(r.pos===1) gap='leads'; else gap='−'+Math.round((ld.lap*L+ld.s)-(r.lap*L+r.s))+' m';
    uctx.font='300 '+T('t3')+'px '+MONO; uctx.textAlign='right'; uctx.fillText(gap,x+bw-30*WU,py);
    /* the live line */
    let live;
    if(r.status==='out') live='over the edge on the '+(r.seg?r.seg.bed:'trail');
    else if(r.finish) live='finished · '+r.crashes+(r.crashes===1?' crash':' crashes');
    else if(r.status==='down') live='down on the '+(r.seg?r.seg.bed:'trail')+' · up in '+Math.ceil(r.down)+' s';
    else live=(r.v*3.6).toFixed(0)+' km/h · '+Math.round(r.P||0)+' W · '+Math.round(100*r.E/r.E0)+' % · '+r.core.toFixed(1)+'° · '+(r.mode||'')+(r.seg?' · '+r.seg.bed:'');
    uctx.font='400 '+T('t4')+'px '+MONO; uctx.fillStyle=INK2; uctx.textAlign='left';
    const room=x+bw-30*WU-(px+T('t3')*0.95);
    while(uctx.measureText(live).width>room && live.lastIndexOf(' · ')>0) live=live.slice(0,live.lastIndexOf(' · '));
    uctx.fillText(live,px+T('t3')*0.95,py+T('t3')*1.15);
    py+=rowH;
  }
}
/* act 4: the chase window - the ray-marcher behind the director's subject */
function groundZ(x,y){ const nx=w.nx, xi=Math.max(0,Math.min(nx-2,x|0)), yi=Math.max(0,Math.min(w.ny-2,y|0)), fx=x-xi, fy=y-yi, c=yi*nx+xi;
  return (w.z[c]*(1-fx)+w.z[c+1]*fx)*(1-fy)+(w.z[c+nx]*(1-fx)+w.z[c+nx+1]*fx)*fy; }
function drawChase(){
  const sub=director.subject; if(!sub){ return; }
  const p=RaceSim.place(trail,sub);
  /* behind the rider along the trail, above the ground, looking down at them */
  const back=4.5, hx=Math.cos(p.heading), hy=Math.sin(p.heading);
  const want={x:p.x-back*hx, y:p.y-back*hy};
  want.z=Math.max(groundZ(want.x,want.y)+30, p.zE+55);
  want.yaw=Math.atan2(p.y-want.y,p.x-want.x); want.pitch=Math.atan((want.z-p.zE)/(back*w.dx))*0.75;
  if(!cam) cam=Object.assign({},want);
  else { const k=0.18; cam.x+=(want.x-cam.x)*k; cam.y+=(want.y-cam.y)*k; cam.z+=(want.z-cam.z)*k; let dy=want.yaw-cam.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); cam.yaw+=dy*k; cam.pitch+=(want.pitch-cam.pitch)*k; }
  if(!drawChase.tex) drawChase.tex=w.layers.map(l=>RaceSim.BED[l.type].rough);
  chaseView.render(cam,{vexag:1.0,rain:false,tex:drawChase.tex});
  const RW=chaseCv.width, RH=chaseCv.height, f=(Math.max(RW,RH)/2)/Math.tan(StrataView.FOV/2), horizon=RH/2-f*Math.tan(cam.pitch);
  const proj=(X,Y,Z)=>{ const dx=X-cam.x, dy=Y-cam.y; let rel=Math.atan2(dy,dx)-cam.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); if(Math.abs(rel)>1.1) return null;
    const dp=Math.hypot(dx,dy)*Math.cos(rel)*w.dx; if(dp<w.dx*0.6) return null; return {x:RW/2+f*Math.tan(rel), y:horizon-f*(Z-cam.z)/dp, dp}; };
  /* the trail ahead as a ribbon: coloured by the bed under it (lightened), solid
     on slickrock, dashed where the rock is loose, wider as it comes closer */
  const i0=((Math.floor(sub.s/trail.ds)%trail.n)+trail.n)%trail.n;
  cctx.lineJoin='round'; cctx.lineCap='round';
  let prev=null;
  for(let k=-12;k<140;k+=2){ const s=trail.S[((i0+k)%trail.n+trail.n)%trail.n]; const q=proj(s.x,s.y,s.zE+1.5);
    if(!q||!prev){ prev=q; continue; }
    const c=s.color, lw=Math.max(1.5,Math.min(14,1400/q.dp));
    cctx.strokeStyle='rgba('+Math.min(255,c[0]+70)+','+Math.min(255,c[1]+70)+','+Math.min(255,c[2]+60)+',.85)'; cctx.lineWidth=lw;
    cctx.setLineDash(s.rough>0.4?[lw*1.2,lw*1.0]:[]);
    cctx.beginPath(); cctx.moveTo(prev.x,prev.y); cctx.lineTo(q.x,q.y); cctx.stroke(); prev=q; }
  cctx.setLineDash([]);
  /* riders, far first */
  const list=race.riders.filter(r=>r.status!=='out').map(r=>{ const pp=RaceSim.place(trail,r); return {r,q:proj(pp.x,pp.y,pp.zE+4)}; }).filter(o=>o.q).sort((a,b)=>b.q.dp-a.q.dp);
  for(const {r,q} of list){ const rad=Math.max(3,Math.min(34,7000/q.dp));
    if(r.mode==='braking' && r.status==='riding'){ cctx.beginPath(); cctx.arc(q.x,q.y,rad*1.35,0,2*Math.PI); cctx.fillStyle='rgba(255,70,50,.45)'; cctx.fill(); }   // brake light
    cctx.beginPath(); cctx.arc(q.x,q.y,rad,0,2*Math.PI); cctx.fillStyle=r.color; cctx.fill(); cctx.lineWidth=2; cctx.strokeStyle=r.status==='down'?'rgba(255,60,60,.95)':'rgba(0,0,0,.8)'; cctx.stroke();
    if(rad>10){ cctx.fillStyle='#000'; cctx.font='700 '+Math.round(rad*0.78)+'px '+UI; cctx.textAlign='center'; cctx.textBaseline='middle'; cctx.fillText(String(r.num),q.x,q.y); }
    if(r.status==='down'){ cctx.strokeStyle='rgba(255,60,60,.95)'; cctx.lineWidth=3; cctx.beginPath(); cctx.moveTo(q.x-rad*1.5,q.y-rad*1.5); cctx.lineTo(q.x+rad*1.5,q.y+rad*1.5); cctx.moveTo(q.x+rad*1.5,q.y-rad*1.5); cctx.lineTo(q.x-rad*1.5,q.y+rad*1.5); cctx.stroke(); } }
  /* the physics strip: the followed rider's moment, across the bottom of the window.
     The chase canvas is 960 wide for 1280 wall px, so type is the ladder x 0.75 */
  physicsStrip(sub,RW,RH,Math.round(T('t4')*0.75/DPR),16);
}
/* the strip on the WebGL window: the clear canvas over it, at full resolution */
function drawChaseHUD(){
  const sub=director.subject, RW=chaseCv.width, RH=chaseCv.height; cctx.clearRect(0,0,RW,RH); if(!sub) return;
  physicsStrip(sub,RW,RH,Math.round(T('t5')),Math.round(22*WU));
}
function physicsStrip(sub,RW,RH,k4,pad){
  const i0=((Math.floor(sub.s/trail.ds)%trail.n)+trail.n)%trail.n;
  const sg=sub.seg||trail.S[i0], sh=k4*4.6;
  cctx.fillStyle='rgba(8,11,18,.72)'; cctx.fillRect(0,RH-sh,RW,sh);
  cctx.font='400 '+k4+'px '+MONO; cctx.textBaseline='middle'; cctx.textAlign='left';
  const pct=(v)=>(v*3.6).toFixed(0);
  /* three lines, each cut from the end to fit the window */
  const room=RW-2*pad, fit=(parts)=>{ let t=parts.filter(Boolean).join(' · '); while(cctx.measureText(t).width>room && t.lastIndexOf(' · ')>0) t=t.slice(0,t.lastIndexOf(' · ')); return t; };
  const line1=fit(['#'+sub.num+' '+sub.name.toUpperCase(),(sub.mode||'').toUpperCase(),(sg.grade>0?'+':'')+Math.round(sg.grade*100)+' %',sg.two?'TWO-TRACK':'SINGLETRACK',sg.bed.toUpperCase()+(sg.rough>0.4?' LOOSE':' GRIPPY')]);
  const line2=fit(sub.status==='riding'?['LIMIT '+pct(sub.vlim||sg.vlim),'SEES '+pct(sub.perceived||sg.vlim),'AT '+pct(sub.v)+' KM/H','μ'+sg.mu.toFixed(2),sg.exposed?'EDGE':'']:
               sub.status==='down'?['DOWN','UP IN '+Math.ceil(sub.down)+' S','ENERGY '+Math.round(100*sub.E/sub.E0)+' %']:[sub.status.toUpperCase()]);
  const line3=fit([Math.round(sub.P||0)+'/'+Math.round(sub.wkg*sub.kg)+' W',Math.round(100*sub.E/sub.E0)+' % LEFT','CORE '+sub.core.toFixed(1)+'°','SWEAT '+sub.sweat.toFixed(1)+' L/H','LOST '+sub.water.toFixed(1)+' L','CLIMB '+Math.round(sub.climbed*3.281)+' FT']);
  cctx.fillStyle='rgba(240,246,253,.95)'; cctx.fillText(line1,pad,RH-sh*0.78);
  cctx.fillStyle='rgba(210,224,242,.80)'; cctx.fillText(line2,pad,RH-sh*0.50); cctx.fillText(line3,pad,RH-sh*0.22);
}
/* the helicopter: the ray-marcher orbiting the course, laid over the map box */
function placeHeli(M){ const f=M.frame; mapFrame=f; heliCv.style.left=(f.x/DPR)+'px'; heliCv.style.top=(f.y/DPR)+'px'; heliCv.style.width=(f.W/DPR)+'px'; heliCv.style.height=(f.H/DPR)+'px'; }
/* THE HELICOPTER IS DRAWN IN A WORKER (2026-10-13). Ray-marching half a
   megapixel on the main thread five times a second took most of the Pi's main
   thread, and while the helicopter was up the whole page - the new WebGL chase
   window with it - fell from 27 frames a second to 8. The worker owns its own
   StrataView on an OffscreenCanvas and hands back a bitmap; the trail and the
   riders are drawn over it here, with the camera that bitmap was made from. */
let heliWorker=null, heliBusy=false, heliCam=null;
function makeHeliWorker(){
  try{ if(typeof OffscreenCanvas==='undefined') return null;
    const body=`(${StrataViewFactory.toString()})(self); let view=null, cv=null;
      self.onmessage=(e)=>{ const m=e.data;
        if(m.cmd==='world'){ cv=new OffscreenCanvas(m.W,m.H); view=StrataView.create(cv); view.setWorld(m.w); }
        else if(m.cmd==='render'&&view){ view.render(m.cam,m.opts); const bmp=cv.transferToImageBitmap(); self.postMessage({cmd:'frame',bmp,cam:m.cam},[bmp]); } };`;
    const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
    wk.onmessage=(e)=>{ heliBusy=false; if(e.data.cmd==='frame' && race && act===4){ hctx.drawImage(e.data.bmp,0,0); e.data.bmp.close&&e.data.bmp.close(); heliOverlay(e.data.cam); } };
    wk.onerror=()=>{ heliWorker=null; heliBusy=false; };
    return wk; }catch(e){ return null; }
}
function drawHeli(now){
  if(now-lastHeli<200) return;                                         // 5 fps is plenty for a slow orbit
  if(heliWorker && heliBusy) return; lastHeli=now;
  const r=courseRect(), U=StrataView.U, cx=(r.x0+r.w/2)/U, cy=(r.y0+r.h/2)/U, ext=Math.max(r.w,r.h)/U;
  const a=((now-actAt)/1000)/150*2*Math.PI, rad=0.75*ext+12;
  let zmax=-1e9, zmean=0, n=0; for(let i=0;i<trail.n;i+=8){ const e=trail.S[i].zE; if(e>zmax) zmax=e; zmean+=e; n++; } zmean/=n;
  const hc={x:cx+rad*Math.cos(a), y:cy+rad*Math.sin(a)}; hc.z=zmax+rad*w.dx*0.55; hc.yaw=Math.atan2(cy-hc.y,cx-hc.x); hc.pitch=Math.atan((hc.z-zmean)/(rad*w.dx))*(heliCv.height>heliCv.width?0.98:0.85);   // a tall frame looks down more
  if(heliWorker){ heliBusy=true; heliWorker.postMessage({cmd:'render',cam:hc,opts:{vexag:1.0,rain:false,tex:drawChase.tex}}); return; }
  heliView.render(hc,{vexag:1.0,rain:false,tex:drawChase.tex});
  heliOverlay(hc);
}
/* the course and the riders over a helicopter picture made from camera hc */
function heliOverlay(hc){
  const RW=heliCv.width, RH=heliCv.height, f=(Math.max(RW,RH)/2)/Math.tan(StrataView.FOV/2), horizon=RH/2-f*Math.tan(hc.pitch);
  const proj=(X,Y,Z)=>{ const dx=X-hc.x, dy=Y-hc.y; let rel=Math.atan2(dy,dx)-hc.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); if(Math.abs(rel)>1.1) return null;
    const dp=Math.hypot(dx,dy)*Math.cos(rel)*w.dx; if(dp<w.dx*0.6) return null; return {x:RW/2+f*Math.tan(rel), y:horizon-f*(Z-hc.z)/dp, dp}; };
  hctx.lineWidth=2.5; hctx.strokeStyle='rgba(255,226,176,.8)'; hctx.lineJoin='round'; hctx.beginPath(); let started=false;
  for(let i=0;i<=trail.n;i+=3){ const s=trail.S[i%trail.n]; const q=proj(s.x,s.y,s.zE+1); if(!q){ started=false; continue; } if(started) hctx.lineTo(q.x,q.y); else { hctx.moveTo(q.x,q.y); started=true; } }
  hctx.stroke();
  for(const rd of race.riders){ if(rd.status==='out') continue; const p=RaceSim.place(trail,rd), q=proj(p.x,p.y,p.zE+3); if(!q) continue;
    hctx.beginPath(); hctx.arc(q.x,q.y,rd===director.subject?9:7,0,2*Math.PI); hctx.fillStyle=rd.color; hctx.fill(); hctx.lineWidth=1.5; hctx.strokeStyle='rgba(0,0,0,.8)'; hctx.stroke(); }
}
/* the instrument: bottom-left, one plate */
function drawInstrument(){
  const clock=(t)=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  let spec;
  if(act===1) spec={place:'bl',cols:1,rows:[{k:'elapsed',v:Math.round(w.step*w.P.dt/1000)+' thousand years'},{k:'rock removed',v:Math.round(100*w.removed)+' %'},{k:'land',v:frozen?'frozen':'eroding'}]};
  else if(act===2) spec=plan?{place:'bl',cols:1,rows:[{k:'course',v:(plan.length/1000).toFixed(1)+' km · one lap'},{k:'climbing',v:Math.round(plan.climb)+' m · '+plan.switchbacks+' switchbacks'},{k:'two-track',v:Math.round(100*(plan.twoTrack?plan.twoTrack.frac:0))+' % of it'}]}
                             :{place:'bl',cols:1,rows:[{k:'course',v:'searching…'},{k:'rules',v:'a grade cap · no cliffs'}]};
  else if(act===3 || act===5) spec=null;                             // the cards are the instrument
  else spec=null;                                                    // act 4: the board on the right does this job
  Wall.instrument(spec);
  if(document.body.classList.contains('showinfo')) updateInfo();
}
const infoEl=document.getElementById('info');
function updateInfo(){
  infoEl.textContent=`seed ${seed}  act ${act}  step ${w.step}  frozen ${frozen}  scale ${CONFIG.raceCell} m/cell  x${CONFIG.timeScale} time\n`+
    (plan?`loop ${plan.length.toFixed(0)} m, ${plan.path.length} cells, ${plan.switchbacks} hairpins, climb ${plan.climb.toFixed(0)} m, reachable ${plan.reachable}\n`:'no plan\n')+
    (race?`race t ${race.t.toFixed(0)} s  finished ${race.finished}  out ${race.out}  events ${race.events.length}  director ${director.kind}\n`+race.riders.map(r=>`#${r.num} ${r.name.padEnd(10)} ${r.status.padEnd(8)} pos ${r.pos} lap ${r.lap} s ${r.s.toFixed(0)} v ${(r.v*3.6).toFixed(0)} km/h E ${(100*r.E/r.E0).toFixed(0)}% crashes ${r.crashes}`).join('\n')+'\n':'')+
    `keys: n new land · i info · arrows change page`;
}
addEventListener('keydown',(e)=>{ switch(e.key){ case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
  case 'n': case 'N': newWorld((Math.random()*1e9)|0); break; case 'ArrowRight': rotateTo(1); break; case 'ArrowLeft': rotateTo(-1); break; } });
newWorld(seed); requestAnimationFrame(frame);
</script>
