<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata</title>
<!-- ==========================================================================
  strata.html - a folded sedimentary landscape eroding under rain, on the wall.
  Joe, 2026-09-04: "simulate landscapes like what we'd see in Utah, where there
  are different hardnesses of sedimentary layers, different colors, and then
  rain-based erosion ... the observer would watch the landscape erode away,
  and different features emerge and morph."  The MODEL is strata_engine.js
  (pure, seeded); this page steps it, draws it and speaks about it.

  FIRST READ: the landscape - striped cliffs, benches, canyons opening toward
  you - then the elapsed-time figure bottom-left.

  THE PICTURE lives in strata_view.js since 2026-09-07 (shared with the race
  page): a heightfield ray-marched column by column, every cliff row coloured
  by the bed at that elevation, hillshade, haze, a wet belt darkening the
  ground it rains on, a slow orbit.

  SMOOTHING (Joe, 2026-09-07: "keep the computational pixels, smooth the
  visual ones"). The erosion grid is untouched; the renderer draws from a
  DISPLAY COPY of the surface at THREE times the grid resolution, resampled
  with a cubic B-spline whenever the worker delivers a new state, with the
  lighting computed on that fine grid. Bilinear sampling of the raw grid was
  the culprit: at a cliff the erosion surface is a staircase of cells, and
  bilinear contours across a staircase zigzag once per cell - bed edges are
  contour lines, so every edge on a steep face grew teeth. The B-spline rounds
  the staircase into a ramp before the ray-marcher ever sees it. The slump
  rule also leaves a one-cell washboard on soft slopes (its risers alternate
  with the receiver direction), which a faithful resample keeps; a Gaussian a
  cell wide on the erosion copy, before the resample, takes it out at the cost
  of rounding cliff lips by about a cell. The bottom 1.5 m of each bed blends
  into the bed below, and a cliff's shade is a continuous function of its
  steepness rather than an on/off flag. (A per-span coverage blend at the
  silhouette was tried and removed: it grew single-column spikes along every
  rim that I could not explain, and the resample already does the smoothing.)

  In the ring since 2026-09-05 as the 16th and last stop (weatherclocks ->
  strata -> kiosk), 9-minute dwell, a fresh landscape every 7 minutes. ?pin
  holds it as the sole page (n for a new world, i for detail) - write
  "strata.html?pin" to ~/tv_art/current_page on the Pi and restart the kiosk;
  pinned, it reloads itself with a new seed every 7 min so the watchdog stays
  quiet. ?steps=N erodes N steps before the first frame and ?seed=N picks the
  world - both for headless photographs.
========================================================================== -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060c; overflow:hidden; }
  * { cursor:none; }
  #cv { position:fixed; inset:0; width:100vw; height:100vh; }        /* 1280x720 buffer, stretched 3x: soft by design */
  #ui { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; }
  /* the lane owns the bottom band; the instrument and the gauge sit above it */
  body .instr.bl { bottom: calc(var(--band) + 120*var(--wu)); }   /* outranks wall.css, which loads after this block */
  #pname { position:fixed; left:var(--safe-x); top:var(--safe-y); z-index:6;
    font:italic 400 var(--t1)/1.1 Georgia, "Times New Roman", serif; color:var(--ink);
    text-shadow:0 1px 5px rgba(0,0,0,.85), 0 0 18px rgba(0,0,0,.6); }
</style>
<link rel="stylesheet" href="wall.css">
<script src="wall.js"></script>
<script src="nav.js"></script>
<script>document.write('<script src="strata_engine.js?v='+Date.now()+'"><\/script><script src="strata_view.js?v='+Date.now()+'"><\/script>');</script>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<canvas id="ui"></canvas>
<div id="pname">Strata</div>
<div id="info"></div>
<script>
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  const here=(location.pathname.split('/').pop()||'kiosk.html');
  let i=ROTATION.indexOf(here); if(i<0) i=0;
  location.href=ROTATION[(i+step+ROTATION.length)%ROTATION.length];
}
const CONFIG = {
  holdMin: 12,            // NOT the pacing - one landscape is runMin (7) plus a
                          // closing sentence. This is the deadline for a stalled run.
  nextPage: '' /* standalone: nowhere to hand on to; start again */,  // on to the race, which is cut into a landscape like this one (2026-09-10)
  runMin: 7,              // every landscape runs this long (Joe: 5-10 min is right) - erosion is
                          // PACED against the clock so a soft world does not finish in a minute
  target: 0.66,           // fraction of the rock the pacing aims to have removed by the end
  fpsCap: 8,              // the picture is redrawn at most this often
  orbitSec: 490,          // one slow lap of the camera (Joe: ~10% faster than 540)
  vexag: 1.8,             // vertical exaggeration in the picture (stated in i)
};
const Q=new URLSearchParams(location.search);
const PINNED=Q.has('pin');
let seed=Q.has('seed')?(Q.get('seed')|0):((Math.random()*1e9)|0);
const TIGHT=Q.has('tight')?Q.get('tight')==='1':undefined;   // force the tight fold on/off, for photographs
const SELF=location.pathname.split('/').pop()||'strata.html';   // this file's own name (index.html on the site)

/* ---- the ladder, in canvas units (DESIGN_STANDARDS section 7) ------------ */
const TIER={t0:160,t1:80,t2:58,t3:44,t4:32,t5:26}, FLOOR={t0:56,t1:30,t2:22,t3:17,t4:13,t5:11};
const TS=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ts'))||1;
let DPR=1, WU=1, T=k=>0;
function setTypeScale(){ DPR=devicePixelRatio||1; WU=(innerWidth/3840)*DPR; T=k=>Math.max(FLOOR[k]*DPR, TIER[k]*TS*WU); }
const INK='rgba(240,246,253,.95)', INK2='rgba(210,224,242,.80)';
const MONO='ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace';

/* ---- the world ------------------------------------------------------------ */
const cv=document.getElementById('cv');
const ui=document.getElementById('ui'), uctx=ui.getContext('2d');
let w=null, startedAt=performance.now(), t0=performance.now(), stepMs=20, frames=0, fps=0, lastFpsAt=performance.now(), handingOff=false, ended=false;
let stat={step:0,years:0,removed:0,storms:0,cover:null};

/* ---- the worker: erosion on a second core -----------------------------------
   The main thread keeps a MIRROR world (same seed, same static beds and fold
   field) for drawing, and receives z + rain after every batch of steps. With
   ?steps=N (headless photographs) everything runs on the main thread. */
const USE_WORKER=!Q.has('steps') && typeof Worker!=='undefined';
let worker=null, busy=false;
function makeWorker(){
  const body=`(${StrataFactory.toString()})(self);
    let w=null;
    self.onmessage=(e)=>{ const m=e.data;
      if(m.cmd==='new'){ w=Strata.makeWorld(m.seed,{tight:m.tight}); self.postMessage({cmd:'ready'}); }
      else if(m.cmd==='step' && w){ const t=Date.now(); for(let i=0;i<m.n;i++) Strata.step(w);
        const s=Strata.stats(w);
        self.postMessage({cmd:'state', z:w.z.slice(0), rain:w.rain.slice(0), stat:{step:s.step,years:s.years,removed:s.removed,storms:s.storms,cover:s.cover}, ms:(Date.now()-t)/m.n}); } };`;
  const wk=new Worker(URL.createObjectURL(new Blob([body],{type:'text/javascript'})));
  wk.onmessage=(e)=>{ const m=e.data;
    if(m.cmd==='ready'){ busy=false; }
    else if(m.cmd==='state'){ w.z.set(m.z); w.rain.set(m.rain); w.step=m.stat.step; w.removed=m.stat.removed; stat=m.stat; stepMs=0.8*stepMs+0.2*m.ms; busy=false; } };
  return wk;
}
function newWorld(s){
  seed=s; w=Strata.makeWorld(seed,{tight:TIGHT}); stat=Strata.stats(w);
  t0=performance.now(); ended=false;
  if(USE_WORKER){ if(!worker) worker=makeWorker(); busy=true; worker.postMessage({cmd:'new',seed,tight:TIGHT}); }
  Wall.clearEpisode(); Wall.clearTimers(); schedule();
  console.log('[strata] seed',seed,'beds',w.L,'worker',USE_WORKER);
}

/* ---- the words ------------------------------------------------------------ */
const LEAD='Folded beds of sandstone and shale, cut by rain: the hard beds hold up cliffs while the soft ones strip away.';
function schedule(){
  Wall.episode(LEAD);
  Wall.every(1000,tick);
}
function tick(){
  if(!w) return;
  const runFor=performance.now()-t0;
  if(!ended && (runFor>CONFIG.runMin*60000 || w.step>=w.P.maxSteps)){
    ended=true;
    Wall.lane((w.step*w.P.dt/1e6).toFixed(1)+' million years have passed and '+Math.round(100*w.removed)+'% of the rock is gone. A new landscape folds, and the rain begins again.');
    const next=(seed*1664525+1013904223)>>>0;
    /* Pinned as the sole page, the page RELOADS itself with the next seed
       rather than reseeding in place: the wall's watchdog restarts any page
       whose URL has not changed in 25 min, and a fresh URL every 7 keeps it
       quiet (and the tab memory-fresh). In the ring it HANDS ON instead:
       one landscape is the show, and the wall advances when it is over. */
    Wall.after(12000,()=>{ if(PINNED) location.replace(SELF+'?pin&seed='+next);
                           else if(CONFIG.nextPage) handOff();      // in the ring: the landscape is done, so hand on
                           else newWorld(next); });
  }
  if(!PINNED && CONFIG.nextPage && performance.now()-startedAt>CONFIG.holdMin*60000) handOff();
}
function handOff(){
  if(handingOff) return; handingOff=true;
  Wall.clearEpisode(); Wall.clearTimers();
  document.body.style.transition='opacity 1400ms ease-in-out'; document.body.style.opacity='0';
  setTimeout(()=>{ location.href=CONFIG.nextPage; },1500);
}

/* ---- stepping: paced against the clock ---------------------------------------
   The rock-removed fraction is asked to track a straight line from 0 to
   CONFIG.target over runMin; steps run only while erosion is behind that line,
   plus a trickle so a hard world never stands still. A soft world therefore
   erodes slowly and a hard one at full speed, and both fill the dwell. */
let paused=false, trickleAt=0;
setInterval(()=>{
  if(!w||paused||ended||w.step>=w.P.maxSteps) return;
  const now=performance.now(), goal=CONFIG.target*Math.min(1,(now-t0)/(CONFIG.runMin*60000));
  const behind=w.removed<goal, trickle=now-trickleAt>400;
  if(!behind && !trickle) return;
  const n=behind?3:1; trickleAt=now;
  if(USE_WORKER){ if(busy) return; busy=true; worker.postMessage({cmd:'step',n}); }
  else { const t=now; for(let i=0;i<n;i++) Strata.step(w); stat=Strata.stats(w); stepMs=0.8*stepMs+0.2*(performance.now()-t)/n; }
},100);

/* ---- the picture ---------------------------------------------------------- */
/* the picture is drawn by strata_view.js (shared with race.html) */
const view=StrataView.create(cv);
function render(now){
  view.setWorld(w);
  view.render(StrataView.orbitCamera(w,(now-t0)/1000,CONFIG.orbitSec),{vexag:CONFIG.vexag});
  drawUI();
}

/* ---- the gauge: a stratigraphic column, wider = harder (bottom-right) ----- */
function drawUI(){
  setTypeScale();
  if(ui.width!==Math.round(innerWidth*DPR)||ui.height!==Math.round(innerHeight*DPR)){ ui.width=Math.round(innerWidth*DPR); ui.height=Math.round(innerHeight*DPR); }
  const W=ui.width, H=ui.height; uctx.clearRect(0,0,W,H);
  const SX=134*WU, floor=(200*TS+120)*WU, colH=H*0.28, colW=150*WU, x1=W-SX, y1=H-floor-T('t4')*1.8;
  const cover=stat.cover||Strata.stats(w).cover;
  const total=w.top; let y=y1;
  uctx.textAlign='right'; uctx.textBaseline='alphabetic';
  for(let k=0;k<w.L;k++){
    const l=w.layers[k], h=colH*l.thick/total, wdt=colW*(0.35+0.65*Math.min(1,0.3/l.k));
    const exposed=cover[k+1]>0.005, gone=!exposed && k>maxExposed(cover);
    uctx.globalAlpha=gone?0.18:(exposed?1:0.55);
    uctx.fillStyle='rgb('+l.color.join(',')+')'; uctx.fillRect(x1-wdt,y-h,wdt,h-Math.max(1,1.5*WU));
    y-=h;
  }
  uctx.globalAlpha=1;
  uctx.fillStyle=INK2; uctx.font='400 '+T('t4')+'px '+MONO;
  uctx.shadowColor='rgba(0,0,0,.85)'; uctx.shadowBlur=T('t4')*0.35;
  uctx.fillText('THE BEDS · WIDER IS HARDER',x1,H-floor);
  uctx.shadowBlur=0;
  // the instrument: elapsed time, rock removed, weather (Wall.instrument writes only on change)
  const s=stat;
  const yrs=s.years<1e6?Math.round(s.years/1e3)+' thousand years':(s.years/1e6).toFixed(2)+' million years';
  Wall.instrument({place:'bl',cols:1,rows:[
    {k:'elapsed',v:yrs},
    {k:'rock removed',v:Math.round(100*s.removed)+' %'},
    {k:'rainfall',v:s.storms?(s.storms===1?'one wet belt drifting across':s.storms+' wet belts drifting across'):'even across the plateau'}]});
  if(document.body.classList.contains('showinfo')) updateInfo();
}
function maxExposed(cover){ let m=-1; for(let k=0;k<w.L;k++) if(cover[k+1]>0.005) m=k; return m; }

/* ---- the i overlay ---------------------------------------------------------- */
const infoEl=document.getElementById('info');
function updateInfo(){
  const s=stat;
  infoEl.textContent=
`seed      ${seed}   step ${s.step}/${w.P.maxSteps}   ${stepMs.toFixed(0)} ms/step   fps ${fps.toFixed(0)}   grid ${w.nx}x${w.ny} at ${w.dx} m, vertical x${CONFIG.vexag}
removed   ${(100*s.removed).toFixed(1)}%   storms ${s.storms}   plane ${w.plane.toFixed(0)} m   base level ${w.zb.toFixed(0)} m
beds      ${w.layers.map((l,k)=>l.type.slice(0,4)+Math.round(l.thick)+'m/k'+l.k.toFixed(2)+(s.cover[k+1]>0.005?'*':'')).join(' ')}
folds     ${w.trains.map(t=>'A'+t.A.toFixed(0)+' λ'+t.lam.toFixed(0)+' θ'+(t.th*180/Math.PI).toFixed(0)).join('  ')}  dome ${w.dome.A.toFixed(0)}m  tilt ${w.tilt.gx.toFixed(3)},${w.tilt.gy.toFixed(3)}${w.tight?'  TIGHT A'+w.tight.A.toFixed(0)+' λ'+w.tight.lam.toFixed(0)+' dip '+w.tight.dipDeg.toFixed(0)+'°':''}
model     stream power dz/dt = -K sqrt(Q) S (implicit) · K by exposed bed · orographic + storm rain · creep D=${w.P.diff} · uplift ${w.P.uplift} m/step · dt ${w.P.dt} yr
keys: n new world · p pause · i info · arrows change page`;
}
addEventListener('keydown',(e)=>{
  switch(e.key){
    case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
    case 'n': case 'N': newWorld((Math.random()*1e9)|0); break;
    case 'p': case 'P': paused=!paused; break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
  }
});

/* ---- go ---------------------------------------------------------------------- */
newWorld(seed);
if(Q.has('steps')){ const n=Q.get('steps')|0; for(let i=0;i<n;i++) Strata.step(w); stat=Strata.stats(w); }
let lastFrame=0;
function frame(now){
  if(now-lastFrame>=1000/CONFIG.fpsCap){ lastFrame=now; render(now); frames++;
    if(now-lastFpsAt>2000){ fps=frames*1000/(now-lastFpsAt); frames=0; lastFpsAt=now; } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
