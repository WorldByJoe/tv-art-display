<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<link rel="stylesheet" href="wall.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 2.5s ease; pointer-events: none; }
</style>
<script src="wall.js"></script>
<script src="nav.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fade"></div>
<script src="three.min.js"></script>
<script src="murmuration_engine.js"></script>
<script src="murmuration_tree.js"></script>
<script>
'use strict';
/* ==========================================================================
  murmuration.html · v0.9 · 2026-10-03

  Starlings over a field at dusk, seen from where a person would stand at its
  edge. No text at all, by design (Joe, 2026-10-02): this one is nerdy in its
  simplicity. The model is murmuration_engine.js; this file only looks at it.

  WHAT EACH RUN DRAWS. The number of birds, every behavioural constant (see
  the engine), and the evening: warm or cool light, where the glow sits, how
  hazy. The light fades a little across the run, as dusk does.

  NOBODY IS IN CHARGE. Every bird follows the same rules and nobody knows
  where the flock is going (Joe chose realism over control, 2026-10-02). The
  flock roams over its roost, sometimes close, sometimes far, sometimes out of
  sight - which is what watching a real one is like. Near the end of each run,
  as the light goes, the birds pour down into the field one by one and then
  all at once.

  SMOOTH OVER MANY. The flock steps at a fixed 30 Hz and every frame draws the
  birds part-way between steps, so the motion is as smooth as the display can
  run whatever the step rate. Bird count is capped by what the Pi holds at
  60 fps at 4K, not by what it can simulate.

  DRAWING A BIRD. A few triangles: body, tail, two pointed wings that flap
  and glide in the vertex shader. A bird far off would shrink below a pixel
  and shimmer, so the shader never lets one draw smaller than minPx().

  THE TREE. One big leafless tree per run, grown by murmuration_tree.js and
  placed off-centre 55-100 m out. It is the birds' roost: they range round it,
  steer clear of its crown, and at dusk settle onto its branches. Limbs over
  4 cm are solid tapered tubes, 1.2-4 cm solid lines (21k tubes had held the
  Pi to 56-60 fps); twigs are 1-px lines, which is the grey haze a winter
  crown makes against the sky.

  THE MOON. Its PHASE is the real one at the moment the run starts (mean
  synodic month from the new moon of 2000-01-06 18:14 UTC - good to well
  under a day). Its lit limb faces the sunset glow, as a real moon's does.
  Its PLACE is not astronomical: a real waxing crescent sits low near the
  sunset and a full moon rises behind you at dusk, so either would usually be
  out of this view. It is drawn about 1.6x its true size and faintly, and not
  at all within two days of new moon, when a real one cannot be seen.

  URL: ?solo=N holds the wall here N minutes · ?seed=S repeats a run ·
       ?t=S starts S seconds in (for captures) · ?rs=0.75 renders smaller
       and lets the browser scale up.

  CHANGED
    v0.9  the tree is grown knowing where the eye is, so its big limbs are
          pruned flat to the view (tree v0.6); tubes overlap at joints, so
          a bending trunk no longer shows a hairline crack of sky
    v0.8  standalone copies draw at the screen's own resolution (Retina up to
          2x) with antialiasing, stepping down if the frame rate sags
    v0.7  standalone (GitHub) copies fly 3,000-5,000 birds and thin the flock
          if a warm-up timing says this machine cannot keep up
    v0.6  the roost fills, is flushed and re-forms twice before the flock stays
          (engine v0.6); an opener tree in wood a shade lighter than the birds
    v0.5  one large leafless tree (murmuration_tree.js) the flock roosts in, and
          a faint moon in tonight's real phase
========================================================================== */

const CONFIG = { holdMin: 8, nextPage: '' /* standalone: nowhere to hand on to; start again */, runSec: 480, warmSec: 20 };
const Q = new URLSearchParams(location.search);
const PINNED = Q.has('pin');
const SOLO_MIN = parseFloat(Q.get('solo') || '0');
/* MEASURED ON THE PI (2026-10-02, 1,500 birds): 4K with antialiasing 15 fps;
   4K without 42; 0.75 scale 29; 0.5 scale 42; 0.5 or 0.6 without 60, and 60
   still at 3,000 birds. Smooth beats sharp here (Joe), so the default draws at
   0.6 of the screen with no antialiasing and lets the browser scale it up -
   which softens the edges about as much as antialiasing would have. */
/* A STANDALONE copy (the GitHub build empties nextPage) is opened on real
   computers, and Joe asked for full resolution there (2026-10-03): the screen's
   own pixels, Retina up to 2x, with antialiasing. If that sags below 45 fps for
   two readings in a row, the render scale steps down toward the wall's 0.6. */
const STANDALONE = !CONFIG.nextPage;
const DPR = STANDALONE ? Math.min(2, window.devicePixelRatio || 1) : 1;
let RS = Math.min(1, Math.max(0.4, parseFloat(Q.get('rs') || (STANDALONE ? '1' : '0.6'))));
const START_T = parseFloat(Q.get('t') || '0');
const N_FIX = parseInt(Q.get('n') || '0', 10);    // ?n=2500 fixes the count (for measuring)
/* THE WALL'S PI vs A REAL COMPUTER (Joe, 2026-10-03). The Pi holds 60 fps at
   up to ~2,500 birds (measured). A standalone copy - empty nextPage, which is
   how the GitHub build marks it - is opened on laptops and desktops and flies
   3,000-5,000, a median of 4,000. One source; the page decides. */
const N_RANGE = CONFIG.nextPage ? [1500, 2500] : [3000, 5000];
/* ...and a standalone copy times its own warm-up: a step costing more than
   STEP_BUDGET_MS on THIS machine (a phone, an old laptop) means it could not
   hold 60 fps, so the evening's flock is thinned until a step costs about
   STEP_TARGET_MS. The wall is a measured machine and is left alone. */
const STEP_BUDGET_MS = 12, STEP_TARGET_MS = 9;
let seed = Q.has('seed') ? (parseInt(Q.get('seed'), 10) >>> 0) : ((Date.now() ^ (Math.random() * 1e9)) >>> 0);

const DT = 1 / 30;
/* in RENDER pixels: ~3.3 screen px on the wall (0.6), ~2.4 CSS px standalone */
const minPx = () => Math.max(2.0, 2.4 * RS * DPR);
/* A real starling spans 37-42 cm. Drawn at 1.3x, a deliberate liberty: on a
   TV across the room the life-size bird read as dust (Joe, 2026-10-02). The
   flock's spacing and speeds stay life-size; only the drawing is enlarged. */
const BIRD_SCALE = 1.3;
const EYE = new THREE.Vector3(0, 1.7, -12);       // a person at the field's near edge
const FOV = 42;                                   // vertical; the eye looks 13 deg up, so the horizon sits low and the sky has room

/* ------------------------------------------------------------- renderer */
const canvas = document.getElementById('gl');
const AA = Q.has('aa') ? Q.get('aa') === '1' : STANDALONE;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: AA, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.3, 9000);
camera.position.copy(EYE);
camera.lookAt(0, 1.7 + 200 * Math.tan(13 * Math.PI / 180), 188);

function resize() {
  const w = Math.round(innerWidth * RS * DPR), h = Math.round(innerHeight * RS * DPR);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  birdUniforms.uPxScale.value = 2 * Math.tan(FOV * Math.PI / 360) / h;
  birdUniforms.uMinPx.value = minPx();
}

/* ------------------------------------------------------------- the evening */
const C = (hex) => new THREE.Color(hex);
function mixC(a, b, t) { return a.clone().lerp(b, t); }

function drawEvening(r) {
  const w = r();                                  // 0 cool .. 1 warm
  const hor = mixC(mixC(C('#b8c8cf'), C('#c6bfdc'), r()), mixC(C('#f0a262'), C('#e98c74'), r()), w);
  const mid = mixC(C('#7d95b3'), C('#c48e9e'), w * (0.6 + 0.4 * r()));
  const zen = mixC(mixC(C('#1d2b4b'), C('#262247'), r()), C('#2a3460'), w * 0.5);
  const glow = mixC(C('#e8e4da'), C('#ffb46e'), w);
  const az = (r() - 0.5) * 1.2;                   // radians from straight ahead
  const el = -0.04 + r() * 0.06;
  return {
    hor, mid, zen, glow,
    sun: new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).normalize(),
    glowAmt: 0.12 + w * (0.25 + 0.35 * r()),
    glowPow: 3 + r() * 5,
    haze: 0.85 + r() * 0.3,
    ground: mixC(mixC(C('#6e6a52'), C('#7b6f55'), r()), hor, 0.22).multiplyScalar(0.62),
    trees: mixC(C('#151a14'), zen, 0.18),
    hills: mixC(C('#3a4250'), hor, 0.35),
    fadeTo: 0.74 + r() * 0.1,                     // how far the light goes by the end
  };
}

/* ------------------------------------------------------------- sky */
const skyUniforms = {
  uZen: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
  uGlow: { value: new THREE.Color() }, uSun: { value: new THREE.Vector3(0, 0, 1) },
  uGlowAmt: { value: 0.3 }, uGlowPow: { value: 5 }, uDark: { value: 1 },
  uMoonDir: { value: new THREE.Vector3(0, 0.4, 1).normalize() }, uMoonE1: { value: new THREE.Vector3(1, 0, 0) },
  uMoonE2: { value: new THREE.Vector3(0, 1, 0) }, uMoonT: { value: new THREE.Vector2(1, 0) },
  uMoonAlpha: { value: 1.0 }, uMoonR: { value: 0.0073 }, uMoonI: { value: 0 },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(5000, 48, 24),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = wp.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 uZen, uMid, uHor, uGlow, uSun;
      uniform float uGlowAmt, uGlowPow, uDark;
      uniform vec3 uMoonDir, uMoonE1, uMoonE2; uniform vec2 uMoonT;
      uniform float uMoonAlpha, uMoonR, uMoonI;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, 0.0, 1.0);
        vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.20, h));
        col = mix(col, uZen, smoothstep(0.10, 0.80, h));
        float s = max(dot(d, uSun), 0.0);
        col += uGlow * uGlowAmt * (pow(s, uGlowPow) * (1.0 - smoothstep(0.0, 0.45, h)) + 0.25 * pow(s, 40.0));
        /* the moon: a sphere lit from the sunward side at the phase angle */
        if (uMoonI > 0.0) {
          float c = dot(d, uMoonDir);
          vec3 o = d - uMoonDir * c;
          vec2 uv = vec2(dot(o, uMoonE1), dot(o, uMoonE2)) / uMoonR;
          float rr = dot(uv, uv);
          if (c > 0.0 && rr < 1.6) {
            float edge = 1.0 - smoothstep(0.92, 1.0, sqrt(rr));
            vec3 n = vec3(uv, sqrt(max(0.0, 1.0 - rr)));
            vec3 L = vec3(uMoonT * sin(uMoonAlpha), cos(uMoonAlpha));
            float lit = smoothstep(-0.04, 0.08, dot(n, L));
            float limb = 0.75 + 0.25 * n.z;
            vec3 moonCol = vec3(0.93, 0.92, 0.86);
            col = mix(col, moonCol, uMoonI * edge * (lit * limb + 0.04));
            col += moonCol * 0.035 * uMoonI * exp(-rr * 0.9) * (1.0 - edge);   // a breath of glow
          }
        }
        col *= uDark;
        /* dither: an 8-bit gradient across a 4K sky bands visibly without it */
        col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
sky.renderOrder = -1;
scene.add(sky);

/* ------------------------------------------------------------- ground, trees, hills */
const groundMat = new THREE.MeshBasicMaterial({ vertexColors: true });
let ground = null, treeLine = null, hills = null;
const lineMat = new THREE.MeshBasicMaterial({ color: 0x000000 });   // the distant tree line
const hillMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

function buildGround(r) {
  if (ground) { scene.remove(ground); ground.geometry.dispose(); }
  const g = new THREE.PlaneGeometry(9000, 9000, 180, 180);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  /* soft patches of slightly different grass, nothing you could name */
  const ph = [r() * 6, r() * 6, r() * 6, r() * 6];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const v = 0.5 * Math.sin(x * 0.011 + ph[0]) * Math.sin(z * 0.009 + ph[1])
            + 0.35 * Math.sin(x * 0.031 + z * 0.017 + ph[2]) + 0.25 * Math.sin(z * 0.043 - x * 0.012 + ph[3]);
    /* the foreground is in the dusk shadow; the far field catches the sky */
    const dist = Math.hypot(x - EYE.x, z - EYE.z);
    const k = (1 + 0.11 * v) * (0.62 + 0.38 * Math.min(1, dist / 220));
    col[i * 3] = k; col[i * 3 + 1] = k * (1 + 0.03 * v); col[i * 3 + 2] = k * (1 - 0.02 * v);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  ground = new THREE.Mesh(g, groundMat);
  scene.add(ground);
}

/* A silhouette band around the forward half of the view at radius R:
   heights from overlapping elliptical crowns (trees) or slow sines (hills). */
function band(R, heightAt, mat, az0, az1) {
  const n = Math.round((az1 - az0) * 2400);
  const pos = new Float32Array((n + 1) * 6), idx = [];
  for (let k = 0; k <= n; k++) {
    const a = az0 + (az1 - az0) * k / n, h = heightAt(a);
    const x = EYE.x + Math.sin(a) * R, z = EYE.z + Math.cos(a) * R;
    pos.set([x, -3, z, x, h, z], k * 6);
    if (k < n) { const b = k * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, mat);
  scene.add(m);
  return m;
}

function buildHorizon(r) {
  if (treeLine) { scene.remove(treeLine); treeLine.geometry.dispose(); }
  if (hills) { scene.remove(hills); hills.geometry.dispose(); }
  const R = 760 + r() * 300;
  const trees = [];
  let a = -1.35;
  while (a < 1.35) {
    if (r() < 0.12) { a += 0.02 + r() * 0.08; continue; }          // a gap in the line
    const hw = (5 + r() * 10) / R, h = 9 + r() * 15;
    trees.push([a, hw, h]); a += hw * (0.6 + r() * 0.9);
  }
  const hedge = 1.5 + r() * 2.5;
  treeLine = band(R, (az) => {
    let h = hedge * (0.8 + 0.2 * Math.sin(az * 40));
    for (const [c, hw, th] of trees) {
      const d = (az - c) / hw;
      if (d > -1 && d < 1) h = Math.max(h, th * Math.sqrt(1 - d * d) + 2);
    }
    /* crowns are ragged, not bubbles - but leafy, not spiky: soft noise at a
       few scales, under a metre at 900 m (the first try at 2 m read as pines) */
    const n = 0.6 * Math.sin(az * 330 + 1.3) + 0.4 * Math.sin(az * 760 + 0.2) + 0.25 * Math.sin(az * 1530 + 2.1);
    return h > hedge * 1.3 ? h + n * Math.min(0.9, h * 0.06) : h;
  }, lineMat, -1.4, 1.4);
  const p = [r() * 6, r() * 6, r() * 6], amp = 50 + r() * 90;
  hills = band(2900, (az) => 12 + amp * (0.5 + 0.3 * Math.sin(az * 2.1 + p[0]) + 0.15 * Math.sin(az * 5.3 + p[1]) + 0.05 * Math.sin(az * 13 + p[2])),
               hillMat, -1.5, 1.5);
  hills.renderOrder = 0;
}

/* ------------------------------------------------------------- the roost tree */
let tree = null, treeMeshes = [];
const treeMat = (() => new THREE.MeshBasicMaterial({ color: 0x000000 }))();
/* twigs are a haze, not a mass: at 0.6 the crown read as a solid blob and
   hid the birds roosting in it */
const twigMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
const limbMat = new THREE.LineBasicMaterial({ color: 0x000000 });          // small limbs: solid lines
function tubeGeometry(t) {
  /* each segment a tapered 5-sided tube; consecutive segments share their
     radius at the joint, so the silhouette is continuous. Each runs on half
     its end radius past its end: where the axis bends, the next tube's ring
     tilts and opened a hairline crack of sky on the outside of the bend */
  const n = t.length / 8, S = 5;
  const pos = new Float32Array(n * S * 2 * 3), idx = new Uint32Array(n * S * 6);
  for (let k = 0; k < n; k++) {
    const o = k * 8;
    const ax = t[o], ay = t[o + 1], az = t[o + 2];
    let bx = t[o + 3], by = t[o + 4], bz = t[o + 5];
    let dx = bx - ax, dy = by - ay, dz = bz - az; const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
    const ov = 0.5 * t[o + 7]; bx += dx * ov; by += dy * ov; bz += dz * ov;
    let ex = Math.abs(dy) < 0.9 ? dz : 0, ey = Math.abs(dy) < 0.9 ? 0 : -dz, ez = Math.abs(dy) < 0.9 ? -dx : dy;   // a perpendicular
    const el = Math.hypot(ex, ey, ez) || 1; ex /= el; ey /= el; ez /= el;
    const fx = dy * ez - dz * ey, fy = dz * ex - dx * ez, fz = dx * ey - dy * ex;
    for (let s2 = 0; s2 < S; s2++) {
      const a = s2 / S * 6.2832, c = Math.cos(a), sn = Math.sin(a);
      const nx = ex * c + fx * sn, ny = ey * c + fy * sn, nz = ez * c + fz * sn;
      const v = (k * S + s2) * 6;
      pos[v] = ax + nx * t[o + 6]; pos[v + 1] = ay + ny * t[o + 6]; pos[v + 2] = az + nz * t[o + 6];
      pos[v + 3] = bx + nx * t[o + 7]; pos[v + 4] = by + ny * t[o + 7]; pos[v + 5] = bz + nz * t[o + 7];
      const a0 = (k * S + s2) * 2, a1 = (k * S + (s2 + 1) % S) * 2, q = (k * S + s2) * 6;
      idx[q] = a0; idx[q + 1] = a0 + 1; idx[q + 2] = a1; idx[q + 3] = a1; idx[q + 4] = a0 + 1; idx[q + 5] = a1 + 1;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function buildTree(r) {
  for (const m of treeMeshes) { scene.remove(m); m.geometry.dispose(); }
  treeMeshes = [];
  /* off-centre, 70-140 m out: a third of the way in from either side */
  const zt = 55 + r() * 45, side = r() < 0.5 ? -1 : 1, xt = side * (0.12 + r() * 0.18) * (zt + 12);
  tree = MurmurationTree.grow(r, { base: [xt, 0, zt], eye: [EYE.x, EYE.z] });
  const tubes = new THREE.Mesh(tubeGeometry(tree.tubes), treeMat);
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(tree.twigs, 3));
  const twigs = new THREE.LineSegments(tg, twigMat);
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(tree.limbs, 3));
  const limbs = new THREE.LineSegments(lg, limbMat);
  tubes.frustumCulled = twigs.frustumCulled = limbs.frustumCulled = false;
  scene.add(tubes); scene.add(limbs); scene.add(twigs);
  treeMeshes = [tubes, limbs, twigs];
  tree.x = xt; tree.z = zt;
}

/* ------------------------------------------------------------- the moon */
/* Days since new moon, from the mean synodic month. */
function moonAge(date) {
  const SYN = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  const d = date.getTime() / 86400000 - ref;
  return ((d % SYN) + SYN) % SYN;
}
function placeMoon(r) {
  const SYN = 29.530588853, age = moonAge(new Date());
  const elong = 2 * Math.PI * age / SYN;                    // 0 new, pi full
  const alpha = Math.abs(Math.PI - elong);                  // phase angle: 0 full, pi new
  const shown = age > 2 && age < SYN - 2;
  const az = (r() < 0.5 ? -1 : 1) * (8 + r() * 20) * Math.PI / 180, alt = (14 + r() * 14) * Math.PI / 180;
  const fwd = new THREE.Vector3(0, 0, 1);
  const M = new THREE.Vector3(Math.sin(az) * Math.cos(alt), Math.sin(alt), Math.cos(az) * Math.cos(alt)).normalize();
  const E1 = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), M).normalize();
  const E2 = new THREE.Vector3().crossVectors(M, E1).normalize();
  const S = eve.sun.clone();
  const t = new THREE.Vector2(S.dot(E1), S.dot(E2)); if (t.lengthSq() < 1e-6) t.set(0, -1); t.normalize();
  skyUniforms.uMoonDir.value.copy(M); skyUniforms.uMoonE1.value.copy(E1); skyUniforms.uMoonE2.value.copy(E2);
  skyUniforms.uMoonT.value.copy(t); skyUniforms.uMoonAlpha.value = alpha;
  skyUniforms.uMoonR.value = 0.0073;                        // 0.42 deg - 1.6x the true 0.26
  skyUniforms.uMoonI.value = shown ? 0.32 + 0.12 * r() : 0;
  window.MURM_MOON = { age: +age.toFixed(2), illuminated: +((1 + Math.cos(alpha)) / 2).toFixed(2), shown };
}

/* ------------------------------------------------------------- birds */
const birdUniforms = { uPxScale: { value: 0.001 }, uMinPx: { value: 2.0 }, uSpan: { value: 0.40 * BIRD_SCALE } };
function birdGeometry() {
  /* metres; z forward, x along the wings, y up. Wingspan 0.40 m. */
  const V = [], W = [];
  const tri = (a, b, c, wa, wb, wc) => { V.push(...a, ...b, ...c); W.push(wa, wb, wc); };
  const nose = [0, 0, 0.12], tail = [0, 0, -0.09];
  tri(nose, [-0.028, 0, 0], tail, 0, 0, 0); tri(nose, tail, [0.028, 0, 0], 0, 0, 0);       // body, flat
  tri(nose, [0, 0.022, 0], tail, 0, 0, 0); tri(nose, tail, [0, -0.022, 0], 0, 0, 0);       // body, edge-on
  tri([-0.03, 0, -0.13], [0.03, 0, -0.13], [0, 0, -0.06], 0, 0, 0);                        // tail
  tri([-0.02, 0, 0.045], [-0.02, 0, -0.03], [-0.20, 0, -0.05], 0, 0, 1);                   // wings: tip flaps
  tri([0.02, 0, 0.045], [0.20, 0, -0.05], [0.02, 0, -0.03], 0, 1, 0);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(V.map(v => v * BIRD_SCALE), 3));
  g.setAttribute('aWing', new THREE.Float32BufferAttribute(W, 1));
  return g;
}
/* No fog on the birds: at a few hundred metres at dusk a starling is still a
   black mark, and fogged they read as grey dust. */
const birdMat = new THREE.MeshBasicMaterial({ color: 0x060608, side: THREE.DoubleSide, fog: false });
birdMat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, birdUniforms);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
      attribute float aWing; attribute float aPhase; attribute float aAmp; attribute float aFold;
      uniform float uPxScale; uniform float uMinPx; uniform float uSpan;`)
    .replace('#include <begin_vertex>', `
      vec3 transformed = vec3(position);
      if (aWing > 0.5) {
        float ax = abs(position.x) * mix(1.0, 0.25, aFold);
        float th = aAmp * (0.85 * sin(aPhase)) + 0.12 * aAmp;
        transformed.x = sign(position.x) * ax * cos(th);
        transformed.y = ax * sin(th);
        transformed.z = mix(position.z, -0.07, aFold);
      }
      /* perched: a plump upright bird, not a folded sliver - sat on a branch a
         starling is a small dark blob tilted nose-up */
      if (aFold > 0.0) {
        transformed.y *= 1.0 + 2.6 * aFold;
        transformed.x *= 1.0 + 0.8 * aFold;
        float tz = transformed.z, ty = transformed.y, tilt = 0.55 * aFold;
        transformed.z = tz * cos(tilt) - ty * sin(tilt);
        transformed.y = tz * sin(tilt) + ty * cos(tilt);
      }
      /* never smaller than uMinPx on screen, or a far bird shimmers */
      vec4 o = modelViewMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
      float depth = max(0.3, -o.z);
      transformed *= max(1.0, uMinPx * depth * uPxScale / uSpan);`);
};

let birds = null, flock = null, aPhase, aAmp, aFold;
function buildBirds(N) {
  if (birds) { scene.remove(birds); birds.geometry.dispose(); }
  const g = birdGeometry();
  aPhase = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
  aAmp = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
  aFold = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
  [aPhase, aAmp, aFold].forEach(a => a.setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aPhase', aPhase); g.setAttribute('aAmp', aAmp); g.setAttribute('aFold', aFold);
  birds = new THREE.InstancedMesh(g, birdMat, N);
  birds.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  birds.frustumCulled = false;
  scene.add(birds);
}

/* Each bird's matrix: right, up, forward, position - interpolated between
   the last two flock steps by alpha, then rolled into its bank. */
function placeBirds(alpha) {
  const F = flock, N = F.N, te = birds.instanceMatrix.array;
  for (let i = 0; i < N; i++) {
    const x = F.qx[i] + (F.px[i] - F.qx[i]) * alpha;
    const y = F.qy[i] + (F.py[i] - F.qy[i]) * alpha;
    const z = F.qz[i] + (F.pz[i] - F.qz[i]) * alpha;
    let fx = F.gx[i] + (F.fx[i] - F.gx[i]) * alpha, fy = F.gy[i] + (F.fy[i] - F.gy[i]) * alpha, fz = F.gz[i] + (F.fz[i] - F.gz[i]) * alpha;
    const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
    let rx = fz, rz = -fx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;   // right = up x forward
    let ux = fy * rz - fz * 0, uy = fz * rx - fx * rz, uz = fx * 0 - fy * rx;         // up = forward x right
    const b = -F.bank[i], cb = Math.cos(b), sb = Math.sin(b);
    const Rx = rx * cb + ux * sb, Ry = uy * sb, Rz = rz * cb + uz * sb;
    const Ux = ux * cb - rx * sb, Uy = uy * cb, Uz = uz * cb - rz * sb;
    const o = i * 16;
    te[o] = Rx; te[o + 1] = Ry; te[o + 2] = Rz; te[o + 3] = 0;
    te[o + 4] = Ux; te[o + 5] = Uy; te[o + 6] = Uz; te[o + 7] = 0;
    te[o + 8] = fx; te[o + 9] = fy; te[o + 10] = fz; te[o + 11] = 0;
    te[o + 12] = x; te[o + 13] = y; te[o + 14] = z; te[o + 15] = 1;
    aPhase.array[i] = F.flap[i]; aAmp.array[i] = F.amp[i]; aFold.array[i] = F.landed[i];
  }
  birds.instanceMatrix.needsUpdate = true;
  aPhase.needsUpdate = aAmp.needsUpdate = aFold.needsUpdate = true;
}

/* ------------------------------------------------------------- runs */
let eve = null, runStart = 0, acc = 0, last = 0, fading = false;
function newRun() {
  const r = Murmuration.rng(seed ^ 0x9e3779b9);
  eve = drawEvening(r);
  buildGround(r); buildHorizon(r); buildTree(r); placeMoon(r);
  /* the first descent 3 min 20 s into the run; then fill, rest, flush, fly
     again - twice - and stay for the last minute and a half as the light goes */
  const roostAt = CONFIG.warmSec + 200;
  const treeOpts = { roostAt, flushes: 2, roost: { x: tree.x, z: tree.z }, perches: tree.perches, crown: tree.crown };
  const opts = Object.assign(N_FIX ? { nMin: N_FIX, nMax: N_FIX } : { nMin: N_RANGE[0], nMax: N_RANGE[1] }, treeOpts);
  flock = new Murmuration.Flock(seed, opts);
  let thinnedFrom = 0;
  if (!CONFIG.nextPage && !N_FIX) {
    for (let k = 0; k < 10; k++) flock.update(DT);          // let the JIT settle first
    const t0 = performance.now();
    for (let k = 0; k < 30; k++) flock.update(DT);
    const per = (performance.now() - t0) / 30;
    if (per > STEP_BUDGET_MS) {
      thinnedFrom = flock.N;
      const n2 = Math.max(600, Math.round(flock.N * STEP_TARGET_MS / per));
      flock = new Murmuration.Flock(seed, Object.assign({}, opts, { nMin: n2, nMax: n2 }));
    }
  }
  buildBirds(flock.N);
  /* the flock forms before anyone sees it */
  for (let k = 0, n = Math.round((CONFIG.warmSec + START_T) / DT); k < n; k++) flock.update(DT);
  runStart = performance.now() - START_T * 1000;
  acc = 0; last = performance.now();
  window.MURM = { seed, n: flock.N, thinnedFrom, params: flock.P, fps: 0, simMs: 0 };
  seed = (seed * 1664525 + 1013904223) >>> 0;     // the next run's seed
}

function setLight(dark) {
  skyUniforms.uZen.value.copy(eve.zen); skyUniforms.uMid.value.copy(eve.mid); skyUniforms.uHor.value.copy(eve.hor);
  skyUniforms.uGlow.value.copy(eve.glow); skyUniforms.uSun.value.copy(eve.sun);
  skyUniforms.uGlowAmt.value = eve.glowAmt; skyUniforms.uGlowPow.value = eve.glowPow; skyUniforms.uDark.value = dark;
  const fogC = eve.hor.clone().multiplyScalar(dark);
  if (!scene.fog) scene.fog = new THREE.Fog(fogC, 30, 3000 * eve.haze);
  scene.fog.color.copy(fogC); scene.fog.far = 3000 * eve.haze;
  groundMat.color.copy(eve.ground).multiplyScalar(dark);
  lineMat.color.copy(eve.trees).multiplyScalar(dark);
  /* the wood is a shade LIGHTER than the birds - a little of the evening's
     haze at 60-100 m - so a black starling still reads against a limb */
  const wood = eve.trees.clone().lerp(eve.hor, 0.16).multiplyScalar(dark);
  treeMat.color.copy(wood); twigMat.color.copy(wood); limbMat.color.copy(wood);
  hillMat.color.copy(eve.hills).multiplyScalar(dark);
}

/* ------------------------------------------------------------- loop */
let fpsN = 0, fpsT = performance.now(), simAcc = 0, slowReads = 0;
function frame(now) {
  const dtF = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dtF;
  const s0 = performance.now();
  let steps = 0;
  while (acc >= DT && steps < 4) { flock.update(DT); acc -= DT; steps++; }
  if (steps === 4) acc = 0;
  simAcc += performance.now() - s0;
  const runT = (now - runStart) / 1000;
  setLight(1 - (1 - eve.fadeTo) * Math.min(1, runT / CONFIG.runSec));
  sky.position.copy(camera.position);
  placeBirds(acc / DT);
  renderer.render(scene, camera);
  fpsN++;
  if (now - fpsT > 2000) {
    MURM.fps = Math.round(fpsN * 1000 / (now - fpsT)); MURM.simMs = +(simAcc / fpsN).toFixed(2);
    fpsN = 0; simAcc = 0; fpsT = now;
    /* standalone and not told a scale: two slow readings running -> draw smaller */
    if (STANDALONE && !Q.has('rs') && RS > 0.6 && MURM.fps < 45) {
      if (++slowReads >= 2) { RS = Math.max(0.6, RS * 0.8); resize(); slowReads = 0; MURM.rs = RS; }
    } else slowReads = 0;
  }
  if (!fading && runT > CONFIG.runSec - 3) endRun();
  requestAnimationFrame(frame);
}

function holding() {
  if (PINNED || !CONFIG.nextPage) return true;     // pinned, or standalone with nowhere to hand on to
  const so = window.Wall && Wall.soloNow && Wall.soloNow();
  return !!(so && so.file === 'murmuration.html');
}
function endRun() {
  fading = true;
  document.getElementById('fade').style.opacity = 1;
  setTimeout(() => {
    if (!holding() && shownFor() >= dwell()) return handOff();
    newRun(); fading = false;
    document.getElementById('fade').style.opacity = 0;
  }, 2800);
}
const shownAt = Date.now();
const shownFor = () => Date.now() - shownAt;
const dwell = () => (window.Wall && Wall.holdMs) ? Wall.holdMs(CONFIG.holdMin) : CONFIG.holdMin * 60000;
let handedOff = false;
function handOff() {
  if (handedOff) return; handedOff = true;
  location.href = (window.Wall && Wall.nextPage) ? Wall.nextPage(CONFIG.nextPage) : CONFIG.nextPage;
}
setInterval(() => {
  if (holding() || fading || handedOff) return;
  if (shownFor() >= dwell()) { fading = true; document.getElementById('fade').style.opacity = 1; setTimeout(handOff, 2800); }
}, 5000);

/* ------------------------------------------------------------- boot */
if (SOLO_MIN > 0 && window.Wall && Wall.startSolo) Wall.startSolo('murmuration.html', SOLO_MIN);
if (Q.has('t')) { const f = document.getElementById('fade'); f.style.transition = 'none'; f.style.opacity = 0; }   // captures see the scene at once
addEventListener('resize', resize);
resize();
newRun();
setLight(1);
sky.position.copy(camera.position);
placeBirds(0);
renderer.render(scene, camera);                   // a first frame now, for captures
requestAnimationFrame((t) => { last = t; document.getElementById('fade').style.opacity = 0; requestAnimationFrame(frame); });
</script>
</body>
</html>
