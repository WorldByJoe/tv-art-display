<!doctype html>

<link rel="stylesheet" href="wall.css">
<script src="wall.js"></script>
<script src="nav.js"></script>
<script src="glm_show.js"></script>
<style>
  html,body{margin:0;height:100%;background:#04070d;overflow:hidden}
  #cv{display:block;width:100vw;height:100vh}
  /* THE PANEL IS SEVEN ROWS DEEP, so it takes the tier below the house
     default on both halves of every row. Joe, 2026-09-13: "make the font size
     in the info box smaller; it takes up too much space." Values drop --t3 to
     --t4 and keys --t4 to --t5, the hero --t1 to --t2 - all still above the
     26 px glyph floor, and the box loses about a third of its height. */
  .instr .v{ font-size:var(--t4); }
  .instr .k{ font-size:var(--t5); }
  .instr .cap{ font-size:var(--t5); }
  .instr .hero .hv{ font-size:var(--t2); }
  .instr .hero .hu{ font-size:var(--t5); }
  .instr{ gap:calc(10 * var(--wu)); padding:calc(22 * var(--wu)) calc(28 * var(--wu)); }
  .instr .grid{ gap:calc(8 * var(--wu)) calc(28 * var(--wu)); }
  .instr .row{ gap:calc(2 * var(--wu)); }
  #scrim{position:fixed; top:0; right:0; width:26vw; height:40vh; z-index:6;
         pointer-events:none;
         background:radial-gradient(92% 84% at 100% 0%,
                    rgba(4,7,13,.86) 0%, rgba(4,7,13,.62) 42%, rgba(4,7,13,0) 100%);}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scrim"></div>
<div id="pname">Lantern</div>
<div id="info"></div>
<script>
'use strict';
/* ==========================================================================
  lightning.html · v3.6 · 2026-09-26

  "Lantern": six minutes of real lightning over wherever the sky was busiest,
  replayed flash by flash and pulse by pulse.

  WHY THE NAME. What the satellite sees is not a bolt. The cloud scatters the
  light sideways, so a channel a few kilometres long makes the whole thunder-
  head glow - a paper lantern lit from inside. The ring around each flash is
  that glow at true scale, and it is routinely sixty kilometres across.

  THE DATA IS REAL AND NONE OF THE MOTION IS INVENTED. Every dot is one flash
  recorded by the Geostationary Lightning Mapper on GOES, 35,786 km up, in a
  one-nanometre slice of oxygen light at 777.4 nm. A flash is not an instant:
  it stutters through a median of seventeen separate pulses - GROUPS, in the
  instrument's language, each one a set of pixels lit in the same 2 ms frame -
  and this page draws every pulse at its own recorded moment, in its own
  recorded place, slowed ten times so a fifth of a second becomes two seconds.

  Joe, 2026-09-13: "Can we have the flash duration show up on the screen,
  exaggerated by 10x?" That is EXAGG below, and it is the only liberty taken
  with time. Flashes still ARRIVE at their true rate.

  THE KEY, because a mark that means something has to say what.
     size   = flash energy, through a log - it spans a thousandfold
     colour = age, white at the instant and cooling as its hour passes
     ring   = footprint, the area of cloud top the flash actually lit

  WHERE THE DATA COMES FROM. glm_show.py ranks the whole Western Hemisphere,
  picks the busiest spot, captures six minutes of groups there and bakes them
  into glm_show.js with a Blue Marble basemap for the exact frame. The browser
  cannot read HDF5 and GLM publishes nothing else, so the capture happens at
  build time - which also means this page always has a storm, rather than
  whatever the sky happens to be doing when a stranger opens it.
==========================================================================

  CHANGED
    v3.6  THE BASEMAP IS THE CAPTURE'S OWN. The page asked for a filename
          nothing has written since the capture moved to <stem>_basemap.jpg, so
          a twelve-day-old map of somewhere else sat under every storm while
          the town labels moved correctly. Cache-busted, because every capture
          reuses one filename
    v3.5  THE ENERGY BEAT SAID "undefined". v3.4 moved every figure on to the
          flashes the page is holding, and held() did not carry energy - so the
          one sentence that still asked for it printed nothing at all. It is
          computed from the held flashes now, like every other figure
    v3.4  every figure on the panel describes the flashes the page is HOLDING.
          The data were live and the numbers beside them were not: a sky running
          at 4.9 flashes a second announced the capture's 9.06, and the footer
          claimed six minutes of sky while holding eighty seconds
    v3.3  the live flag was named `live` and draw() already had a local `live`
          counting flashes in the air - so the handoff test read the counter
          and left two seconds after loading. Renamed liveFeed. The globe,
          the flight and the handoff entry point are deleted with it.
    v3.2  the arrow keys actually work: this page bound only 'i' while its own
          diagnostics promised the arrows changed page
    v3.1  a feed gap has to last five minutes to end a showing, not two and a
          half - a cron boundary was enough to qualify
    v3.0  LIVE: the clock is now the wall clock minus 75 s and new granules
          are appended as they publish, so the sky stays about a minute old
          instead of ageing from 6 to 12 minutes while you watch it
    v2.2  age is measured from the NEWEST flash, not the oldest: a capture
          whose last flash was 40 s old was calling itself 7 minutes old
    v2.1  accepts a cache that declares either global, so a pipeline slip
          degrades to a stale sky instead of a dead page; refuses a handoff
          older than what is already showing
    v2.0  opens INSTANTLY on the cached sky and says how old it is, while the
          Pi fetches the current one behind it; the globe is no longer an
          opening but a flight from the old sky to the fresh one, triggered
          as each new granule publishes
    v1.1  the signature says when the sky was recorded, and how long ago -
          a published copy can be hours old and never said so
    v1.0  first build
========================================================================== */
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  const want = (window.Wall && Wall.step) ? Wall.step(step) : null;
  if (want) { location.href = want; return; }
  const here = (location.pathname.split('/').pop() || 'kiosk.html');
  let i = ROTATION.indexOf(here);
  if (i < 0) i = 0;
  location.href = ROTATION[(i + step + ROTATION.length) % ROTATION.length];
}

const CONFIG = {
  exagg:    10,        // Joe's tenfold slowdown of each flash's own duration
  pulseMs:  2200,      // how long ONE pulse takes to die
                       /* The flash's ring used to outlive its pulses by nine
                          seconds, which read as "this flash is still going"
                          long after it had stopped (Joe, 2026-09-13). Ring and
                          pulses now share one clock: a flash is finished one
                          pulse-fade after its last pulse fires. */
  holdMin:  9,
  /* HOW FAR BEHIND LIVE THE PAGE SITS. The newest granule measured 42 s behind
     now on 2026-09-14, and a granule covers 20 s, so 75 s leaves room for one
     late publication without the sky going empty. Lower it and the feed
     starves; raise it and the nerds get staler lightning. */
  lagMs: 75000,
  /* NO APPEND FOR THIS LONG AND THE FEED IS DEAD, NOT QUIET. Generous on
     purpose: glm_feed.sh pushes about every 22 s, but it runs in one-minute
     cron bursts, so a boundary can leave a gap approaching a minute. At 150 s
     an ordinary gap could end a showing the viewer had just walked up to. */
  streamGapMs: 300000,
  nextPage: '' /* standalone: nowhere to hand on to; start again */,
};
const Q = new URLSearchParams(location.search);
const PINNED = Q.has('pin');
/* SHOW IS NO LONGER FIXED FOR THE LIFE OF THE PAGE (Joe, 2026-09-14).
   The page opens on the CACHED sky - whatever was captured last time Lantern
   was shown - and says how old it is, while the Pi captures the current
   hemisphere behind it. A capture takes 17-21 s measured, so the fresh sky
   lands about twenty seconds in; the page is then told about it from OUTSIDE
   (glm_refresh.py, through cdp.py's Runtime.evaluate) and flies to it.

   "This is for nerds and nerds like very fresh data" - so nothing waits on a
   clock that could be waiting on the data instead. The twenty seconds are not
   filled time: they carry the explanation and the age of what is on screen. */
/* GLM_NEXT IS A FALLBACK HERE, AND ONLY A FALLBACK.
   The contract is that the cache declares GLM_SHOW. But on 2026-09-14 a
   promotion renamed glm_next.js to glm_show.js without rewriting the global
   inside it, so the cache declared GLM_NEXT - and this page, looking only for
   GLM_SHOW, told the room "No storm is built" while a perfectly good sky sat
   in the file it had just loaded. The wall went dead over a variable name.
   Accepting either name costs one `||` and means a mistake in the pipeline
   downgrades to a stale sky rather than a blank screen. glm_refresh.py v2.1
   fixes the cause; this is the seatbelt. */
let SHOW = window.GLM_SHOW || window.GLM_NEXT || null;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d', {alpha:false});
const DPR = Math.min(2, window.devicePixelRatio || 1);
let W=0, H=0, base=null, baseReady=false;
let hudCv=null;

function resize(){
  W = cv.width  = Math.max(2, Math.round(innerWidth  * DPR));
  H = cv.height = Math.max(2, Math.round(innerHeight * DPR));
}
addEventListener('resize', resize);

/* The frame is a plain equirectangular box, cover-fitted like the weather map:
   the capture is 16:9 by construction, so the crop is tiny. */
let mapS=1, mapX=0, mapY=0, cosLat=1;
function computeMap(){
  const [a0,a1,o0,o1] = SHOW.box;
  cosLat = Math.cos((a0+a1)/2*Math.PI/180);
  const dLon=(o1-o0)*cosLat, dLat=(a1-a0);
  mapS = Math.max(W/dLon, H/dLat);
  mapX = (W-dLon*mapS)/2; mapY = (H-dLat*mapS)/2;
}
const toX = lon => mapX + (lon - SHOW.box[2])*cosLat*mapS;
const toY = lat => mapY + (SHOW.box[1] - lat)*mapS;

/* The globe that used to open this page, and later carried the flight from one
   sky to the next, is gone with the handoff it served (2026-09-14). The page
   opens on lightning and stays on it; globe.js and its 207 coastline rings went
   with it. Nothing here projects a sphere any more. */

let bootAt = performance.now();
let handedOff=false;
/* WHEN THIS SKY WAS RECORDED, for the end of the signature line (Joe,
   2026-09-14, looking at the published copy: the page never said how old its
   data was).

   t0 is the first flash's own timestamp - the moment the sky being replayed
   actually happened - not when the file was written. UTC, because the storm
   and the viewer are rarely in the same country and a local clock here would
   mean a different thing to each of them.

   THE AGE IS COMPUTED AT LOAD, and that is the point rather than a detail.
   The TV re-captures after every showing, but the published copy only changes
   when the Pi pushes, so a visitor can arrive at a sky several hours old and
   until now had no way to tell. Saying "4 h ago" makes staleness visible on
   the page itself instead of only in a log nobody reads. */
const MONTH3 = ['Jan','Feb','Mar','Apr','May','Jun',
                'Jul','Aug','Sep','Oct','Nov','Dec'];
/* HOW OLD THE SKY ON SCREEN IS, as an opening sentence rather than a footnote.
   Joe, 2026-09-14: the page should say "Here's what was happening XX minutes
   (or hours) ago". It is the first thing said, because the cached sky is the
   recent past and a piece that shows the past should admit it before it says
   anything clever. Reuses the same age arithmetic as the signature. */
/* Natural Earth gives formal country names, which do not sit in a sentence:
   "the sky over United States of America". A handful take a definite article
   and two are worth shortening; everything else passes through untouched. The
   the panel still shows the formal name - this is only for prose. */
const PLACE_WORDS = {
  'United States of America': 'the United States',
  'Democratic Republic of the Congo': 'the DR Congo',
  'Republic of the Congo': 'the Congo',
  'Dominican Republic': 'the Dominican Republic',
  'Bahamas': 'the Bahamas',
  'Netherlands': 'the Netherlands',
  'Philippines': 'the Philippines',
  'Central African Republic': 'the Central African Republic',
};
function placeWords(w){
  if (!w) return 'this hemisphere';
  if (PLACE_WORDS[w]) return PLACE_WORDS[w];
  /* "sea, 207 km from Colombia" already reads as a phrase. */
  return w;
}

function agedWords(){
  if (!SHOW || !SHOW.t0) return 'Here is a recent sky.';
  /* t1, NOT t0. Joe, 2026-09-14: "it just moved to a new location, but the
     text on the bottom says it's from 7 minutes ago. I thought the latest data
     would be less than a minute old?" He was right and the page was reporting
     the wrong end of the window: t0 is the OLDEST flash in a six-minute
     capture, so a sky whose newest flash was 40 seconds old described itself
     as seven minutes old. Measured lag from last flash to file written: 42 s. */
  const mins = (Date.now() - SHOW.t1)/60000;
  const when = mins < 1.5  ? 'a moment ago'
             : mins < 90   ? Math.round(mins) + ' minutes ago'
             : mins < 2880 ? Math.round(mins/60) + ' hour' + (Math.round(mins/60) === 1 ? '' : 's') + ' ago'
             :               Math.round(mins/1440) + ' days ago';
  return 'Here is what the sky over ' + placeWords(SHOW.where)
       + ' was doing ' + when + '.';
}

function recordedWords(){
  if (!SHOW || !SHOW.t1) return 'recording time unknown';
  const d = new Date(SHOW.t1);
  const when = d.getUTCDate() + ' ' + MONTH3[d.getUTCMonth()] + ' ' + d.getUTCFullYear()
             + ', ' + String(d.getUTCHours()).padStart(2, '0')
             + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' UTC';
  const hrs = (Date.now() - SHOW.t1) / 3600000;
  const ago = hrs < 0     ? ''                                   // clock skew
            : hrs < 1.5   ? ' (' + Math.max(1, Math.round(hrs*60)) + ' min ago)'
            : hrs < 48    ? ' (' + Math.round(hrs) + ' h ago)'
            :               ' (' + Math.round(hrs/24) + ' days ago)';
  /* Name the END of the window and how long it ran, so "six minutes of sky to
     22:57" cannot be misread as "a snapshot from 22:51". */
  /* AND HOW MUCH SKY IS ACTUALLY HERE. Once the live feed takes over, the page
     keeps only the couple of minutes it can still draw - it announced "6 min of
     sky" while holding eighty seconds of it. */
  const h = held();
  const mins = h.span / 60;
  const span = !h.n     ? 'sky to '
             : mins < 1 ? Math.round(h.span) + ' s of sky to '
             :            Math.round(mins) + ' min of sky to ';
  return span + when + ago;
}

/* ---- THE LIVE FEED -------------------------------------------------------
   glm_feed.sh fetches whatever granules have published since it last looked and
   calls this. Flashes arrive already sorted within a batch; the merge keeps the
   whole list sorted, because everything downstream binary-searches it.

   PRUNING MATTERS MORE THAN IT LOOKS. A showing runs up to nine minutes at three
   to seven flashes a second, and nothing would ever leave the array - so the
   page would accumulate a megabyte of sky it can no longer display. Anything
   older than the window plus a margin goes.

   THIS BLOCK HAS BEEN DELETED BY ACCIDENT ONCE (2026-09-14): it sits between
   the comment that used to head the handoff entry point and the entry point
   itself, so a deletion keyed on that comment took the live feed with it. It is
   the feed, not an accessory to the thing that was removed. */
let lastAppend = 0, appended = 0;
window.__glmAppend = function(list){
  lastAppend = Date.now();
  if (!SHOW || !Array.isArray(list)) return 'no-show';
  if (list.length){
    /* Drop anything we already hold - a re-run of the fetcher overlaps. */
    const newest = SHOW.flashes.length ? SHOW.flashes[SHOW.flashes.length-1].t : 0;
    const fresh = list.filter(f => f && f.t > newest);
    if (fresh.length){
      SHOW.flashes = SHOW.flashes.concat(fresh);
      SHOW.flashes.sort((a,b) => a.t - b.t);
      SHOW.t1 = SHOW.flashes[SHOW.flashes.length-1].t;
      appended += fresh.length;
    }
  }
  const cut = (Date.now() - CONFIG.lagMs) - MAX_LIFE - 30000;
  if (SHOW.flashes.length && SHOW.flashes[0].t < cut){
    SHOW.flashes = SHOW.flashes.filter(f => f.t >= cut);
    SHOW.t0 = SHOW.flashes.length ? SHOW.flashes[0].t : SHOW.t0;
  }
  /* The first append is what puts the page on the wall clock. Before that it
     replays the cached capture, which is what the published copy does for ever
     and what the wall does until the feed reaches it. */
  if (!liveFeed){
    liveFeed = true;
    Wall.lane('Live now — this sky is about a minute old, and stays that way. '
            + 'Each new twenty seconds of it arrives as the satellite sends it.',
            {hold: 9000});
  }
  return 'ok:' + SHOW.flashes.length;
};

/* playFrom is when the sky ON SCREEN started playing. It is not bootAt any
   more, because the page may be on its second sky: bootAt still measures the
   page's life (holdMin, the hand-off), playFrom measures this storm's. */
let playFrom = bootAt;
/* NAMED liveFeed, NOT live, AND THE NAME IS THE WHOLE POINT.
   draw() declares `let live = 0` as its count of flashes currently in the air -
   it has since the page was written - and a module-level `live` is shadowed by
   it for the entire function. So `if (live)` inside draw() read the COUNTER,
   not this flag: any frame with a single flash on screen took the live branch,
   where lastAppend was still 0, so feedAge came out as the whole Unix epoch and
   the page handed off about two seconds after loading. That is the "it showed
   for a couple of seconds and skipped back" Joe hit twice. */
let liveFeed = false;      // true once the page is running on the wall clock

/* THE SHOW CLOCK, AND WHY IT IS THE WALL CLOCK NOW.
   Joe, 2026-09-14: "after the data are downloaded, we start watching 6 minute
   old data, and after 6 minutes we are watching 12 minute old data ... why
   start with old data that gets even older while we are watching it?"

   Exactly right, and it was the REPLAY that did it, not the satellite. Measured
   the same day: the newest granule on the bucket starts 42 s before now. So a
   page can sit about seventy-five seconds behind live and never starve, with
   glm_stream.py pushing each new twenty-second granule in as it appears.

   In LIVE mode the clock is simply now minus that lag, so the sky on screen is
   always about a minute old and stays that way. A capture that arrives without
   a stream behind it still replays, which is what the published copy does and
   what the wall falls back to if the feed stops. */
function showT(now){
  return liveFeed ? (Date.now() - CONFIG.lagMs) : SHOW.t0 + (now - playFrom);
}
function spanMs(){ return SHOW.t1 - SHOW.t0; }

/* THE ACTIVE WINDOW, by binary search rather than by sliding indices.
   Sliding lo/hi was right while the flash list was fixed for the life of the
   page. It is not any more: __glmAppend() adds to the end and prunes from the
   front, and an index into an array that has just had its head removed points
   at the wrong flash - silently, because the array is still sorted and the
   code still runs. Two searches per frame over a few thousand entries cost
   nothing and cannot be invalidated by an append. */
let lo=0, hi=0;
const MAX_LIFE = 4000;     // longest a flash can stay lit: d*exagg + pulseMs
function lowerBound(arr, t){
  let a=0, b=arr.length;
  while (a < b){ const m = (a+b) >> 1; if (arr[m].t < t) a = m+1; else b = m; }
  return a;
}
function advance(T){
  const f = SHOW.flashes;
  lo = lowerBound(f, T - MAX_LIFE);
  hi = lowerBound(f, T + 1);
}

/* size = energy, through a log: 4 fJ to 4,000 fJ is a thousandfold, and on a
   linear scale every ordinary flash would be a speck beside one monster. */
function magOf(e){ return Math.max(0, Math.min(1, (Math.log10(Math.max(e,1)) - 0.3)/2.3)); }

function draw(){
  const now = performance.now();
  const ms = now - bootAt;
  const T = showT(now);
  ctx.fillStyle = '#04070d'; ctx.fillRect(0,0,W,H);
  /* NO OVERTURE. The page opens on lightning: the cached sky is already on
     disk and the live feed takes over within the minute. */
  if (baseReady) ctx.drawImage(base, mapX, mapY,
      (SHOW.box[3]-SHOW.box[2])*cosLat*mapS, (SHOW.box[1]-SHOW.box[0])*mapS);

  drawCities();
  advance(T);
  let live=0, lit=0, energy=0; const durs=[], areas=[];
  for (let i=lo; i<hi; i++){
    const f = SHOW.flashes[i];
    const age = T - f.t;
    const life = f.d*CONFIG.exagg + CONFIG.pulseMs;
    if (age < 0 || age > life) continue;
    live++; energy += f.e; durs.push(f.d); areas.push(f.a);
    const x = toX(f.lon), y = toY(f.lat);
    if (x < -40 || y < -40 || x > W+40 || y > H+40) continue;
    const mag = magOf(f.e);
    const k = 1 - age/life;                       // 1 at the instant, 0 at the end

    /* THE RING IS THE FOOTPRINT, at true scale on the map: the area of cloud
       top that actually glowed, not the size of the bolt. */
    const rkm = Math.sqrt(f.a/Math.PI);
    const rpx = rkm/111.0*mapS;
    ctx.globalAlpha = 0.10 + 0.22*k;
    ctx.strokeStyle = 'rgba(150,205,255,1)';
    ctx.lineWidth = Math.max(1, 1.1*DPR);
    ctx.beginPath(); ctx.arc(x, y, Math.max(2, rpx), 0, 6.2832); ctx.stroke();

    /* EVERY PULSE AT ITS OWN MOMENT. This is the whole piece: the flash is
       not faded in and out, it is REPLAYED, group by group, at ten times its
       real duration. */
    for (let j=0; j<f.g.length; j++){
      const g = f.g[j];
      const gt = g[0]*CONFIG.exagg;
      const since = age - gt;
      if (since < 0) break;                        // groups are time-sorted
      const gk = Math.max(0, 1 - since/CONFIG.pulseMs);
      if (gk <= 0) continue;
      lit++;
      const gx = toX(f.lon + g[2]/100), gy = toY(f.lat + g[1]/100);
      /* SIZED FOR THE SOFA, not for the pixel grid. DESIGN_STANDARDS: arcmin
         = px x 0.2546 at 3 m, so the first attempt's 1.6-5.8 px dots spanned
         0.4 to 1.5 arcmin - below the threshold of seeing. 4 to 20 px puts
         the range at 1 to 5 arcmin: the big flashes read individually and the
         small ones read as texture, which is what they are. */
      const r = (4 + 16*mag)*DPR*(0.5 + 0.5*gk);
      ctx.globalAlpha = 0.30 + 0.60*gk;
      ctx.fillStyle = gk > 0.7 ? 'rgba(255,255,255,1)'
                    : gk > 0.35 ? 'rgba(186,226,255,1)' : 'rgba(120,176,240,1)';
      ctx.beginPath(); ctx.arc(gx, gy, r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  drawKey();
  panel(live, lit, durs, areas);

  /* WHEN TO STOP.
     A REPLAY ends when it runs off the end of its capture. A LIVE page never
     does - "past the last flash" just means the sky is quiet, or that a granule
     is a few seconds late, and handing off for either would end the show at the
     first lull. So live mode ends on the dwell clock, or when the feed has been
     silent long enough to call it dead rather than quiet. */
  if (liveFeed){
    const feedAge = Date.now() - lastAppend;
    if (!PINNED && !handedOff && CONFIG.nextPage !== '' &&
        ((now-bootAt)/1000 > CONFIG.holdMin*60 || feedAge > CONFIG.streamGapMs)) handOff();
  } else if (T > SHOW.t1 + 4000) {
    /* A PINNED PAGE LOOPS instead of sitting on a spent sky. Without this the
       six minutes ran out and left an empty basemap for as long as anyone
       cared to watch (2026-09-13). Unpinned, the wall moves on as usual. */
    if (PINNED) { playFrom = performance.now(); lo = hi = 0; }
    else if (!handedOff && CONFIG.nextPage !== '') handOff();
  } else if (!PINNED && !handedOff && CONFIG.nextPage !== '' &&
             (now-bootAt)/1000 > CONFIG.holdMin*60) handOff();
  requestAnimationFrame(draw);
}

/* The four biggest towns in frame, spread out by the builder so they read as
   four bearings rather than one city and three of its boroughs. A Blue Marble
   basemap carries no labels of its own. */
/* WHAT IS ALREADY OCCUPYING THE SCREEN.
   The panel, the Lane and the signature are DOM, so they can be measured
   rather than guessed; the key is drawn by drawKey() at a known place, so its
   rectangle is repeated here. Everything is in canvas pixels. */
function furniture(){
  const r = [];
  for (const sel of ['.instr', '.lane', '.signature']){
    const el = document.querySelector(sel);
    if (!el) continue;
    /* NOT offsetParent. Every one of these is position:fixed, and a fixed
       element's offsetParent is null whether it is visible or not - so the
       first version of this check skipped the panel entirely and cities went
       on being drawn underneath it, which is the bug it was written to fix.
       Measure the rectangle and ask the style instead. */
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0) continue;
    const b = el.getBoundingClientRect();
    if (b.width < 2 || b.height < 2) continue;
    r.push([b.left*DPR, b.top*DPR, b.right*DPR, b.bottom*DPR]);
  }
  const u = W/3840, kx = Math.round(76*u), ky = Math.round(120*u);
  r.push([kx-Math.round(26*u), ky-Math.round(58*u),
          kx-Math.round(26*u)+Math.round(980*u), ky-Math.round(58*u)+Math.round(300*u)]);
  return r;
}
function hits(box, rects){
  for (const q of rects)
    if (box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]) return true;
  return false;
}

/* FOUR NAMES THAT CAN ACTUALLY BE READ (Joe, 2026-09-14: "only three city
   names are visible. Maybe the fourth city name is under the info box. We
   should fix the rule so that at least 4 cities are visible, considering the
   info box.").

   glm_show.py now ships ten candidates in population order; this walks them and
   keeps the first four whose LABEL clears the frame edges, the page's own
   furniture, and the labels already placed. Only the page can do this: the
   builder has no idea where the panel is, and the panel moves with the type
   scale and the screen. */
const CITY_CAP = 4;
function drawCities(){
  const t = SHOW.towns || [];
  if (!t.length) return;
  const u = W/3840, tf = Math.round(30*1.167*u);
  ctx.font = `${tf}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const busy = furniture(), placed = [];
  for (const c of t){
    if (placed.length >= CITY_CAP) break;
    const x = toX(c.lon), y = toY(c.lat);
    if (x < 0 || y < 0 || x > W || y > H) continue;
    /* the dot, the gap and the name, with a little air around it */
    const wpx = ctx.measureText(c.n).width, pad = 10*u;
    const box = [x - 6*DPR - pad, y - tf*0.75 - pad,
                 x + 12*u + wpx + pad, y + tf*0.75 + pad];
    if (box[2] > W || box[1] < 0 || box[3] > H) continue;
    if (hits(box, busy) || hits(box, placed)) continue;
    placed.push(box);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(255,240,215,0.95)';
    ctx.beginPath(); ctx.arc(x, y, Math.max(2, 2.6*DPR), 0, 6.2832); ctx.fill();
    ctx.lineWidth = Math.max(2, 3.4*DPR);
    ctx.strokeStyle = 'rgba(6,10,18,0.85)';
    ctx.strokeText(c.n, x + 12*u, y);          // halo first, so the name reads
    ctx.fillStyle = 'rgba(255,243,222,0.92)';
    ctx.fillText(c.n, x + 12*u, y);
  }
  ctx.globalAlpha = 1;
}

/* ---- the key ------------------------------------------------------------
   Bottom left, on its own layer so it cannot smear. Three dots for the energy
   scale, one ring for the footprint, one ramp for age. */
function drawKey(){
  if(!hudCv) hudCv=document.createElement('canvas');
  if(hudCv.width!==W||hudCv.height!==H){ hudCv.width=W; hudCv.height=H; }
  const g = hudCv.getContext('2d');
  g.clearRect(0,0,W,H);
  const u = W/3840;
  const tf = Math.round(30*1.167*u), tl = Math.round(37*1.167*u);
  /* TOP LEFT. The first attempt put this bottom-left, where it sat underneath
     BOTH the Lane's sentence and the signature - the two things that already
     own the bottom of every page on this wall (2026-09-13). */
  let x = Math.round(76*u), y = Math.round(120*u);

  g.fillStyle='rgba(10,16,26,0.62)';
  g.fillRect(x-Math.round(26*u), y-Math.round(58*u), Math.round(980*u), Math.round(300*u));

  g.font = `${tl}px ui-monospace, Menlo, monospace`;
  g.fillStyle='rgba(206,220,240,0.80)'; g.textBaseline='alphabetic';
  g.fillText('EACH DOT IS ONE PULSE OF ONE FLASH', x, y - Math.round(18*u));

  g.font = `${tf}px ui-monospace, Menlo, monospace`;
  // energy: three dots
  const es = [10, 100, 1000];
  let dx = x + Math.round(10*u);
  const row1 = y + Math.round(58*u);
  for (const e of es){
    const r = (4 + 16*magOf(e))*DPR;
    g.globalAlpha=0.95; g.fillStyle='rgba(220,238,255,1)';
    g.beginPath(); g.arc(dx, row1, r, 0, 6.2832); g.fill();
    g.globalAlpha=0.8; g.fillStyle='rgba(180,200,226,0.9)';
    g.fillText(e+'', dx - Math.round(14*u), row1 + Math.round(46*u));
    dx += Math.round(116*u);
  }
  g.globalAlpha=0.8; g.fillStyle='rgba(180,200,226,0.9)';
  g.fillText('SIZE = ENERGY, femtojoules at the satellite', x + Math.round(370*u), row1 + Math.round(8*u));

  // age ramp
  const row2 = y + Math.round(148*u);
  const cols = ['rgba(255,255,255,1)','rgba(186,226,255,1)','rgba(120,176,240,1)'];
  dx = x + Math.round(10*u);
  for (const c of cols){
    g.globalAlpha=0.95; g.fillStyle=c;
    g.beginPath(); g.arc(dx, row2, 5*DPR, 0, 6.2832); g.fill();
    dx += Math.round(58*u);
  }
  g.globalAlpha=0.8; g.fillStyle='rgba(180,200,226,0.9)';
  g.fillText('COLOUR = AGE, the instant it fired, then cooling',
             x + Math.round(370*u), row2 + Math.round(8*u));

  // footprint ring
  const row3 = y + Math.round(228*u);
  g.globalAlpha=0.55; g.strokeStyle='rgba(150,205,255,1)'; g.lineWidth=Math.max(1,1.1*DPR);
  g.beginPath(); g.arc(x + Math.round(66*u), row3, Math.round(30*u), 0, 6.2832); g.stroke();
  g.globalAlpha=0.8; g.fillStyle='rgba(180,200,226,0.9)';
  g.fillText('RING = FOOTPRINT, the cloud top it lit, to scale',
             x + Math.round(370*u), row3 + Math.round(8*u));
  g.globalAlpha=1;
  ctx.drawImage(hudCv,0,0);
}

let lastRows='';
function med(a){ if(!a.length) return 0; a.sort((x,y)=>x-y); return a[a.length>>1]; }

/* WHAT THE SKY ON SCREEN IS DOING - not what the capture was doing.
   Joe, 2026-09-17: "I don't think the data are actually the latest data, even
   though it says they are." The DATA were latest (granules fetched by hand came
   back 34 s old); the FIGURES beside them were not. Three of the panel's rows
   and two of its beats still read from SHOW.stats, which is frozen at whatever
   the capture found - so a sky running at 4.9 flashes a second announced 9.06,
   and quoted a biggest-footprint from ninety minutes earlier.
   This is the same bug as 2026-09-13 ("flash lasts and lights up seem to not be
   updating"), which fixed the two medians and left the rate and the maxima. So
   the rule that fix established now covers every figure: they all describe the
   flashes the page is HOLDING. Before the live feed arrives the page holds the
   capture, so the numbers are the capture's - the same answer, without a second
   source of truth to go stale. */
let heldKey = '', heldVal = null;
function held(){
  const f = SHOW.flashes || [];
  const key = f.length + ':' + (f.length ? f[f.length-1].t : 0);
  if (key === heldKey && heldVal) return heldVal;
  heldKey = key;
  if (!f.length) return (heldVal = { n:0, span:0, rate:0, medDur:0, maxDur:0,
                                     medArea:0, maxArea:0, medGroups:0, maxGroups:0,
                                     medE:0, maxE:0 });
  const span = Math.max(1, (f[f.length-1].t - f[0].t) / 1000);
  const durs = [], areas = [], grps = [], energies = [];
  let maxDur = 0, maxArea = 0, maxGroups = 0, maxE = 0;
  for (const x of f){
    durs.push(x.d); areas.push(x.a); grps.push(x.g.length); energies.push(x.e);
    if (x.d > maxDur) maxDur = x.d;
    if (x.a > maxArea) maxArea = x.a;
    if (x.g.length > maxGroups) maxGroups = x.g.length;
    if (x.e > maxE) maxE = x.e;
  }
  /* ENERGY WAS LEFT OUT OF THIS OBJECT AND THE PAGE SAID SO. v3.4 moved every
     figure off the capture's frozen SHOW.stats and on to the flashes actually
     held - but the energy beat still asked for s.medE, which this returned for
     nothing, so the wall read "a median of undefined femtojoules" for eight
     days. The capture's own stats block carries medE, which is why it read
     correctly before. Rounded to a tenth, as the capture rounded it. */
  return (heldVal = { n: f.length, span,
    rate: f.length / span, medDur: med(durs), maxDur,
    medArea: med(areas), maxArea, medGroups: med(grps), maxGroups,
    medE: Math.round(med(energies) * 10) / 10, maxE });
}
function panel(live, lit, durs, areas){
  const s = held();
  /* EVERY ROW MOVES, or the panel looks broken. Joe, 2026-09-13: "the field
     for flash lasts and lights up seem to not be updating." They were the
     capture's whole-show medians sitting beside two live counters, which is a
     worse sin than being wrong - half a panel frozen reads as a dead page.
     They are now the median of the flashes actually in the air. */
  const rows = [
    {k:'in the air now',  v: live + ' flashes'},
    {k:'pulses lit',      v: lit + ''},
    {k:'flash rate',      v: s.rate.toFixed(2) + ' / s'},
    {k:'pulses per flash',v: (live ? Math.round(lit/live) : 0) + ' now, ' + s.maxGroups + ' most'},
    {k:'flash lasts',     v: (durs.length ? med(durs) : 0) + ' ms, up to ' + s.maxDur},
    {k:'lights up',       v: (areas.length ? Math.round(med(areas)) : 0) + ' km², up to '
                             + Math.round(s.maxArea).toLocaleString()},
    {k:'light came',      v: (SHOW.slantKm ? SHOW.slantKm.toLocaleString() + ' km, '
                             + SHOW.lightMs + ' ms' : '—')},
    {k:'at',              v: '777.4 nm, oxygen'},
  ];
  Wall.instrument({place:'tr', cols:1, rows: rows, cap: SHOW.where});
  if (document.body.classList.contains('showinfo')) updateInfo(live, lit);
}

function handOff(){ handedOff=true; Wall.lane('');
  setTimeout(()=>{ location.href = Wall.nextPage(CONFIG.nextPage); }, 1400); }

const infoEl=document.getElementById('info');
function updateInfo(inAir, lit){
  infoEl.textContent =
    SHOW.where + '  ' + SHOW.flashes.length + ' flashes, '
    + SHOW.flashes.reduce((n,f)=>n+f.g.length,0) + ' groups\n'
    + 'box ' + SHOW.box.map(b=>b.toFixed(1)).join(', ') + '\n'
    + 'active ' + live + '  pulses lit ' + lit + '  window ' + lo + '..' + hi + '\n'
    + 'keys: i info · n new sky · arrows change page';
}
/* THE REMOTE. This page bound only 'i' and then told the viewer "arrows change
   page" in its own diagnostics - so the arrows did nothing here while working
   on every other stop in the ring (Joe, 2026-09-14: "it did not respond well to
   the remote"). nav.js does NOT bind keys; it only builds on-screen arrows for
   a pointer, so each page wires its own, and this one never did.
   rotateTo() goes through Wall.step(), so the arrows skip pieces that are
   switched off, exactly as they do elsewhere. */
addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'i': case 'I':
      document.body.classList.toggle('showinfo');
      if (Wall.hideLane) Wall.hideLane();
      break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    /* A pinned page cannot hand on, so 'n' reloads instead: that re-primes
       from the cache and restarts the live feed, which is the nearest thing
       this piece has to "another one please". */
    case 'n': case 'N': location.reload(); break;
  }
});

/* ---- go ----------------------------------------------------------------- */
if (!SHOW){
  Wall.lane('No storm is built. Run glm_show.py.');
} else {
  resize(); computeMap();
  /* ASK THE CAPTURE WHICH MAP IS ITS OWN. This said 'glm_basemap.jpg', a name
     nothing has written since glm_show.py moved to <stem>_basemap.jpg - so the
     page drew a twelve-day-old map of somewhere else under every storm, while
     the town labels, which come from the capture's own towns[], moved
     correctly. Joe spotted it from the sofa: "it's showing a lightning storm
     in the Caribbean, but the base map is I think still the midwest US."

     THE CACHE-BUSTER IS NOT OPTIONAL. Every capture writes the SAME filename,
     so without it Chromium keeps the first image it ever loaded and the bug
     comes straight back in a form that only shows after a reload.

     AND THERE IS NO FALLBACK ON PURPOSE. A missing basemap is a black field
     with the storm still drawn on it; the WRONG basemap is a page stating that
     a Caribbean storm is over Illinois. If the capture does not name its map,
     we draw no map. */
  if (SHOW.basemap) {
    base = new Image();
    base.onload = () => { baseReady = true; };
    base.src = SHOW.basemap + '?t=' + (SHOW.t0 || Date.now());
  }
  window.WALL_SECONDS_PER_RUN = Math.round(spanMs()/1000 + 30);
  document.getElementById('pname').textContent = 'Lantern';

  /* WHAT THE FIRST TWENTY SECONDS ARE FOR.
     They are not a wait. The fresh capture takes 17-21 s, and rather than
     stand waiting for it, the page plays the CACHED sky and spends
     those seconds saying the two things a viewer needs: how old this is, and
     what a dot means. The age line is first because it is the honest one -
     this is the recent past, and the page should say so before it says
     anything clever. */
  /* ONLY THE WALL IS FETCHING ANYTHING. build_github.standalone() blanks
     nextPage for the published copy, and there is no Pi behind that one - so
     promising a viewer on the web that something newer is on its way would be
     a straight lie. The published page says what it is instead: one captured
     sky, dated. */
  const LIVE = CONFIG.nextPage !== '';
  Wall.lane(agedWords() + ' Two satellites watch this hemisphere, '
          + 'twenty seconds of sky at a time'
          + (LIVE ? ' — and the Pi is fetching the newest right now.' : '.'));
  Wall.after(9000, () => Wall.lane(
      `${SHOW.where}: ${SHOW.flashes.length.toLocaleString()} flashes in six minutes, `
    + `${held().rate.toFixed(1)} every second.`, {hold: 8000}));

  /* The rest of the science waits for the sky it describes. sayTheScience()
     runs on a timer, so a showing is never left mute. */
  /* THE FALLBACK IS LATE ON PURPOSE. A handoff normally lands 30-80 s in, and
     the science beats quote the stats of the sky they are spoken over - so
     firing them early would describe a storm the page is about to fly away
     from, in numbers that then stop matching the screen. At 100 s this only
     fires when no fresh sky is coming at all, which is exactly when a
     cached-only showing would otherwise be left mute. */
  Wall.after(100000, () => { if (!scienceSaid) sayTheScience(); });

  Wall.signature('GOES Geostationary Lightning Mapper (NOAA) · basemap NASA GIBS Blue Marble'
                 + ' · ' + recordedWords());
  requestAnimationFrame(draw);
}

/* THE THREE SCIENCE BEATS, spoken over the sky they describe rather than on a
   fixed schedule from boot. They used to be pinned to the overture's length,
   which assumed a globe had to finish before the storm began. Guarded, because
   the trigger is now a plain timer and should fire once. */
let scienceSaid = false;
function sayTheScience(){
  if (scienceSaid || !SHOW) return;
  scienceSaid = true;
  const s = held();
  Wall.after(600, () => Wall.lane(
      `A flash is not an instant: it stutters through ${s.medGroups} pulses in about `
    + `${(s.medDur/1000).toFixed(1)} s, and every pulse here is drawn at its own recorded `
    + `moment — slowed ten times so you can watch one happen.`));
  Wall.after(26000, () => Wall.lane(
      `The ring is not the bolt. Cloud scatters the light sideways, so a channel a few kilometres `
    + `long makes the whole thunderhead glow — a paper lantern lit from inside. Median ${s.medArea} km²; `
    + `the biggest here lit ${Math.round(s.maxArea).toLocaleString()}.`));
  Wall.after(50000, () => Wall.lane(
      `The satellite caught a median of ${s.medE} femtojoules from each one. The flash that made it `
    + `moved some 15 coulombs across a hundred million volts — of order a billion joules, through a `
    + `channel at 30,000 K, five times the surface of the Sun.`));
  /* The signature carries the age of whatever sky is now on screen, so it is
     re-stated here as well as at boot: after a handoff the old one is a lie. */
  Wall.signature('GOES Geostationary Lightning Mapper (NOAA) · basemap NASA GIBS Blue Marble'
                 + ' · ' + recordedWords());
}
</script>
</body>
