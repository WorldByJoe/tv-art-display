<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun and Wind</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060b; overflow:hidden; }
  canvas { position:fixed; inset:0; display:block; width:100vw; height:100vh; }
  * { cursor:none; }
  /* Everything here is sized for a television across a room. Text that is
     comfortable on a laptop is unreadable from the couch, and on this wall
     the words carry as much as the picture. */
  #hud { position:fixed; left:3vw; top:5vh; z-index:10; pointer-events:none;
    font:300 clamp(14px,1.35vw,28px)/1.5 ui-sans-serif,system-ui,sans-serif;
    color:rgba(212,226,246,.85); letter-spacing:.06em; }
  #hud .big { font:200 clamp(28px,3.4vw,76px)/1.1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em; text-transform:uppercase; }
  #hud .clock { margin-top:.45em; font:300 clamp(19px,2.0vw,46px)/1.2 ui-monospace,Menlo,monospace;
    letter-spacing:.10em; color:rgba(255,225,175,.92); }
  #hud .sub { margin-top:.45em; color:rgba(180,200,225,.62); }
  #warn { margin-top:.7em; color:rgba(255,190,120,.92); }
  /* Yesterday and today, down the left margin under the place name. The map
     is centred and the margins were empty, so this costs no map. */
  #days { position:fixed; left:3vw; top:32vh; z-index:10; pointer-events:none;
    width:min(26vw,470px);
    background:linear-gradient(160deg, rgba(10,14,22,.72), rgba(10,14,22,.52));
    border:1px solid rgba(150,180,220,.16); border-radius:.5em;
    padding:1.0em 1.1em; backdrop-filter:blur(6px); }
  #days .row + .row { margin-top:.95em; padding-top:.95em;
    border-top:1px solid rgba(255,255,255,.10); }
  #days .day { font:400 clamp(11px,1.00vw,21px)/1.3 ui-monospace,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase; color:rgba(170,195,225,.66); }
  #days .cond { margin-top:.30em;
    font:300 clamp(17px,1.70vw,38px)/1.25 ui-sans-serif,system-ui,sans-serif;
    color:rgba(232,242,255,.92); }
  #days .temp { margin-top:.30em;
    font:300 clamp(20px,2.05vw,46px)/1.15 ui-sans-serif,system-ui,sans-serif;
    color:rgba(255,225,175,.95); }
  #days .temp small { font-size:.62em; color:rgba(180,200,225,.70); letter-spacing:.04em; }
  #days .misc { margin-top:.40em;
    font:400 clamp(11px,.98vw,20px)/1.6 ui-monospace,Menlo,monospace;
    color:rgba(170,192,220,.62); }
  #caption { position:fixed; left:0; right:0; bottom:2.4vh; z-index:8;
    text-align:center; pointer-events:none; padding:0 4vw; }
  #caption .what { font:300 clamp(13px,1.22vw,26px)/1.45 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.055em; color:rgba(206,220,240,.66); }
  #caption .params { margin-top:.45em; font:400 clamp(11px,0.95vw,19px)/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.02em; color:rgba(150,172,205,.46); }
  #info { position:fixed; left:2vw; bottom:12vh; z-index:10; display:none;
    font:500 clamp(12px,1.05vw,20px)/1.5 ui-monospace,Menlo,monospace;
    color:#dfe6ee; background:rgba(0,0,0,.6); padding:.7em 1em; border-radius:.4em;
    border:1px solid rgba(255,255,255,.15); white-space:pre; }
  body.showinfo #info { display:block; }

  /* ---- scrim behind the caption ----------------------------------------
     The caption used to sit directly on the artwork. On a black field that is
     fine; over a lit basemap, a bright mosaic or a pale plume it becomes
     unreadable exactly when there is something worth reading it about. A soft
     upward fade keeps the text legible without drawing a visible box. */
  #caption {
    background: linear-gradient(to top,
                rgba(3,5,10,0.88) 0%, rgba(3,5,10,0.70) 55%, rgba(3,5,10,0) 100%);
    padding-top: 1.6em; padding-bottom: 0.7em;
  }
</style>

/* ---- rotation navigation (remote D-pad) --------------------------------
   Right steps to the next piece in the wall's rotation, left to the previous
   one. The ring is listed explicitly rather than derived from nextPage,
   because nextPage only points forwards - there is no way to walk it
   backwards. Keep this list in step with the nextPage chain. */
const ROTATION = ['index.html'];   // standalone: nowhere else to go
function rotateTo(step){
  const here = (location.pathname.split('/').pop() || 'kiosk.html');
  let i = ROTATION.indexOf(here);
  if (i < 0) i = 0;
  location.href = ROTATION[(i + step + ROTATION.length) % ROTATION.length];
}

/* =======================================================================
   Sun and wind: a day of weather, played forward.

   TWO FIELDS AT ONCE, which is the point.
     - The coloured ground layer is SHORTWAVE RADIATION reaching the surface
       (W/m^2): how hard the sun is hitting. It sweeps west across the map at
       dawn, is punched full of holes by cloud, and dies at sunset.
     - The streaks are surface wind, drawn by carrying massless tracers on the
       field itself.

   Watching them together is the interesting part. Insolation is what drives
   the boundary layer: ground heats, air rises, and the wind field reorganises
   a few hours behind the sun. A still, cold morning becomes a gusty
   afternoon, and you can watch the handover happen.

   NOT a snapshot: the whole 24-hour forecast is animated, with the clock in
   the corner showing which hour is on screen.

   DATA: Open-Meteo's public forecast API (no key, permissive CORS), which
   serves NOAA HRRR-family output for North America.

   OFFLINE BEHAVIOUR IS DELIBERATE AND VISIBLE. Last good field is cached and
   reused with its age shown; with no cache a synthetic field is generated and
   LABELLED as synthetic. The wall keeps running, and never passes invented
   data off as real.
   ======================================================================= */

function ramp(pal,t){
  t=t<0?0:t>1?1:t;
  const x=t*(pal.length-1), i=Math.min(pal.length-2,Math.floor(x)), f=x-i;
  const a=pal[i], b=pal[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];

function resize(){

  canvas.width=W; canvas.height=H;
  ctx.fillStyle='#04060b'; ctx.fillRect(0,0,W,H);
  seedParticles(); computeMap();
  if(data){ buildBasemap(); lastBaseHour=-1; }
}

let mapS=1,mapX=0,mapY=0,cosLat=1;
function computeMap(){
  if(!loc) return;
  cosLat=Math.cos((loc.latMin+loc.latMax)/2*Math.PI/180);
  const dLon=(loc.lonMax-loc.lonMin)*cosLat, dLat=(loc.latMax-loc.latMin);
  mapS=Math.min(W*0.94/dLon, H*0.80/dLat);
  mapX=(W-dLon*mapS)/2; mapY=(H-dLat*mapS)/2;
}
const toX=(lon)=> mapX+(lon-loc.lonMin)*cosLat*mapS;
const toY=(lat)=> mapY+(loc.latMax-lat)*mapS;
const toLon=(x)=> loc.lonMin+(x-mapX)/(cosLat*mapS);
const toLat=(y)=> loc.latMax-(y-mapY)/mapS;

function seedParticles(){
  px=new Float32Array(CONFIG.particles); py=new Float32Array(CONFIG.particles);
  pAge=new Int32Array(CONFIG.particles);
  for(let i=0;i<CONFIG.particles;i++) respawn(i,true);
}
function respawn(i,init){
  px[i]=Math.random()*W; py[i]=Math.random()*H;
  pAge[i]=init?(Math.random()*CONFIG.respawnFrames)|0:0;
}

/* ---------------- data ---------------- */
function gridPoints(){
  const lats=[],lons=[];
  for(let a=0;a<CONFIG.gridLat;a++) for(let o=0;o<CONFIG.gridLon;o++){
    lats.push((loc.latMin+(loc.latMax-loc.latMin)*a/(CONFIG.gridLat-1)).toFixed(3));
    lons.push((loc.lonMin+(loc.lonMax-loc.lonMin)*o/(CONFIG.gridLon-1)).toFixed(3));
  }
  return {lats,lons};
}

function buildSynthetic(){
  const nP=CONFIG.gridLat*CONFIG.gridLon, nH=CONFIG.pastHours+CONFIG.aheadHours+1;
  const u=[],v=[],sun=[],temp=[],times=[];
  const cells=[]; for(let c=0;c<3;c++) cells.push({a:Math.random(),o:Math.random(),s:(Math.random()<0.5?-1:1)*(3+Math.random()*6)});
  const now=new Date(); now.setMinutes(0,0,0);
  for(let h=0;h<nH;h++){
    const uh=new Float32Array(nP), vh=new Float32Array(nP), sh=new Float32Array(nP), th=new Float32Array(nP);
    const t=new Date(now.getTime()+h*3600000); times.push(t.toISOString());
    const solar=Math.max(0,Math.sin((t.getHours()+t.getMinutes()/60-6)/12*Math.PI));
    for(let a=0;a<CONFIG.gridLat;a++) for(let o=0;o<CONFIG.gridLon;o++){
      const i=a*CONFIG.gridLon+o, fa=a/(CONFIG.gridLat-1), fo=o/(CONFIG.gridLon-1);
      let uu=2.0+2.5*solar, vv=0.5;
      for(const c of cells){ const dx=fo-c.o, dy=fa-c.a, d2=dx*dx+dy*dy+0.08;
        uu+=-c.s*dy/d2*0.05; vv+=c.s*dx/d2*0.05; }
      uh[i]=uu; vh[i]=vv;
      sh[i]=solar*900*(0.55+0.45*Math.sin(fo*7+h*0.4));
      th[i]=6+14*solar;
    }
    u.push(uh); v.push(vh); sun.push(sh); temp.push(th);
  }
  const elev=new Float32Array(nP);
  for(let i=0;i<nP;i++) elev[i]=800+600*Math.sin(i*0.7);
  return {u,v,sun,temp,times,elev,nowOffset:CONFIG.pastHours,hours:nH,
          source:'synthetic',when:Date.now()};
}

/* WMO weather codes, in the words a person would use. */
const WMO={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',
  85:'Snow showers',86:'Snow showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};

/* Yesterday and today for the CITY POINT only - one small extra request.
   Asking for daily fields across the whole wind grid would multiply the
   response by the number of grid points for two rows of text. */
async function fetchDaily(){
  const url='https://api.open-meteo.com/v1/forecast'
    + '?latitude='+loc.lat+'&longitude='+loc.lon
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,'
    + 'wind_speed_10m_max,sunshine_duration,daylight_duration'
    + '&wind_speed_unit=ms&past_days=1&forecast_days=1&timezone='+encodeURIComponent(loc.tz);
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=(await r.json()).daily;
    if(!d||!d.time||d.time.length<2) return null;
    return d;
  }catch(e){ clearTimeout(timer); return null; }
}

/* The headline condition.

   NOT straight from the WMO daily code. Open-Meteo returned code 3
   ("overcast") for a Fort Collins day with 11.1 hours of sunshine - their
   daily aggregate takes the most significant condition of the day, which
   skews cloudy. Printing "Overcast" beside "11.1 h sun" just reads as a bug.

   So: precipitation, fog and storms come from the code, because those are
   events the sunshine figure cannot describe. Everything else is named from
   the share of the daylight that actually saw sun - a number the viewer can
   check against the map in front of them. */
function conditionFor(code, sunSec, dayabSec){
  if(code>=95) return 'Thunderstorms';
  if(code>=71 && code<=77) return WMO[code]||'Snow';
  if(code>=85 && code<=86) return 'Snow showers';
  if(code>=51 && code<=82) return WMO[code]||'Rain';
  if(code===45||code===48) return WMO[code];
  const f = dayabSec>0 ? sunSec/dayabSec : 0;
  if(f>=0.75) return 'Sunny';
  if(f>=0.45) return 'Partly cloudy';
  if(f>=0.15) return 'Mostly cloudy';
  return 'Overcast';
}

function renderDaily(d){
  const box=document.getElementById('days');
  if(!box) return;
  if(!d){ box.style.display='none'; return; }
  box.style.display='';
  const F=(c)=>Math.round(c*9/5+32);
  const rows=[];
  for(let i=0;i<Math.min(2,d.time.length);i++){
    const label=(i===d.time.length-1)?'TODAY':'YESTERDAY';
    const cond=conditionFor(d.weather_code[i], d.sunshine_duration[i]||0,
                            (d.daylight_duration&&d.daylight_duration[i])||0);
    const hi=d.temperature_2m_max[i], lo=d.temperature_2m_min[i];
    const pr=d.precipitation_sum[i], wd=d.wind_speed_10m_max[i];
    const sun=(d.sunshine_duration[i]||0)/3600;
    rows.push(
      '<div class="row">'
      + '<div class="day">'+label+'</div>'
      + '<div class="cond">'+cond+'</div>'
      + '<div class="temp">'+F(hi)+'° <small>/ '+F(lo)+'°F</small></div>'
      + '<div class="misc">'+sun.toFixed(1)+' h sun'
        + '  ·  wind to '+(wd*2.23694).toFixed(0)+' mph'
        + (pr>0.05?('  ·  '+(pr/25.4).toFixed(2)+' in'):'  ·  dry')
      + '</div></div>');
  }
  box.innerHTML=rows.join('');
}

async function fetchData(){
  const {lats,lons}=gridPoints();
  const url='https://api.open-meteo.com/v1/forecast'
          + '?latitude='+lats.join(',')+'&longitude='+lons.join(',')
          + '&hourly=wind_speed_10m,wind_direction_10m,shortwave_radiation,temperature_2m'
          + '&wind_speed_unit=ms&past_days=2&forecast_days=2&timezone='+encodeURIComponent(loc.tz);
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const arr=Array.isArray(j)?j:[j];
    const nP=CONFIG.gridLat*CONFIG.gridLon;
    if(arr.length!==nP) throw new Error('expected '+nP+' points, got '+arr.length);

    /* Locate the present in the returned series and take a window either
       side of it. Times come back in the location's own timezone, so compare
       against a local-format string rather than a UTC one. */
    const t0=arr[0].hourly.time;
    const nowLocal=new Date(new Date().toLocaleString('en-US',{timeZone:loc.tz}));
    const stamp=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'
                    +String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0');
    const nowStr=stamp(nowLocal);
    let nowIdx=t0.findIndex(t=>t.slice(0,13)>=nowStr);
    if(nowIdx<0) nowIdx=Math.floor(t0.length/2);
    const total=CONFIG.pastHours+CONFIG.aheadHours+1;
    let start=Math.max(0, Math.min(nowIdx-CONFIG.pastHours, t0.length-total));
    const nowOffset=nowIdx-start;          // which frame of the window is "now"

    const u=[],v=[],sun=[],temp=[],times=[];
    const elev=new Float32Array(nP);
    for(let i=0;i<nP;i++) elev[i]=arr[i].elevation||0;   // free terrain, same response
    for(let h=0;h<total;h++){
      const idx=start+h;
      const uh=new Float32Array(nP), vh=new Float32Array(nP), sh=new Float32Array(nP), th=new Float32Array(nP);
      for(let i=0;i<nP;i++){
        const H2=arr[i].hourly;
        const sp=H2.wind_speed_10m[idx], dir=H2.wind_direction_10m[idx];
        /* Meteorological convention: direction is where the wind comes FROM.
           Adding 180 turns it into a vector pointing where it is GOING. */
        const rad=(dir+180)*Math.PI/180;
        uh[i]=sp*Math.sin(rad); vh[i]=sp*Math.cos(rad);
        sh[i]=H2.shortwave_radiation[idx]; th[i]=H2.temperature_2m[idx];
      }
      u.push(uh); v.push(vh); sun.push(sh); temp.push(th); times.push(t0[idx]);
    }
    const d={u,v,sun,temp,times,elev,nowOffset,hours:total,source:'live',when:Date.now()};
    try{ localStorage.setItem('wxCache_'+loc.city, JSON.stringify({
      u:u.map(a=>Array.from(a)), v:v.map(a=>Array.from(a)),
      sun:sun.map(a=>Array.from(a)), temp:temp.map(a=>Array.from(a)),
      times, elev:Array.from(elev), nowOffset, hours:total, when:d.when })); }catch(e){}
    return d;
  }catch(e){
    clearTimeout(timer);
    console.warn('[weather] fetch failed:',e.message);
    try{
      const c=JSON.parse(localStorage.getItem('wxCache_'+loc.city)||'null');
      if(c) return {u:c.u.map(Float32Array.from), v:c.v.map(Float32Array.from),
                    sun:c.sun.map(Float32Array.from), temp:c.temp.map(Float32Array.from),
                    times:c.times, elev:Float32Array.from(c.elev||[]),
                    nowOffset:c.nowOffset||0, hours:c.hours||c.times.length,
                    source:'cache', when:c.when};
    }catch(e2){}
    return buildSynthetic();
  }
}

/* Bilinear sample of one hour's grid, with linear blending between hours so
   the day flows rather than stepping. */
function sampleAt(arrA,arrB,mix,x,y,out,k){
  const lat=toLat(y), lon=toLon(x);
  const fa=(lat-loc.latMin)/(loc.latMax-loc.latMin)*(CONFIG.gridLat-1);
  const fo=(lon-loc.lonMin)/(loc.lonMax-loc.lonMin)*(CONFIG.gridLon-1);
  if(fa<0||fo<0||fa>CONFIG.gridLat-1||fo>CONFIG.gridLon-1) return false;
  const a0=Math.min(CONFIG.gridLat-2,Math.floor(fa)), o0=Math.min(CONFIG.gridLon-2,Math.floor(fo));
  const da=fa-a0, dob=fo-o0;
  const i00=a0*CONFIG.gridLon+o0, i01=i00+1, i10=i00+CONFIG.gridLon, i11=i10+1;
  const w00=(1-da)*(1-dob), w01=(1-da)*dob, w10=da*(1-dob), w11=da*dob;
  const A=arrA[i00]*w00+arrA[i01]*w01+arrA[i10]*w10+arrA[i11]*w11;
  const B=arrB[i00]*w00+arrB[i01]*w01+arrB[i10]*w10+arrB[i11]*w11;
  out[k]=A+(B-A)*mix;
  return true;
}

/* The insolation layer is drawn at GRID resolution into a tiny canvas and
   scaled up with smoothing. Painting it per-screen-pixel would cost more than
   the entire particle system and look no different at this smoothness. */
function drawSun(hA,hB,mix){
  if(!sunCv){
    sunCv=document.createElement('canvas');
    sunCv.width=CONFIG.gridLon; sunCv.height=CONFIG.gridLat;
    sunCtx=sunCv.getContext('2d');
    sunImg=sunCtx.createImageData(CONFIG.gridLon,CONFIG.gridLat);
  }
  /* Terrain shading comes free: Open-Meteo reports the ELEVATION of every
     point it returns, so the same request that brings the weather also brings
     a coarse DEM. Shading by the west-east slope makes the Front Range appear
     under the Colorado map, which is the thing that explains its wind. It is
     applied as a brightness multiplier rather than a second colour layer, so
     it never competes with the insolation for the eye. */
  const d=sunImg.data;
  const E=data.elev, GL=CONFIG.gridLon, GA=CONFIG.gridLat;
  let eMin=Infinity, eMax=-Infinity;
  if(E && E.length){ for(let i=0;i<E.length;i++){ if(E[i]<eMin)eMin=E[i]; if(E[i]>eMax)eMax=E[i]; } }
  const eRange=Math.max(1, eMax-eMin);
  for(let a=0;a<GA;a++) for(let o=0;o<GL;o++){
    const i=a*GL+o;
    const sv=data.sun[hA][i]+(data.sun[hB][i]-data.sun[hA][i])*mix;
    const c=ramp(SUNPAL, sv/950);
    let shade=1;
    if(E && E.length===GA*GL){
      const oW=Math.max(0,o-1), oE=Math.min(GL-1,o+1);
      const slope=(E[a*GL+oE]-E[a*GL+oW])/eRange;   // lit from the west
      const lift =(E[i]-eMin)/eRange;
      shade=0.80 + 0.30*lift - 0.45*slope;
      shade=shade<0.6?0.6:shade>1.35?1.35:shade;
    }
    /* Terrain is added as its own faint relief BEFORE the sunlight, not just
       used to shade it. Shading alone multiplies the insolation colour, so at
       night - when that colour is nearly black - the mountains vanished
       exactly when there was nothing else on screen to look at. */
    const relief = E && E.length===GA*GL ? (shade-0.8)*26 : 0;
    const j=i*4;
    d[j]  =Math.min(255, c[0]*shade + relief*1.00);
    d[j+1]=Math.min(255, c[1]*shade + relief*1.05);
    d[j+2]=Math.min(255, c[2]*shade + relief*1.20);
    d[j+3]=255;
  }
  sunCtx.putImageData(sunImg,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(sunCv, toX(loc.lonMin), toY(loc.latMax),
                       toX(loc.lonMax)-toX(loc.lonMin), toY(loc.latMin)-toY(loc.latMax));
}

/* State/province lines, international boundaries and coastline. Drawn every
   frame on top of the slowly-refreshing base so they stay crisp instead of
   being eaten by the trail wash. Cheap: a couple of thousand points. */
function drawMap(){
  const B=(typeof BORDERS!=='undefined') && BORDERS[loc.key];
  if(!B) return;
  const stroke=(lines,style,width)=>{
    ctx.strokeStyle=style; ctx.lineWidth=Math.max(1,width*DPR);
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    for(const ln of lines){
      for(let i=0;i<ln.length;i++){
        const x=toX(ln[i][0]), y=toY(ln[i][1]);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
    }
    ctx.stroke();
  };
  // coast reads brighter than political lines: water is a physical edge the
  // wind actually responds to, a state line is not
  stroke(B.coast  || [], 'rgba(150,205,235,0.60)', 1.7);
  stroke(B.borders|| [], 'rgba(195,212,238,0.34)', 1.2);
}

/* The basemap: land relief plus the political and coastal lines, rendered
   once when the location changes. It is what the sunlight reveals, so it has
   to exist independently of the weather rather than being tinted by it. */
function buildBasemap(){
  if(!mapCv2) mapCv2=document.createElement('canvas');
  mapCv2.width=W; mapCv2.height=H;
  const m=mapCv2.getContext('2d');
  m.clearRect(0,0,W,H);
  // land only within the region box; the surround stays page background
  m.fillStyle='#0a1018';
  m.fillRect(toX(loc.lonMin), toY(loc.latMax),
             toX(loc.lonMax)-toX(loc.lonMin), toY(loc.latMin)-toY(loc.latMax));

  /* Relief from the DEM raster built by build_weather_maps.py.
     This REPLACES the relief that used to be derived from Open-Meteo's own
     elevation values: that grid is a dozen points across, so it could hint at
     the Front Range but never draw it. If the raster is missing for any
     reason the coarse version below still runs, so the page degrades rather
     than failing. */
  let reliefDrawn=false;
  if(wxImg && wxImg.complete && wxImg.naturalWidth){
    m.imageSmoothingEnabled=true;
    m.drawImage(wxImg, toX(loc.lonMin), toY(loc.latMax),
                       toX(loc.lonMax)-toX(loc.lonMin), toY(loc.latMin)-toY(loc.latMax));
    reliefDrawn=true;
  }

  const E=data && data.elev, GL=CONFIG.gridLon, GA=CONFIG.gridLat;
  if(!reliefDrawn && E && E.length===GA*GL){
    const tmpCv=document.createElement('canvas');
    tmpCv.width=GL; tmpCv.height=GA;
    const tc=tmpCv.getContext('2d'), im=tc.createImageData(GL,GA), d=im.data;
    let lo=Infinity, hi=-Infinity;
    for(let i=0;i<E.length;i++){ if(E[i]<lo)lo=E[i]; if(E[i]>hi)hi=E[i]; }
    const rng=Math.max(1,hi-lo);
    for(let a=0;a<GA;a++) for(let o=0;o<GL;o++){
      const i=a*GL+o;
      const oW=Math.max(0,o-1), oE=Math.min(GL-1,o+1);
      const slope=(E[a*GL+oE]-E[a*GL+oW])/rng;
      const lift=(E[i]-lo)/rng;
      const v=0.35+0.55*lift-0.40*slope;           // lit from the west
      const k=Math.max(0,Math.min(1,v));
      const j=i*4;
      d[j]=Math.round(26+92*k); d[j+1]=Math.round(32+96*k); d[j+2]=Math.round(40+96*k); d[j+3]=255;
    }
    tc.putImageData(im,0,0);
    m.imageSmoothingEnabled=true;
    m.drawImage(tmpCv, toX(loc.lonMin), toY(loc.latMax),
                       toX(loc.lonMax)-toX(loc.lonMin), toY(loc.latMin)-toY(loc.latMax));
  }

  const B=(typeof BORDERS!=='undefined') && BORDERS[loc.key];
  if(B){
    /* Clip to the region box. The border data is padded well beyond it, so
       without this the coastline runs on past the edge of the land fill and
       the map appears to leak. */
    m.save();
    m.beginPath();
    m.rect(toX(loc.lonMin), toY(loc.latMax),
           toX(loc.lonMax)-toX(loc.lonMin), toY(loc.latMin)-toY(loc.latMax));
    m.clip();
    const stroke=(lines,style,width)=>{
      m.strokeStyle=style; m.lineWidth=Math.max(1,width*DPR);
      m.lineJoin='round'; m.lineCap='round'; m.beginPath();
      for(const ln of lines){
        for(let i=0;i<ln.length;i++){
          const x=toX(ln[i][0]), y=toY(ln[i][1]);
          if(i===0) m.moveTo(x,y); else m.lineTo(x,y);
        }
      }
      m.stroke();
    };
    stroke(B.coast  || [], 'rgba(120,190,230,0.55)', 1.8);
    stroke(B.borders|| [], 'rgba(210,225,245,0.30)', 1.2);
    m.restore();
  }
}

/* The sunlight mask. A grey sheet over the basemap whose opacity falls where
   the sun is strong, so daylight LIFTS THE VEIL off the land instead of
   painting a colour on top of it - night is where the map is hidden. */
/* Build the base for ONE hour into a given canvas.

   It used to be rebuilt only when the hour index changed and then held, so at
   1.7 seconds per simulated hour the whole scene stepped in brightness every
   1.7 s - the flashing Joe saw. Now two are kept, this hour and the next, and
   draw() cross-fades between them, so the light glides the way it does
   outdoors. Two canvases and one extra drawImage; no extra rebuild cost. */
function buildBaseInto(cv2, hA, hB, mix){
  cv2.width=W; cv2.height=H;
  const b=cv2.getContext('2d');
  b.fillStyle='#04060b'; b.fillRect(0,0,W,H);

  /* THE MAP, LIT ONLY WHERE THE SUN IS ON IT.
     The whole basemap - relief, coastline, borders - is masked by the
     insolation field, so the land appears where sunlight is falling and fades
     under cloud and at night. Masking the finished basemap rather than
     drawing a second relief underneath it matters: buildBasemap fills the
     region box OPAQUELY, so anything drawn beneath is simply covered, which
     is exactly how the first attempt at this ended up a flat grey. */
  if(!wxCv) wxCv=document.createElement('canvas');
  wxCv.width=W; wxCv.height=H;
  const c=wxCv.getContext('2d');
  c.drawImage(mapCv2,0,0);

  if(!litCv){
    litCv=document.createElement('canvas');
    litCv.width=CONFIG.gridLon; litCv.height=CONFIG.gridLat;
  }
  const lc=litCv.getContext('2d');
  const li=lc.createImageData(CONFIG.gridLon,CONFIG.gridLat);
  const ld=li.data;
  for(let i=0;i<CONFIG.gridLat*CONFIG.gridLon;i++){
    const sv=data.sun[hA][i]+(data.sun[hB][i]-data.sun[hA][i])*mix;
    const lit=Math.max(0,Math.min(1, sv/720));
    const j=i*4;
    ld[j]=ld[j+1]=ld[j+2]=255;
    /* Never invisible. The first version floored this at 0.10 and the land
       simply vanished overnight - Joe: "dim but not invisible at night, clear
       during full sun". A third of full strength keeps the coast and the
       ranges legible in the dark while still leaving a clear difference
       between a sunlit afternoon and 3am. */
    ld[j+3]=Math.round(255*(0.55+0.45*Math.pow(lit,0.75)));
  }
  lc.putImageData(li,0,0);
  const gx=toX(loc.lonMin), gy=toY(loc.latMax);
  const gw=toX(loc.lonMax)-gx, gh=toY(loc.latMin)-gy;
  c.globalCompositeOperation='destination-in';
  c.imageSmoothingEnabled=true;
  c.drawImage(litCv, gx,gy,gw,gh);
  c.globalCompositeOperation='source-over';

  b.globalAlpha=CONFIG.baseMapAlpha;
  b.drawImage(wxCv,0,0);
  b.globalAlpha=1;

  if(!sunCv){
    sunCv=document.createElement('canvas');
    sunCv.width=CONFIG.gridLon; sunCv.height=CONFIG.gridLat;
    sunCtx=sunCv.getContext('2d');
    sunImg=sunCtx.createImageData(CONFIG.gridLon,CONFIG.gridLat);
  }
  const d=sunImg.data;
  for(let i=0;i<CONFIG.gridLat*CONFIG.gridLon;i++){
    const sv=data.sun[hA][i]+(data.sun[hB][i]-data.sun[hA][i])*mix;
    const lit=Math.max(0,Math.min(1, sv/720));
    const a=Math.round(255*(CONFIG.maskMax*(1-lit)));
    const j=i*4;
    d[j]=14; d[j+1]=17; d[j+2]=26; d[j+3]=a;       // the veil
  }
  sunCtx.putImageData(sunImg,0,0);
  b.imageSmoothingEnabled=true;
  /* Only over the map. Stretching the veil across the whole canvas tinted the
     margins too, so at midday the entire screen went olive and the wind
     streaks disappeared into it. */
  const mx=toX(loc.lonMin), my=toY(loc.latMax);
  const mw=toX(loc.lonMax)-mx, mh=toY(loc.latMin)-my;
  b.drawImage(sunCv, mx,my,mw,mh);

  // a warm bloom where the sun is strongest, so noon reads as warmth not just
  // as absence of grey
  b.globalCompositeOperation='lighter';
  for(let i=0;i<CONFIG.gridLat*CONFIG.gridLon;i++){
    const sv=data.sun[hA][i]+(data.sun[hB][i]-data.sun[hA][i])*mix;
    const lit=Math.max(0,Math.min(1,(sv-450)/650));
    const j=i*4;
    d[j]=Math.round(70*lit); d[j+1]=Math.round(52*lit); d[j+2]=Math.round(16*lit); d[j+3]=255;
  }
  sunCtx.putImageData(sunImg,0,0);
  b.globalAlpha=0.30; b.drawImage(sunCv,mx,my,mw,mh); b.globalAlpha=1;
  b.globalCompositeOperation='source-over';
}

/* Marked places: a ring, a letter, and the name. Drawn every frame on top of
   the slowly-refreshing base so the trail wash cannot eat them. */
function drawMarks(){
  const ms=loc && loc.marks;
  if(!ms || !ms.length) return;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const lead=Math.round(W*0.020);
  for(const m of ms){
    const x=toX(m.lon), y=toY(m.lat);
    const r=Math.max(11, W*0.0080);
    const ly=y + (m.dy||0)*Math.round(W*0.012);
    const left=(m.side==='left');
    const lx=left ? x-lead : x+lead;

    // a leader from the dot out to wherever the label had to be moved
    ctx.strokeStyle='rgba(255,225,175,0.45)'; ctx.lineWidth=Math.max(1,1.1*DPR);
    ctx.beginPath(); ctx.moveTo(x+(left?-r:r), y); ctx.lineTo(lx, ly); ctx.stroke();

    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
    ctx.fillStyle='rgba(10,14,22,0.72)'; ctx.fill();
    ctx.strokeStyle='rgba(255,225,175,0.92)'; ctx.lineWidth=Math.max(1,1.8*DPR); ctx.stroke();

    ctx.fillStyle='rgba(255,235,195,0.98)';
    ctx.font=`600 ${Math.round(W*0.0098)}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(m.label, x, y+1);

    ctx.font=`400 ${Math.round(W*0.0082)}px ui-monospace, Menlo, monospace`;
    const tw=ctx.measureText(m.name).width;
    const bx=left ? lx-tw-7*DPR : lx;
    ctx.fillStyle='rgba(10,14,22,0.72)';
    ctx.fillRect(bx-4*DPR, ly-Math.round(W*0.0062), tw+11*DPR, Math.round(W*0.0124));
    ctx.fillStyle='rgba(240,246,255,0.94)';
    ctx.textAlign='left';
    ctx.fillText(m.name, bx+2*DPR, ly+1);
  }
  ctx.textBaseline='alphabetic';
}

function drawGraticule(){
  ctx.save();
  ctx.strokeStyle='rgba(160,190,225,0.10)'; ctx.lineWidth=Math.max(1,DPR*0.8);
  ctx.beginPath();
  for(let la=Math.ceil(loc.latMin); la<=loc.latMax; la++){ ctx.moveTo(toX(loc.lonMin),toY(la)); ctx.lineTo(toX(loc.lonMax),toY(la)); }
  for(let lo=Math.ceil(loc.lonMin); lo<=loc.lonMax; lo++){ ctx.moveTo(toX(lo),toY(loc.latMin)); ctx.lineTo(toX(lo),toY(loc.latMax)); }
  ctx.stroke();
  const hx=toX(loc.lon), hy=toY(loc.lat);
  ctx.fillStyle='rgba(255,240,205,0.95)';
  ctx.beginPath(); ctx.arc(hx,hy,Math.max(3,3.4*DPR),0,6.2832); ctx.fill();
  ctx.font=`${Math.round(W*0.0090)}px ui-sans-serif, system-ui, sans-serif`;
  ctx.fillStyle='rgba(255,244,215,0.88)';
  /* Put the city name on whichever side is clear of a marked campus. In
     Vancouver the SFU marker sits 25 km east of the city dot, and the label
     ran straight underneath it. */
  const clash=(loc.marks||[]).some(m=>{
    const mx=toX(m.lon);
    return mx>hx && mx-hx < Math.round(W*0.045);
  });
  ctx.textAlign = clash ? 'right' : 'left';
  ctx.fillText(loc.city, hx + (clash ? -10*DPR : 10*DPR), hy-10*DPR);
  ctx.textAlign='left';
  ctx.restore();
}

/* The sunlight scale used to sit here. It was a key to a colour ramp that
   the basemap has since replaced - the land itself now brightens with the
   sun - so the bar was explaining a legend nobody was reading against. */


const tmp=[0,0];
function draw(){
  const hA=Math.min(data.hours-1, Math.floor(hourF));
  const hB=Math.min(data.hours-1, hA+1);
  const mix=hourF-hA;

  /* The base is re-asserted a little each frame rather than repainted whole.
     Repainting it opaquely every frame erased the streaks before they could
     become streaks - the tracers showed as isolated dashes with no trail at
     all. Fading toward the base instead gives the trails their length, and
     the same wash clears the margins outside the map. */
  if(hA!==lastBaseHour){
    if(!baseCv)  baseCv =document.createElement('canvas');
    if(!baseCvB) baseCvB=document.createElement('canvas');
    buildBaseInto(baseCv , hA, hA, 0);        // this hour
    buildBaseInto(baseCvB, hB, hB, 0);        // and the next
    lastBaseHour=hA;
  }

  /* COMPOSE every few frames, STAMP every frame.

     Stamping the base only every third frame was measurably wrong, whatever
     the old comment here claimed. Between stamps the tracer trails drift the
     picture one way and each stamp snaps it back, so the whole screen
     sawtooths at twenty hertz - measured on the rendered canvas, the
     luminance reversed direction on two frames out of three and the
     autocorrelation peaked at lags 3, 6 and 9, exactly the refresh cadence.
     About eight tenths of a per cent, which is small on paper and reads as a
     pulse on a wall-sized panel.

     The cost is why it was done that way, so the work is split rather than
     tripled: the two hourly bases are cross-faded into ONE image on the old
     cadence - the mix moves only three per cent of an hour in that time - and
     that single image is stamped every frame. One full-screen draw per frame
     instead of two every third. The per-frame alpha is set so the base decays
     at the same rate it did before, 1-(1-0.30)^(1/3), so the picture settles
     exactly where it used to.

     Compositing into one image also fixes a second, quieter fault: two draws
     at split alpha do not sum to the single-draw strength. At mix 0.5 the base
     was re-asserting at 0.2775 instead of 0.30, so its hold on the picture
     sagged through the middle of every hour and firmed up at each end. */
  if((frameNo++ % CONFIG.baseEvery)===0 || !baseMixCv){
    if(!baseMixCv) baseMixCv=document.createElement('canvas');
    if(baseMixCv.width!==W || baseMixCv.height!==H){ baseMixCv.width=W; baseMixCv.height=H; }
    const bm=baseMixCv.getContext('2d');
    bm.globalAlpha=1;    bm.drawImage(baseCv,0,0);     // opaque: replaces the last one
    bm.globalAlpha=mix;  bm.drawImage(baseCvB,0,0);    // = (1-mix)*A + mix*B
    bm.globalAlpha=1;
  }
  ctx.globalAlpha=CONFIG.baseStamp;
  ctx.drawImage(baseMixCv,0,0);
  ctx.globalAlpha=1;

  /* Batch the tracers by colour. Stroking each one individually meant 3,600
     beginPath/stroke pairs a frame, which dominated the whole render; sorting
     them into a handful of speed buckets and stroking each bucket once cuts
     that to eight. The picture is identical - the palette was only ever
     sampled at a few dozen distinct values anyway. */
  ctx.lineWidth=Math.max(1,1.15*DPR); ctx.lineCap='round';
  ctx.globalAlpha=0.5;
  const k=CONFIG.stepScale*Math.min(W,H)/100;
  const NB=WINDPAL.length;
  for(let b=0;b<NB;b++) bucket[b].length=0;

  for(let i=0;i<CONFIG.particles;i++){
    if(++pAge[i]>CONFIG.respawnFrames){ respawn(i,false); continue; }
    const x=px[i], y=py[i];
    if(!sampleAt(data.u[hA],data.u[hB],mix,x,y,tmp,0)){ respawn(i,false); continue; }
    sampleAt(data.v[hA],data.v[hB],mix,x,y,tmp,1);
    const nx=x+tmp[0]*k, ny=y-tmp[1]*k;
    if(nx<0||ny<0||nx>=W||ny>=H){ respawn(i,false); continue; }
    const sp=Math.hypot(tmp[0],tmp[1]);
    let b=(sp/16*(NB-1))|0; if(b<0)b=0; else if(b>NB-1)b=NB-1;
    const arr=bucket[b];
    arr.push(x,y,nx,ny);
    px[i]=nx; py[i]=ny;
  }
  for(let b=0;b<NB;b++){
    const arr=bucket[b];
    if(!arr.length) continue;
    ctx.strokeStyle=rgbs(WINDPAL[b]);
    ctx.beginPath();
    for(let j=0;j<arr.length;j+=4){ ctx.moveTo(arr[j],arr[j+1]); ctx.lineTo(arr[j+2],arr[j+3]); }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  drawGraticule();
  drawMarks();
  drawTimeline();
}

/* A strip showing the whole window with the present marked, and a cursor
   riding along it. Without this the clock alone cannot tell you whether you
   are watching last night or tomorrow morning. */
function drawTimeline(){
  const w=Math.round(W*0.34), h=Math.round(3*DPR);
  const x=Math.round((W-w)/2), y=Math.round(H*0.876);
  const nowF=(data.nowOffset||0)/Math.max(1,data.hours-1);
  const curF=hourF/Math.max(1,data.hours-1);

  ctx.fillStyle='rgba(150,172,205,0.22)'; ctx.fillRect(x,y,w,h);
  // the past half, slightly brighter, so the two halves are distinguishable
  ctx.fillStyle='rgba(150,190,225,0.34)'; ctx.fillRect(x,y,Math.round(w*nowF),h);

  // "now" tick
  const nx=x+Math.round(w*nowF);
  ctx.fillStyle='rgba(255,225,175,0.85)';
  ctx.fillRect(nx-Math.max(1,DPR), y-6*DPR, Math.max(2,2*DPR), h+12*DPR);
  ctx.font=`${Math.round(11*DPR)}px ui-monospace, Menlo, monospace`;
  ctx.textAlign='center';
  ctx.fillText('now', nx, y-11*DPR);

  // cursor
  const cx2=x+Math.round(w*curF);
  ctx.fillStyle='rgba(235,245,255,0.95)';
  ctx.beginPath(); ctx.arc(cx2, y+h/2, 4.5*DPR, 0, 6.2832); ctx.fill();

  ctx.fillStyle='rgba(150,172,205,0.55)';
  ctx.textAlign='left';  ctx.fillText(`-${CONFIG.pastHours} h`, x, y+20*DPR);
  ctx.textAlign='right'; ctx.fillText(`+${CONFIG.aheadHours} h`, x+w, y+20*DPR);
  ctx.textAlign='left';
}

function localReadout(){
  const hA=Math.min(data.hours-1,Math.floor(hourF)), hB=Math.min(data.hours-1,hA+1), mix=hourF-hA;
  const x=toX(loc.lon), y=toY(loc.lat);
  if(!sampleAt(data.u[hA],data.u[hB],mix,x,y,tmp,0)) return '';
  sampleAt(data.v[hA],data.v[hB],mix,x,y,tmp,1);
  const sp=Math.hypot(tmp[0],tmp[1]);
  const from=((Math.atan2(tmp[0],tmp[1])*180/Math.PI+360)%360+180)%360;
  const pts=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const s=[0,0]; sampleAt(data.sun[hA],data.sun[hB],mix,x,y,s,0);
  const t=[0,0]; sampleAt(data.temp[hA],data.temp[hB],mix,x,y,t,0);
  return `${(sp*2.23694).toFixed(0)} mph from ${pts[Math.round(from/22.5)%16]}  ·  `
       + `${Math.round(s[0])} W/m²  ·  ${Math.round(t[0]*9/5+32)}°F`;
}

function clockText(){
  const hA=Math.min(data.hours-1,Math.floor(hourF));
  const iso=data.times[hA];
  if(!iso) return '';
  const d=new Date(iso);
  const day=d.toLocaleDateString('en-US',{weekday:'short'});
  const hr=d.getHours();
  const ampm=hr<12?'am':'pm'; const h12=(hr%12)||12;
  const rel=Math.round(hourF-(data.nowOffset||0));
  const tag = rel===0 ? 'now' : rel<0 ? `${-rel} h ago` : `+${rel} h`;
  return `${day} ${h12}${ampm}   ${tag}`;
}

function updateText(){
  if(!data) return;
  hTitle.textContent=loc.name;
  hClock.textContent=clockText();
  hSub.textContent=`${loc.city} · ${localReadout()}`;
  const ageMin=Math.round((Date.now()-data.when)/60000);
  if(data.source==='live')       warnEl.textContent='';
  else if(data.source==='cache') warnEl.textContent=`cached forecast, ${ageMin} min old — no network`;
  else                           warnEl.textContent='SAMPLE FIELD — not a forecast (no network, no cached data)';

  capWhat.textContent =
    'The land is veiled in grey and the sun lifts the veil: the map shows through where sunlight is reaching the ground, and stays hidden through the night. Streaks are surface wind, drawn by letting tracers ride the field. '
  + 'The window runs from eighteen hours ago to eighteen ahead, so you see how the day actually went as well as where it is going.';
  capParams.textContent =
    `${data.times[0] ? new Date(data.times[0]).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric'}) : '?'}`
  + ` → ${data.times[data.hours-1] ? new Date(data.times[data.hours-1]).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric'}) : '?'}`
  + `  ·  ${data.hours} h in ${Math.round(data.hours*CONFIG.secPerHour)} s`
  + `  ·  ${CONFIG.gridLat}x${CONFIG.gridLon} sample points, ${CONFIG.particles} tracers`
  + `  ·  ${data.source==='live' ? 'Open-Meteo (past 18 h observed-analysis + 18 h forecast)' : data.source}`;
}

function updateInfo(){
  infoEl.textContent =
    `location  ${loc.city}\n`+
    `source    ${data?data.source:'-'}\n`+
    `hour      ${hourF.toFixed(2)} / ${data.hours}\n`+
    `grid      ${CONFIG.gridLat} x ${CONFIG.gridLon}\n`+
    `fps       ${fps.toFixed(0)}${paused?'  [PAUSED]':''}`;
}

function handOff(){
  if(handingOff) return; handingOff=true;
  document.body.style.transition=`opacity ${CONFIG.fadeMs}ms ease-in-out`;
  document.body.style.opacity='0';
  /* An EMPTY nextPage means there is nowhere to hand on to - which is what
     build_github.py leaves behind when it cuts this page out of the wall's
     rotation for publishing. Start again instead. */
  setTimeout(()=>{ if(CONFIG.nextPage) location.href=CONFIG.nextPage;
                   else location.reload(); },CONFIG.fadeMs);
}

async function nextLocation(){
  locIndex++;
  /* ?loc=<key> pins one place. Without it, looking at a particular map means
     waiting for the rotation to reach it, and each place plays out a whole
     day first. Same idea as ?hood= on the plume page. */
  const want=new URLSearchParams(location.search).get('loc');
  const pin=want ? LOCATIONS.findIndex(l=>l.key===want) : -1;
  loc = pin>=0 ? LOCATIONS[pin] : LOCATIONS[locIndex % LOCATIONS.length];
  /* Shaded relief for this region, rendered at build time by
     build_weather_maps.py from the same DEM the hiker walks on. Loaded as an
     <img>, not fetched: the kiosk runs from file://, where fetch() of a
     sibling file is a blocked cross-origin read. */
  wxImg=new Image();
  wxImg.onload=()=>{ lastBaseHour=-1; };      // force the base to rebuild with it
  wxImg.src='wx_'+loc.key+'.png';
  computeMap();
  data=null; hourF=0; startedAt=performance.now();
  ctx.fillStyle='#04060b'; ctx.fillRect(0,0,W,H);
  hTitle.textContent=loc.name; hClock.textContent='loading…'; hSub.textContent='';
  renderDaily(null);                       // clear last place's panel
  data=await fetchData();
  fetchDaily().then(renderDaily);          // side panel, independent of the map
  buildBasemap(); lastBaseHour=-1;
  seedParticles();
  updateText();
}

function frame(now){
  requestAnimationFrame(frame);
  const dtms=Math.max(0, now-lastFrame); lastFrame=now;
  fps=fps?fps*0.9+(1000/dtms)*0.1:1000/dtms;
  if(paused||handingOff||!data) return;

  hourF += (dtms/1000)/CONFIG.secPerHour;
  if(hourF>=data.hours-1){
    // a full day played out: move to the next place, or hand the screen on
    if(!PINNED && locIndex+1>=LOCATIONS.length){ handOff(); return; }
    nextLocation(); return;
  }
  draw();
  updateText();
  if(document.body.classList.contains('showinfo')) updateInfo();
}

addEventListener('keydown',(e)=>{
  switch(e.key){
    case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
    case 'n': case 'N': nextLocation(); break;
    case 'p': case 'P': case ' ': paused=!paused; updateInfo(); break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    default:
      if(/^[0-9]$/.test(e.key)){
        const s=e.key==='0'?10:parseInt(e.key,10);
        console.log('[weather] RATING STUB - score',s,'location',loc&&loc.city);
      }
  }
});

resize();
nextLocation();
requestAnimationFrame(frame);
</script>
<script src="nav.js"></script>
</body>
</html>
