        const rr=.07*CAM.f/_p[0][2];
        ctx.fillRect(px,py,Math.max(1,rr),Math.max(1,rr));
      }
    }
  }
  drawApron(a,b,ca,cb, -1); drawApron(a,b,ca,cb, 1);
}
const crossCache=new Map();
let crossCacheFrame=-1;
function cross(i){
  if (crossCacheFrame!==RUN.frame){ crossCache.clear(); crossCacheFrame=RUN.frame; }
  let c=crossCache.get(i); if (c) return c;
  c=[];
  const hw=T.width[i]/2;
  for(const L of LATS) c.push(stationPoint(i, L*hw, [0,0,0]));
  crossCache.set(i,c);
  return c;
}
/* How far the hillside skirt may extend on this side of this station. On the
   inside of a bend it must stop short of the turn centre - and it has to vary
   CONTINUOUSLY (via the smoothed curvature), because a hard on/off threshold
   left step discontinuities that read as torn shards of landscape. */
function apronReach(i, side){
  const k=T.kapSm[i];
  if (side===Math.sign(k||1) && Math.abs(k)>.008)
    return Math.min(CONFIG.corridor, Math.max(2.5, .75/Math.abs(k)));
  return CONFIG.corridor;
}
function drawApron(a,b,ca,cb, side){
  // side=-1 right/downhill-or-uphill depending on uphill[]; just extend both ways
  const hwA=T.width[a]/2, hwB=T.width[b]/2;
  const reachA=apronReach(a,side), reachB=apronReach(b,side);
  const cutA=Math.min(side===T.uphill[a]?2.2:4, reachA), cutB=Math.min(side===T.uphill[a]?2.2:4, reachB);
  const spans=[[cutA,cutB,true],[reachA,reachB,false]];
  let prevA=ca[side<0?0:LATS.length-1], prevB=cb[side<0?0:LATS.length-1];
  for(const [dA,dB,nearBand] of spans){
    const wA=stationPoint(a, side*(hwA+dA), [0,0,0]);
    const wB=stationPoint(b, side*(hwB+dB), [0,0,0]);
    proj(prevA,_p[0]); proj(wA,_p[1]); proj(wB,_p[2]); proj(prevB,_p[3]);
    const grass= side===T.uphill[a]&&nearBand? '#8a6a4d' : '#6f7f57';
    quad(_p[0],_p[1],_p[2],_p[3], shadeQuad(prevA,wA,wB,prevB, grass, 1), null);
    prevA=wA; prevB=wB;
  }
  // tread edge line - reads as the worn lip of the bench
  proj(ca[side<0?0:LATS.length-1],_p[0]); proj(cb[side<0?0:LATS.length-1],_p[1]);
  if (_p[0][2]>0&&_p[1][2]>0){ ctx.strokeStyle='rgba(40,30,20,.35)';
    ctx.lineWidth=Math.max(.6,1.4*DPR*Math.min(1,40/_p[0][2]));
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke(); }
}

function drawPlanRibbon(a,b){
  // the rider's INTENTION, painted on the dirt: red where the plan brakes,
  // green where it pedals, white where it just carries speed. Drawn as a
  // cased stroke so it reads on any surface colour.
  ctx.lineCap='round';
  for(let i=a;i<b;i++){
    const p0=stationPoint(i, PLAN.n[i], [0,0,0]); p0[2]+=.05;
    const p1=stationPoint(i+1, PLAN.n[i+1], [0,0,0]); p1[2]+=.05;
    proj(p0,_p[0]); proj(p1,_p[1]);
    if (_p[0][2]<0||_p[1][2]<0) continue;
    const act=PLAN.act[i];
    const wpx=clamp(.34*CAM.f/_p[0][2], 2, 15);
    ctx.strokeStyle='rgba(15,12,10,.45)'; ctx.lineWidth=wpx+2.5;
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
    ctx.strokeStyle= act===1?'rgba(255,72,58,.9)': act===2?'rgba(64,236,140,.9)':'rgba(250,250,240,.85)';
    ctx.lineWidth=wpx;
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
  }
}
function drawSightMark(i){
  const p=stationPoint(i,PLAN.n[i]||0,[0,0,0]); p[2]+=.6;
  proj(p,_p[0]); if (_p[0][2]<0) return;
  const r=Math.max(3, .35*CAM.f/_p[0][2]);
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.font=`${Math.max(10,r*2.4)}px ui-sans-serif`; ctx.textAlign='center';
  ctx.fillText('?', _p[0][0], _p[0][1]);
}

const _rockTop=[0,0,0];
function drawRock(rk){
  const base=stationPoint(rk.i, rk.n, [0,0,0]);
  const s=Math.sin(T.psi[rk.i]), c=Math.cos(T.psi[rk.i]);
  const n=Math.min(rk.pts.length,8);
  for(let j=0;j<n;j++){
    const [ax,ay]=rk.pts[j];
    _w[j][0]=base[0]+c*ax-s*ay; _w[j][1]=base[1]+s*ax+c*ay; _w[j][2]=base[2];
    proj(_w[j], _p[j]); if (_p[j][2]<0) return;
  }
  // ground footprint (dark), then a lit cap raised by h toward the sun side
  const dark = rk.kind==='boulder'? '#54575f' : rk.kind==='small'? '#63656d' : '#5b5e66';
  const lit  = rk.kind==='boulder'? '#8b8f9c' : rk.kind==='small'? '#8f9097' : '#989ca6';
  ctx.beginPath();
  for(let j=0;j<n;j++){ const P=_p[j]; j?ctx.lineTo(P[0],P[1]):ctx.moveTo(P[0],P[1]); }
  ctx.closePath();
  ctx.fillStyle=dark; ctx.fill();
  ctx.strokeStyle='rgba(20,20,25,.5)'; ctx.lineWidth=1; ctx.stroke();
  proj([base[0]+.3*rk.h*SUN[0], base[1]+.3*rk.h*SUN[1], base[2]+rk.h], _rockTop);
  if (_rockTop[2]<0) return;
  // big rideable rocks keep a flatter, wider cap (they read as slabs, and the
  // painted line rides straight across them)
  const capPull = rk.kind==='small'? .6 : .42;
  ctx.beginPath();
  for(let j=0;j<n;j++){
    const P=_p[j];
    const px2=P[0]*(1-capPull)+_rockTop[0]*capPull, py2=P[1]*(1-capPull)+_rockTop[1]*capPull;
    j?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
  }
  ctx.closePath(); ctx.fillStyle=lit; ctx.fill();
}

function drawTree(tr){
  const base=[0,0,0]; stationPoint(tr.i, tr.n, base); base[2]=T.z[tr.i]+tr.zg;
  proj(base,_p[0]); if (_p[0][2]<0 || _p[0][2]>260) return;
  const top=[base[0],base[1],base[2]+tr.h]; proj(top,_p[1]); if (_p[1][2]<0) return;
  const wpx=tr.h*.28*CAM.f/_p[0][2];
  if (tr.kind===0){                       // conifer: trunk + two stacked triangles
    ctx.strokeStyle='#4a3826'; ctx.lineWidth=Math.max(1,wpx*.12);
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
    for(let s2=0;s2<2;s2++){
      const y0=lerp(_p[0][1],_p[1][1], .25+.35*s2), y1=lerp(_p[0][1],_p[1][1], .8+.2*s2);
      const w2=wpx*(1-.35*s2);
      ctx.beginPath(); ctx.moveTo(_p[0][0]-w2,y0); ctx.lineTo(_p[0][0]+w2,y0); ctx.lineTo(_p[0][0],y1);
      ctx.closePath(); ctx.fillStyle=s2? '#3c5a42':'#2e4634'; ctx.fill();
    }
  } else {                                // aspen: pale trunk, round crown
    ctx.strokeStyle='#cfd4c6'; ctx.lineWidth=Math.max(1,wpx*.1);
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
    ctx.fillStyle='#7fa34c'; ctx.beginPath();
    ctx.arc(_p[1][0], _p[1][1]+wpx*.4, wpx*.85, 0, TAU); ctx.fill();
  }
}

function drawFinish(){
  const i=T.finishIdx-1, hw=T.width[i]/2;
  const l=stationPoint(i,-hw-.3,[0,0,0]), r=stationPoint(i,hw+.3,[0,0,0]);
  const lt=[l[0],l[1],l[2]+2.6], rt=[r[0],r[1],r[2]+2.6];
  proj(l,_p[0]); proj(r,_p[1]); proj(lt,_p[2]); proj(rt,_p[3]);
  if (_p[0][2]<0||_p[1][2]<0) return;
  ctx.strokeStyle='#dadfe6'; ctx.lineWidth=Math.max(1.5, .06*CAM.f/_p[0][2]);
  ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[2][0],_p[2][1]);
  ctx.moveTo(_p[1][0],_p[1][1]); ctx.lineTo(_p[3][0],_p[3][1]); ctx.stroke();
  const bh2=Math.max(8,.5*CAM.f/_p[0][2]);
  quad(_p[2],_p[3],[_p[3][0],_p[3][1]+bh2,_p[3][2]],[_p[2][0],_p[2][1]+bh2,_p[2][2]],'#20242c',null);
  const mid=[(_p[2][0]+_p[3][0])/2,(_p[2][1]+_p[3][1])/2];
  ctx.fillStyle='#f2f4f8'; ctx.textAlign='center';
  ctx.font=`700 ${Math.max(8,.34*CAM.f/_p[0][2])}px ui-sans-serif`;
  ctx.fillText('FINISH', mid[0], mid[1]+bh2*.72);
}

function drawSkids(iR){
  const t=performance.now()/1000;
  ctx.lineCap='round';
  for(let k=skids.length-1;k>0;k--){
    const s0=skids[k-1], s1=skids[k];
    const age=t-s1.t; if (age>8) continue;
    proj([s0.x,s0.y,s0.z],_p[0]); proj([s1.x,s1.y,s1.z],_p[1]);
    if (_p[0][2]<0||_p[1][2]<0) continue;
    if (Math.hypot(s1.x-s0.x,s1.y-s0.y)>2) continue;
    ctx.strokeStyle=`rgba(35,25,18,${.5*(1-age/8)})`;
    ctx.lineWidth=Math.max(1,.09*CAM.f/_p[0][2]);
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
  }
}
function drawDust(){
  for(let k=dust.length-1;k>=0;k--){
    const d=dust[k]; if ((d.age+=RUN.dtFrame)>d.life){ dust.splice(k,1); continue; }
    d.x+=d.vx*RUN.dtFrame; d.y+=d.vy*RUN.dtFrame; d.z+=d.vz*RUN.dtFrame; d.vz-=4*RUN.dtFrame;
    proj([d.x,d.y,d.z],_p[0]); if (_p[0][2]<0) continue;
    const a=1-d.age/d.life;
    ctx.fillStyle=`rgba(190,168,135,${.35*a})`;
    const r=Math.max(1,(.12+.25*d.age)*CAM.f/_p[0][2]);
    ctx.beginPath(); ctx.arc(_p[0][0],_p[0][1],r,0,TAU); ctx.fill();
  }
}

/* --- the rider ----------------------------------------------------------- */
/* Where the bike stands. Three rules, each learned from watching a tyre sink
   into the dirt:
   (1) Stand on the RENDERED ground, not the mathematical one. The renderer
       draws the tread as straight chords between stations and between five
       lateral samples; on curved cross-sections (cup, berm) the true surface
       runs BELOW those chords, so placing the bike on the true surface put
       the rims under the drawn ground. Interpolating the two station points
       at the rider's own n IS the drawn chord, so contact is exact - and the
       bike stops hopping forward in one-metre steps as a bonus.
   (2) A leaned wheel hangs over the BANK side - sample the ground there too
       and stand on whichever is higher.
   (3) Soft surfaces are allowed to swallow some tyre ON PURPOSE: deep loose
       buries ~4 cm, fine gravel ~2, everything else rides a whisker clear.
       (Joe's point - sinking is honest there, and only there.)             */
function riderBasePos(){
  const S=SIM, i=clamp(Math.floor(S.idx),1,T.N-2), f2=clamp(S.idx-i,0,1);
  const b0=stationPoint(i, S.n, [0,0,0]);
  const b1=stationPoint(Math.min(i+1,T.N-1), S.n, [0,0,0]);
  const base=[lerp(b0[0],b1[0],f2), lerp(b0[1],b1[1],f2), lerp(b0[2],b1[2],f2)];
  const nS=clamp(S.n + Math.sin(S.leanBike)*CONFIG.wheelR*.85,
                 -T.width[i]/2-2, T.width[i]/2+2);
  const sp=surfAt(i,S.n);
  const sink= sp.id===2? .045 : sp.id===4? .02 : 0;
  base[2] += Math.max(0, zOff(i,nS)-zOff(i,S.n)) + .03 - sink;
  return {i, base};
}
/* The shadow is painted with the ground UNDER the bike (the rider strip), the
   bike itself two stations NEARER in the paint order - see drawWorld. */
function drawRiderShadow(){
  const {base}=riderBasePos();
  proj(base,_p[0]);
  if (_p[0][2]>0){ const r=1.1*CAM.f/_p[0][2];
    ctx.fillStyle='rgba(10,8,5,.30)'; ctx.beginPath();
    ctx.ellipse(_p[0][0],_p[0][1], r, r*.28, 0, 0, TAU); ctx.fill(); }
}
function drawRider(){
  const S=SIM;
  const {i, base}=riderBasePos();
  const psi=T.psi[i], th=PLAN.thP[i]||T.theta[i];
  const t=[Math.cos(psi)*Math.cos(th), Math.sin(psi)*Math.cos(th), -Math.sin(th)];   // forward
  let l=[-Math.sin(psi), Math.cos(psi), 0];                                          // left
  let k=[t[1]*l[2]-t[2]*l[1], t[2]*l[0]-t[0]*l[2], t[0]*l[1]-t[1]*l[0]];              // up
  // lean rotates l,k about t (positive lean = toward +n/left for left turns)
  function leanAxes(phi){
    // positive phi = leaning toward +n (the rider's LEFT), which is where the
    // centripetal acceleration points in a left-hand turn. Getting this sign
    // wrong makes the rider hang off the OUTSIDE of every corner.
    const cs=Math.cos(phi), sn=Math.sin(phi);
    return [[l[0]*cs-k[0]*sn, l[1]*cs-k[1]*sn, l[2]*cs-k[2]*sn],
            [k[0]*cs+l[0]*sn, k[1]*cs+l[1]*sn, k[2]*cs+l[2]*sn]];
  }
  const [lb,kb]=leanAxes(S.leanBike), [lr,kr]=leanAxes(S.lean);
  const Pt=(ft,fl,fk,ax)=>{ const L=ax===1?lb:lr, K=ax===1?kb:kr;
    return [base[0]+t[0]*ft+L[0]*fl+K[0]*fk, base[1]+t[1]*ft+L[1]*fl+K[1]*fk,
            base[2]+t[2]*ft+L[2]*fl+K[2]*fk]; };

  const wR=CONFIG.wheelR, wb=CONFIG.wheelbase;
  // posture blend
  const w0=S.postureW;
  const drop2=.14*(S.rockPulse||0);          // absorbing a rock: whole body sinks
  const bl=(a,b2,c2,d2)=>a*w0.stand+b2*w0.pedal+c2*w0.tuck+d2*w0.brake;
  const hip=Pt(bl(-.12,-.20,-.10,-.34), 0, bl(1.00,.95,.92,.96)-drop2, 2);
  const sho=Pt(bl(.14,.10,.22,.02), 0, bl(1.28,1.24,1.06,1.20)-drop2*1.2, 2);
  const head=Pt(bl(.24,.20,.34,.12), 0, bl(1.43,1.39,1.17,1.34)-drop2*1.2, 2);
  const bars=Pt(.42, 0, 1.02, 1);
  const rw=Pt(-wb/2,0,wR,1), fw=Pt(wb/2,0,wR,1), bb=Pt(0,0,.32,1);
  const saddle=Pt(-.16,0,.90,1);
  // cranks/feet
  const ca2=S.pedalW>0? S.crank : 0;
  const footL=Pt(.17*Math.cos(ca2), .12, .32-.17*Math.sin(ca2)*(S.pedalW>0?1:.15), 1);
  const footR=Pt(-.17*Math.cos(ca2), -.12, .32+.17*Math.sin(ca2)*(S.pedalW>0?1:.15), 1);

  function wheel(cw, spin){
    const pts=[];
    for(let j=0;j<12;j++){ const a=j/12*TAU;
      const off=Pt(0,0,0,1);
      pts.push(proj([cw[0]+(t[0]*Math.cos(a)+kb[0]*Math.sin(a))*wR,
                     cw[1]+(t[1]*Math.cos(a)+kb[1]*Math.sin(a))*wR,
                     cw[2]+(t[2]*Math.cos(a)+kb[2]*Math.sin(a))*wR],[0,0,0]));
    }
    if (pts.some(p=>p[2]<0)) return;
    ctx.strokeStyle='#171a1e'; ctx.lineWidth=Math.max(2,.075*CAM.f/pts[0][2]);
    ctx.beginPath(); pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath(); ctx.stroke();
    const c2=proj(cw,[0,0,0]);
    ctx.lineWidth=Math.max(1,.02*CAM.f/c2[2]); ctx.strokeStyle='#3c434c';
    for(let sN=0;sN<3;sN++){ const a=spin+sN*TAU/3;
      const e=proj([cw[0]+(t[0]*Math.cos(a)+kb[0]*Math.sin(a))*wR*.92,
                    cw[1]+(t[1]*Math.cos(a)+kb[1]*Math.sin(a))*wR*.92,
                    cw[2]+(t[2]*Math.cos(a)+kb[2]*Math.sin(a))*wR*.92],[0,0,0]);
      if (e[2]>0){ ctx.beginPath(); ctx.moveTo(c2[0],c2[1]); ctx.lineTo(e[0],e[1]); ctx.stroke(); }
    }
  }
  wheel(rw, S.wheelA); wheel(fw, S.wheelA*1.02);

  function seg(a,b2,wd,col){
    proj(a,_p[0]); proj(b2,_p[1]); if (_p[0][2]<0||_p[1][2]<0) return;
    ctx.strokeStyle=col; ctx.lineCap='round';
    ctx.lineWidth=Math.max(1.5, wd*CAM.f/_p[0][2]);
    ctx.beginPath(); ctx.moveTo(_p[0][0],_p[0][1]); ctx.lineTo(_p[1][0],_p[1][1]); ctx.stroke();
  }
  const frameCol=RUN.rider.col;
  seg(rw,bb,.05,frameCol); seg(bb,saddle,.05,frameCol); seg(saddle,Pt(.3,0,.95,1),.045,frameCol);
  seg(Pt(.3,0,.95,1),fw,.045,frameCol); seg(bb,Pt(.3,0,.95,1),.05,frameCol);
  seg(Pt(.42,-.24,1.02,1),Pt(.42,.24,1.02,1),.05,'#20242a');       // bars
  // legs with a hint of knee
  const kneeL=[(hip[0]+footL[0])/2+lr[0]*.06+t[0]*.1,(hip[1]+footL[1])/2+lr[1]*.06+t[1]*.1,(hip[2]+footL[2])/2+.06];
  const kneeR=[(hip[0]+footR[0])/2-lr[0]*.06+t[0]*.1,(hip[1]+footR[1])/2-lr[1]*.06+t[1]*.1,(hip[2]+footR[2])/2+.06];
  seg(hip,kneeL,.06,'#23262b'); seg(kneeL,footL,.05,'#23262b');
  seg(hip,kneeR,.06,'#1b1e22'); seg(kneeR,footR,.05,'#1b1e22');
  seg(hip,sho,.085,'#2b3038');                                     // torso
  seg(sho,Pt(.42,-.2,1.02,1),.045,'#2b3038'); seg(sho,Pt(.42,.2,1.02,1),.045,'#2b3038');
  // head + helmet in team colour
  proj(head,_p[0]);
  if (_p[0][2]>0){ const r=.10*CAM.f/_p[0][2];
    ctx.fillStyle='#c9a184'; ctx.beginPath(); ctx.arc(_p[0][0],_p[0][1],r,0,TAU); ctx.fill();
    ctx.fillStyle=frameCol; ctx.beginPath(); ctx.arc(_p[0][0],_p[0][1]-r*.25,r*1.05,Math.PI,0); ctx.fill(); }
}

/* ============================== HUD ===================================== */
function drawHUD(){
  const S=SIM, i=clamp(Math.floor(S.idx),0,T.N-1);
  const u=H/900;                       // HUD scale unit
  ctx.save();
  // panel
  ctx.fillStyle='rgba(8,11,18,.55)';
  roundRect(18*u, H-208*u, 648*u, 186*u, 12*u); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1; roundRect(18*u,H-208*u,648*u,186*u,12*u); ctx.stroke();

  // speed
  const mph=S.v*2.23694, kmh=S.v*3.6;
  ctx.fillStyle='#f2f5fa'; ctx.textAlign='left';
  ctx.font=`300 ${64*u}px ui-sans-serif`; ctx.fillText(mph.toFixed(0), 40*u, H-118*u);
  ctx.font=`400 ${17*u}px ui-sans-serif`; ctx.fillStyle='rgba(220,230,244,.6)';
  ctx.fillText('mph', 40*u, H-94*u);
  ctx.fillText(kmh.toFixed(0)+' km/h', 40*u, H-70*u);
  // WHY the trail is about to demand a different speed: the tightest ceiling
  // in the next 35 m, named - corner, rock, sight line, or simply the dirt.
  // Its own pill ABOVE the panel, so the eye finds cause-and-effect instantly.
  { let jm=-1, vm=1e9;
    for(let j=i+2;j<Math.min(T.N-1,i+38);j++) if (PLAN.v[j]<vm){ vm=PLAN.v[j]; jm=j; }
    const slowing = jm>0 && vm < S.v+2.0;
    const sp= slowing? surfAt(jm, PLAN.n[jm]) : null;
    // the 3-wide min-filter often parks the minimum on an UNTAGGED neighbour
    // of the tagged station - look a couple of stations either side for the name
    let tagNear='';
    if (slowing) for(const dj of [0,1,-1,2,-2]){
      const jj=jm+dj; if (jj>0&&jj<T.N&&PLAN.tag[jj]){ tagNear=PLAN.tag[jj]; break; } }
    const surfCause = slowing && !tagNear;
    const cause= !slowing? 'trail open — carrying speed'
      : tagNear || (sp.rough>.32? 'rough '+SURFS[sp.id].name
                   : SURFS[sp.id].name + (sp.mu<.68? ' — low grip':''));
    const head= slowing? '▼ '+Math.round(vm*2.23694)+' mph': '';
    ctx.font=`600 ${15*u}px ui-sans-serif`;
    const wHead=head? ctx.measureText(head).width : 0;
    ctx.font=`500 ${14*u}px ui-sans-serif`;
    const wCause=ctx.measureText(cause).width;
    const pw3=wHead+wCause+(head?46:28)*u;
    ctx.fillStyle='rgba(8,11,18,.55)';
    roundRect(18*u, H-248*u, pw3, 32*u, 9*u); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
    roundRect(18*u, H-248*u, pw3, 32*u, 9*u); ctx.stroke();
    ctx.textAlign='left';
    if (head){ ctx.font=`600 ${15*u}px ui-sans-serif`; ctx.fillStyle='#ffd166';
      ctx.fillText(head, 32*u, H-226*u); }
    ctx.font=`500 ${14*u}px ui-sans-serif`;
    ctx.fillStyle= surfCause? SURFS[sp.id].col : (slowing? 'rgba(235,242,250,.85)':'rgba(220,230,244,.5)');
    ctx.fillText(cause, (head? 32+wHead/u+14 : 32)*u, H-226*u);
  }
  // grade with an explicit DIRECTION arrow - at gentle gradients the eye
  // cannot tell up from down, so the number says it (20u: sofa-read value)
  const gr=Math.tan(PLAN.thP[i]||0)*100;
  const sg=latSlope(i,S.n), camDeg=Math.abs(Math.atan(sg)/DEG);
  const camDir= T.bermH[i]>0? 'berm' : T.cupH[i]>0? 'cupped'
    : (Math.sign(sg)===T.uphill[i]? 'out':'in');
  ctx.font=`600 ${20*u}px ui-sans-serif`; ctx.fillStyle= gr<-.5? '#6fb7ff':'rgba(235,242,250,.9)';
  ctx.fillText((gr<-.5?'↑ ':'↓ ')+Math.abs(gr).toFixed(0)+'%', 40*u, H-46*u);
  ctx.font=`400 ${16*u}px ui-sans-serif`; ctx.fillStyle='rgba(220,230,244,.6)';
  ctx.fillText('camber '+camDeg.toFixed(0)+'° '+camDir, 40*u, H-22*u);

  // The tyre-grip circle. The ring is ALL the grip this surface offers at this
  // speed; the amber dot is how much is being spent, and in which direction -
  // sideways for cornering, downward for braking. Dot on the ring = sliding.
  const cx=238*u, cy2=H-116*u, R0=60*u;
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-R0*1.05,cy2); ctx.lineTo(cx+R0*1.05,cy2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy2-R0*1.05); ctx.lineTo(cx,cy2+R0*1.05); ctx.stroke();
  const capG=muEff(i,S.v,RUN.rider,S.n)*Math.cos(PLAN.thP[i]||0)*crestFactor(i,S.v);
  ctx.strokeStyle= S.sliding? '#ff5546':'rgba(120,220,160,.8)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy2,R0*Math.min(1.05,capG/1.1),0,TAU); ctx.stroke();
  const dx=clamp(-S.aLat/CONFIG.g/1.1,-1.05,1.05)*R0;
  const dyB=clamp(((S.brakeAf||0)+(S.brakeAr||0))/CONFIG.g/1.1,0,1.05)*R0;
  ctx.fillStyle=S.sliding? '#ff5546' : '#ffd166';
  ctx.beginPath(); ctx.arc(cx+dx,cy2+dyB,6*u,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(220,230,244,.6)'; ctx.font=`400 ${12*u}px ui-sans-serif`; ctx.textAlign='center';
  ctx.fillText('tire grip: ring = limit', cx, H-50*u);
  ctx.fillText('⟷ turning   ↓ braking', cx, H-34*u);

  // front / rear brake force, split by the live wheel loads, plus leg power.
  // Watch the split slide forward on steep ground and hard stops - and the
  // rear bar die entirely just before an endo would happen.
  bar(330*u, 'F', S.brakeAf/6.5, '#ff5546', null);
  bar(368*u, 'R', S.brakeAr/6.5, S.rearLight? '#ffd166':'#ff8a5c',
      S.rearLight? 'rear light!':null);
  bar(430*u, 'PWR', S.pedalW/RUN.rider.sprint, '#57e08f',
      S.pedalW>0? Math.round(S.pedalW)+'W':null);
  function bar(bx,label,frac,col,note){
    const bh=104*u, bw=24*u, by=H-178*u;
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=col; const h2=clamp(frac,0,1)*bh; ctx.fillRect(bx,by+bh-h2,bw,h2);
    ctx.fillStyle='rgba(220,230,244,.55)'; ctx.font=`400 ${12*u}px ui-sans-serif`; ctx.textAlign='center';
    ctx.fillText(label, bx+bw/2, H-56*u);
    if (note){ ctx.fillStyle='#ffe3b0'; ctx.fillText(note, bx+bw/2, by-6*u); }
  }
  ctx.fillStyle='rgba(220,230,244,.45)'; ctx.font=`400 ${11*u}px ui-sans-serif`; ctx.textAlign='center';
  ctx.fillText('brakes', 349*u, H-40*u);
  // lean dial - to the right of the power bar, with clear air between them
  const lx=572*u, ly=H-116*u, LR2=54*u;
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(lx,ly,LR2,Math.PI,0); ctx.stroke();
  const ph=clamp(S.lean,-1.1,1.1);
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=3*u;
  ctx.beginPath(); ctx.moveTo(lx,ly);
  // +lean = left turn = needle tips to the LEFT of the dial, matching the view
  ctx.lineTo(lx-Math.sin(ph)*LR2*.92, ly-Math.cos(ph)*LR2*.92); ctx.stroke();
  ctx.fillStyle='rgba(220,230,244,.55)'; ctx.font=`400 ${12*u}px ui-sans-serif`;
  ctx.fillText('lean '+Math.abs(ph/DEG).toFixed(0)+'°', lx, H-38*u);

  // surface chip: what the tyres are on, its friction, its rolling drag
  const sid=T.surf[i], sc=SURFS[sid];
  ctx.fillStyle=sc.col; roundRect(40*u, H-196*u, 16*u, 16*u, 3*u); ctx.fill();
  ctx.fillStyle='rgba(235,242,250,.85)'; ctx.textAlign='left'; ctx.font=`500 ${15*u}px ui-sans-serif`;
  ctx.fillText(sc.name+'   μ '+T.mu0[i].toFixed(2)+' · crr '+T.crr[i].toFixed(3), 64*u, H-183*u);

  /* Elevation profile. Taller than it was, and the line is coloured by LOCAL
     grade - Joe found the old thin white line read as one uniform ramp, and
     measuring it he was right: at 380x54 units against ~2 km x 300 m the
     vertical exaggeration was 0.86x, LESS than 1:1. Colour carries what
     geometry cannot: green mellow, amber steep, red plunging, and BLUE where
     the trail actually climbs (the momentum-turn ramps). The widget is a
     shape, not a table - the only numerals are the live clock and the
     vertical remaining, at sofa size. */
  const pw2=400*u, ph2=88*u, px2=W-pw2-30*u, py2=H-ph2-26*u;
  ctx.fillStyle='rgba(8,11,18,.55)'; roundRect(px2-12*u,py2-12*u,pw2+24*u,ph2+24*u,10*u); ctx.fill();
  if (!RUN.zSpan){ let lo=1e9,hi=-1e9;
    for(let k2=0;k2<T.N;k2++){ if(T.z[k2]<lo)lo=T.z[k2]; if(T.z[k2]>hi)hi=T.z[k2]; }
    RUN.zSpan=[lo, Math.max(1,hi-lo)]; }
  const zy=k2=>py2+(1-(T.z[k2]-RUN.zSpan[0])/RUN.zSpan[1])*ph2;
  ctx.lineWidth=2.6*u; ctx.lineCap='round';
  for(let k2=0;k2<T.N-6;k2+=6){
    const g2=Math.tan(T.theta[k2]);
    ctx.strokeStyle= g2<-.005? '#6fb7ff'      // climbing - the momentum-turn ramps
      : g2<.05? '#7ad38f' : g2<.11? '#e8e2c8'
      : g2<.19? '#ffb15e' : g2<.27? '#ff7a4d' : '#ff4436';
    ctx.beginPath(); ctx.moveTo(px2+k2/T.N*pw2, zy(k2));
    ctx.lineTo(px2+Math.min(k2+6,T.N-1)/T.N*pw2, zy(Math.min(k2+6,T.N-1))); ctx.stroke();
  }
  const fx2=px2+S.idx/T.N*pw2, fy2=zy(i);
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(fx2,fy2,6*u,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(8,11,18,.8)'; ctx.lineWidth=1.5*u;
  ctx.beginPath(); ctx.arc(fx2,fy2,6*u,0,TAU); ctx.stroke();
  ctx.fillStyle='rgba(235,242,250,.85)'; ctx.font=`500 ${20*u}px ui-monospace,Menlo,monospace`;
  ctx.textAlign='right';
  ctx.fillText(fmtTime(S.time)+'   '+Math.max(0,(T.z[i]-T.z[T.N-1])).toFixed(0)+' m to go', px2+pw2, py2-20*u);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ================= ticker: say what the rider is doing ================== */
let tickerHold=0, tickerAct='', tickerWhy='';
function updateTicker(dt){
  tickerHold-=dt;
  const S=SIM, i=clamp(Math.floor(S.idx),0,T.N-2);
  let act='', why='';
  // find the constraint we are currently riding toward
  let limIdx=-1;
  for(let k=i;k<Math.min(T.N-1,i+60);k++){ if (PLAN.v[k]<S.v-0.8){ limIdx=k; break; } }
  let limTag= limIdx>=0? (PLAN.tag[limIdx]||'') : '';
  // name the DIRT too when it is part of why the limit is what it is
  if (limTag && limIdx>=0){
    const spT=surfAt(limIdx, PLAN.n[limIdx]);
    if (spT.mu<.68) limTag += ' · '+SURFS[spT.id].name+' μ'+spT.mu.toFixed(2);
  }
  // a big rock just ahead is a SPOTLIGHT moment: name the choice being made
  let rockNear=null, rockDist=0;
  for(let k=0;k<16 && !rockNear;k++){
    const rl=T.rockBucket[i+k]; if (!rl) continue;
    for(const rk of rl) if (rk.kind!=='small' && rk.decided!==undefined){ rockNear=rk; rockDist=k; break; }
  }
  const cm=rockNear? Math.round(rockNear.h*100) : 0;
  if (S.sliding){ act='DRIFTING'; why='grip ran out — riding it out'; }
  else if (rockNear && rockDist<3 && rockNear.choice==='over'){
    act='ROLLING THE ROCK'; why=cm+' cm of rock under the wheels'; }
  else if (rockNear && rockNear.kind==='boulder'){
    act='PICKING A LINE'; why='around the boulder — far too big to roll'; }
  else if (rockNear && rockNear.choice==='over'){
    act='PICKING A LINE'; why= rockNear.dtCost!=null
      ? `over the ${cm} cm rock — around would cost +${rockNear.dtCost.toFixed(1)}s`
      : `squaring up — the ${cm} cm step spans the whole trail`; }
  else if (rockNear && rockNear.choice==='around'){
    act='PICKING A LINE'; why=`around the big rock — rolling ${cm} cm would cost +${(rockNear.dtCost||0).toFixed(1)}s`; }
  else if ((PLAN.thP[i]||0) < -.02){
    act='CLIMBING'; why= S.pedalW>RUN.rider.cp*.6? 'digging in — a short rise'
      : 'momentum is paying for the rise'; }
  else if (S.brakeF>.75){ act='HARD ON THE BRAKES'; why=limTag? 'setting up for '+limTag : ''; }
  else if (S.brakeF>.2 && Math.abs(S.aLat)>2.5){ act='TRAIL-BRAKING'; why=limTag? 'easing into '+limTag:''; }
  else if (S.brakeF>.2){ act='BRAKING'; why=limTag? 'for '+limTag : (RUN.mode==='onsight'&&PLAN.tag[Math.min(T.N-1,limIdx<0?i:limIdx)]==='sight line ends ahead'?'can’t see past the corner':''); }
  else if (S.pedalW>RUN.rider.cp+60){ act='SPRINTING'; why='open trail — free speed'; }
  else if (S.pedalW>40){ act='PEDALING'; why='adding speed while it’s cheap'; }
  else if (S.posture==='tuck'){ act='TUCKED'; why='nothing to do but be small'; }
  else if (Math.abs(S.aLat)>4.5 && T.bermH[i]>0){ act='RAILING THE BERM'; why='the bank is holding the speed'; }
  else if (Math.abs(S.aLat)>4.5){ act='LEANED OVER'; why='carrying speed through '+(PLAN.kapP[i]>0?'a left':'a right'); }
  else { act='OFF THE BRAKES'; why='letting the hill do the work'; }
  if (tickerHold<=0 && (act!==tickerAct||why!==tickerWhy)){
    tickerAct=act; tickerWhy=why; tickerHold=.8;
    document.querySelector('#ticker .act').textContent=act;
    document.querySelector('#ticker .why').textContent=why;
  }
}

/* ====================== run manager + cards ============================= */
const whoEl=document.getElementById('who'), cardEl=document.getElementById('card');
const capEl=document.querySelector('#caption .params');

function newRun(opts={}){
  const seed = opts.seed ?? (Q.get('seed') && !RUN ? Q.get('seed') : String((Math.random()*1e9)|0));
  let riderKey = opts.rider ?? (Q.get('rider') && !RUN ? Q.get('rider') : (Math.random()<.5?'pro':'weekend'));
  if (!(riderKey in RIDERS)) riderKey='pro';
  let mode = opts.mode ?? (Q.get('mode') && !RUN ? Q.get('mode') : (Math.random()<.5?'known':'onsight'));
  if (mode!=='known'&&mode!=='onsight') mode='known';
  const rider=RIDERS[riderKey];

  T=genTrail(String(seed));
  genBackdrop();
  // planner: full solve for "knows the trail"; on-sight starts with a centreline
  // guess (it will replan from sight as it rides) but needs SOMETHING for frame 1
  const t0=performance.now();
  PLAN=planFull(rider);
  const planMs=performance.now()-t0;
  if (mode==='onsight'){
    // wipe the omniscient speed plan; the rider will replan from sight as they go
    const blind=planSpeed(rider, PLAN.n, 0, Math.max(20,Math.round(T.sight[0])), 0, rider.blindV, true);
    for(let k=0;k<=blind.i1;k++){ PLAN.v[k]=blind.v[k]; PLAN.act[k]=blind.act[k]; PLAN.tag[k]=blind.tag[k]; }
  }
  const predicted=mode==='known'? PLAN.time : null;

  RUN={ seed:String(seed), riderKey, rider, mode, state:'intro', clock:0,
        predicted, planMs, frame:0, dtFrame:0, treeIdx:new Map(), stats:null };
  for(const tr of T.trees){ const b=RUN.treeIdx.get(tr.i)||[]; b.push(tr); RUN.treeIdx.set(tr.i,b); }
  SIM=makeSim(rider,mode);
  dust.length=0; skids.length=0;
  CAM.ready=false;
  clearTimeout(deadlineTimer);
  deadlineTimer=setTimeout(()=>{
    /* Same fallback as the end-of-run hand-off: build_github.py empties
       nextPage for the published copy, and a standalone page that has hung
       still wants rescuing - it just starts again instead of moving on. */
    if (PINNED) return;
    if (CONFIG.nextPage) location.href=CONFIG.nextPage; else location.reload();
  }, CONFIG.runDeadline);
  /* The ticker keeps a SHADOW of what it last wrote, so it only touches the
     DOM when the narration actually changes. That shadow is module-level and
     survives a new run, while the finish branch blanks the DOM text - so if a
     fresh run opened on the same line the old one closed with, the comparison
     said "no change", the write was skipped, and the narration stayed empty
     until the rider happened to do something different. Only reachable in the
     ?pin loop, which is exactly where anyone tuning this sits and watches. */
  tickerHold=0; tickerAct=''; tickerWhy='';

  // chips
  whoEl.innerHTML=
    `<div class="chip"><span class="dot" style="background:${rider.col}"></span>${rider.label}</div>`+
    `<div class="chip"><span class="dot" style="background:${mode==='known'?'#ffd166':'#9aa7ff'}"></span>`+
    (mode==='known'?'KNOWS THE TRAIL':'RIDING ON-SIGHT')+`</div>`;
  capEl.textContent=`${T.name} · ${(T.totLen/1000).toFixed(1)} km · ${T.totDrop.toFixed(0)} m of descent · seed ${seed}`;
  showIntroCard();
  console.log(`[descent] seed ${seed}  ${riderKey}/${mode}  len ${(T.totLen/1000).toFixed(2)} km`+
    `  drop ${T.totDrop.toFixed(0)} m  plan ${planMs.toFixed(0)} ms`+
    (predicted? `  predicted ${fmtTime(predicted)}`:''));
}

function surfBreakdown(){
  const tot=new Array(SURFS.length).fill(0);
  for(let i=0;i<T.N;i++) tot[T.surf[i]]++;
  return tot.map((c,id)=>({id, frac:c/T.N})).filter(s=>s.frac>.02);
}
function drawCardMap(canvas, colorBySpeed){
  const c2=canvas.getContext('2d'), w2=canvas.width=460, h2=canvas.height=250;
  let xmin=1e9,xmax=-1e9,ymin=1e9,ymax=-1e9;
  for(let i=0;i<T.N;i++){ xmin=Math.min(xmin,T.x[i]); xmax=Math.max(xmax,T.x[i]);
    ymin=Math.min(ymin,T.y[i]); ymax=Math.max(ymax,T.y[i]); }
  const sc=Math.min((w2-30)/(xmax-xmin||1),(h2-30)/(ymax-ymin||1));
  const mx=i=>15+(T.x[i]-xmin)*sc + (w2-30-(xmax-xmin)*sc)/2;
  const my=i=>h2-15-(T.y[i]-ymin)*sc - (h2-30-(ymax-ymin)*sc)/2;
  if (colorBySpeed){
    for(let i=1;i<T.N;i++){
      const v=PLAN.v[i], f2=clamp((v-3)/14,0,1);
      c2.strokeStyle=`rgb(${Math.round(90+165*f2)},${Math.round(160-40*f2)},${Math.round(220-160*f2)})`;
      c2.lineWidth=2.2; c2.beginPath(); c2.moveTo(mx(i-1),my(i-1)); c2.lineTo(mx(i),my(i)); c2.stroke();
    }
  } else {
    c2.strokeStyle='rgba(230,238,248,.5)'; c2.lineWidth=2; c2.setLineDash([5,5]);
    c2.beginPath(); for(let i=0;i<T.N;i+=3) i?c2.lineTo(mx(i),my(i)):c2.moveTo(mx(i),my(i));
    c2.stroke(); c2.setLineDash([]);
  }
  c2.fillStyle='#57e08f'; c2.beginPath(); c2.arc(mx(0),my(0),5,0,TAU); c2.fill();
  c2.fillStyle='#ff5546'; c2.beginPath(); c2.arc(mx(T.N-1),my(T.N-1),5,0,TAU); c2.fill();
}
function showIntroCard(){
  const avgGr=(T.totDrop/T.totLen*100);
  const sb=surfBreakdown();
  cardEl.innerHTML=`<div class="pk">${T.name}</div>
    <div class="sub">${(T.totLen/1000).toFixed(1)} km · ${T.totDrop.toFixed(0)} m of descent · avg ${avgGr.toFixed(0)}% · ${T.rocks.filter(r=>r.kind!=='small').length} big rocks</div>
    <div class="rows">${RUN.rider.label.toLowerCase()} · ${RUN.mode==='known'
      ? 'has ridden this trail — full line planned\npredicted time '+fmtTime(RUN.predicted)
      : 'has never seen this trail\nwill ride only as fast as the sight line allows'}${
      T.bId.some(v=>v!==255)? '\nsurfaces run in clean bands at first, then mix into stripes and patches':''}</div>
    <div class="surfbar">${sb.map(s=>`<div style="flex:${s.frac};background:${SURFS[s.id].col}"></div>`).join('')}</div>
    <div class="surfkey">${sb.map(s=>SURFS[s.id].name+' '+(s.frac*100).toFixed(0)+'%').join(' · ')}</div>
    <canvas></canvas>`;
  drawCardMap(cardEl.querySelector('canvas'), RUN.mode==='known');
  cardEl.classList.add('show');
}
function showFinishCard(){
  const S=SIM, tot=S.time;
  const pct=x=>(100*x/Math.max(.01,S.tBrake+S.tPedal+S.tCoast)).toFixed(0)+'%';
  cardEl.innerHTML=`<div class="pk">${fmtTime(tot)}</div>
    <div class="sub">${T.name} · ${RUN.rider.label.toLowerCase()} · ${RUN.mode==='known'?'knew the trail':'rode it on sight'}${
      RUN.predicted? ' · plan said '+fmtTime(RUN.predicted):''}</div>
    <div class="rows">avg ${(S.distance/tot*2.23694).toFixed(1)} mph  (${(S.distance/tot*3.6).toFixed(1)} km/h)
top ${(S.maxV*2.23694).toFixed(0)} mph · max lean ${(S.maxLean/DEG).toFixed(0)}°
braking ${pct(S.tBrake)} · pedaling ${pct(S.tPedal)} · coasting ${pct(S.tCoast)}
slides ${S.slides}</div>
    <canvas></canvas>`;
  drawCardMap(cardEl.querySelector('canvas'), true);
  cardEl.classList.add('show');
}

/* countdown paint (over the world, no DOM) */
function drawCountdown(){
  const left=CONFIG.countSec - (RUN.clock-CONFIG.introSec);
  const nnn=Math.ceil(left);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(245,248,252,.95)'; ctx.textAlign='center';
  ctx.font=`200 ${H*.3}px ui-sans-serif`;
  ctx.fillText(nnn>0? String(nnn):'GO', W/2, H/2+H*.1);
}

/* =========================== main loop ================================== */
let paused=false, last=performance.now();
const TS = Q.get('ts')? +Q.get('ts') : 1;
function frame(now){
  const dtReal=Math.min(.1,(now-last)/1000); last=now;
  const dt=paused?0:dtReal*TS;
  RUN.frame++; RUN.dtFrame=dtReal;
  RUN.clock+=dt;

  if (RUN.state==='intro'){
    // hold on the start; the card carries the information
    updateCamera(dtReal*.4);
    if (RUN.clock>=CONFIG.introSec){ RUN.state='count'; }
  } else if (RUN.state==='count'){
    updateCamera(dtReal);
    if (RUN.clock>=CONFIG.introSec+CONFIG.countSec){
      RUN.state='run'; cardEl.classList.remove('show');
    }
  } else if (RUN.state==='run'){
    // fixed physics steps; render at whatever rate the machine gives us
    const steps=Math.max(1,Math.round(dt/(1/120)));
    for(let k=0;k<steps;k++) stepSim(dt/steps);
    updateCamera(dtReal);
    updateTicker(dtReal);
    if (SIM.done){ RUN.state='finish'; RUN.finishAt=RUN.clock; showFinishCard();
      document.querySelector('#ticker .act').textContent='';
      document.querySelector('#ticker .why').textContent='';
      console.log(`[descent] finished ${fmtTime(SIM.time)}  avg ${(SIM.distance/SIM.time*3.6).toFixed(1)} km/h  slides ${SIM.slides}`);
    }
  } else if (RUN.state==='finish'){
    updateCamera(dtReal*.3);
    if (RUN.clock-RUN.finishAt>=CONFIG.finishSec){
      if (!PINNED){
        /* An EMPTY nextPage means there is nowhere to hand on to, which is
           what build_github.py leaves behind when it cuts a page out of the
           rotation for publishing. Start again instead. */
        if (CONFIG.nextPage) location.href=CONFIG.nextPage; else location.reload();
        return;
      }
      cardEl.classList.remove('show');
      setTimeout(()=>newRun(), 60);
    }
  }

  drawBackdrop();
  drawWorld();
  if (RUN.state==='run'||RUN.state==='finish') drawHUD();
  if (RUN.state==='count') drawCountdown();
  updateInfo(dtReal);
  requestAnimationFrame(frame);
}

let fpsAcc=0,fpsN=0,fpsShow=0;
function updateInfo(dt){
  fpsAcc+=dt;fpsN++;
  if (fpsAcc>.5){ fpsShow=fpsN/fpsAcc; fpsAcc=0;fpsN=0; }
  if (!document.body.classList.contains('showinfo')) return;
  const i=clamp(Math.floor(SIM.idx),0,T.N-1);
  document.getElementById('info').textContent=
`seed ${RUN.seed}  ${RUN.riderKey}/${RUN.mode}  cam ${camMode}
fps ${fpsShow.toFixed(0)}  plan ${RUN.planMs.toFixed(0)} ms
v ${ (SIM.v*3.6).toFixed(1) } km/h  μ ${T.mu0[i].toFixed(2)}  rough ${T.rough[i].toFixed(2)}
sight ${T.sight[i].toFixed(0)} m  slides ${SIM.slides}
t ${fmtTime(SIM.time)}${RUN.predicted? '  pred '+fmtTime(RUN.predicted):''}
keys: n new · m other mode · r other rider · c cam · p pause · t self-test`;
}

/* ====================== physics self-test (t) =========================== */
/* Analytic checks the sim must not drift away from. Results go to the
   console and are summarised in the info overlay. */
function selfTest(){
  const out=[];
  const g=CONFIG.g;
  // 1) braking distance, flat hardpack, from 40 km/h
  { const mu=.85, v0=40/3.6, aEndo=endoCap(POSTURE.brake,0)*.95;
    const a=Math.min(mu*g, aEndo), dAn=v0*v0/(2*a);
    let v=v0,d=0; while(v>0.1){ v-=Math.min(mu*g,aEndo)* .002; d+=v*.002; }
    out.push(['braking 40 km/h hardpack', dAn.toFixed(1)+' m', d.toFixed(1)+' m',
              Math.abs(d-dAn)/dAn<.08]); }
  // 2) cornering ceiling r=6 m flat hardpack
  { const mu=.85*.95, r=6, vAn=Math.sqrt(mu*g*r);
    out.push(['corner r=6m hardpack', (vAn*3.6).toFixed(1)+' km/h','(formula)',
              vAn>6.0&&vAn<8.0]); }
  // 3) terminal speed, 15% slab, tucked - raw drag physics, before the
  //    rough-ground control ceiling caps what a human can actually hold
  { const m=93.5, cda=POSTURE.tuck.cda, th=Math.atan(.15);
    let v=5; for(let k=0;k<8000;k++){ const a=g*Math.sin(th)-.5*CONFIG.rho*cda*v*v/m-.008*g*Math.cos(th); v+=a*.01; }
    const ctrl=CONFIG.vmaxAbs*(1-SURFS[6].rough*.55)*3.6;
    out.push(['terminal 15% slab (drag-only '+(v*3.6).toFixed(0)+')',
              'ridden cap '+ctrl.toFixed(0)+' km/h','expect 75-85', ctrl>74&&ctrl<86]); }
  // 4) whole-run averages across seeds (plan integral, pro/known)
  { const keep={T,PLAN,RUN,SIM};
    let ok=true, note=[];
    for(const s of ['101','202','303']){
      T=genTrail(s); const p=planFull(RIDERS.pro);
      const avg=T.totLen/p.time*3.6; note.push(avg.toFixed(0));
      if (avg<14||avg>42) ok=false;
    }
    ({T,PLAN,RUN,SIM}=keep);
    out.push(['run avg speed seeds 101/202/303', note.join('/')+' km/h','expect 14-42',ok]); }
  /* 5) THE PITCH-OVER CAP MUST DEPEND ON THE SLOPE ONLY THROUGH cos(th).

     This one exists because of a bug that lived here undetected. endoCap
     returned the limit on NET deceleration while all three of its callers used
     it as a limit on BRAKE FORCE, so gravity came off twice and the rider was
     held to 29% less braking than the bike has on a 25% grade.

     Note what does NOT catch it: asserting that the wheel-load split reaches
     zero rear load exactly at endoCap. That invariant held perfectly the whole
     time, because the load split carried the same spurious sin(th) - the two
     were consistently wrong together, which is precisely why nobody noticed.
     It takes an INDEPENDENT statement of the physics to find it, and this is
     one: moments about the front contact patch leave the brake-force cap
     proportional to the normal load and nothing else, so dividing it by
     cos(th) has to give the same number on every gradient. */
  { const post=POSTURE.brake, th=Math.atan(.25);
    const flat=endoCap(post,0), steep=endoCap(post,th)/Math.cos(th);
    out.push(['endo cap varies with cos(slope) only',
              flat.toFixed(2)+' m/s\u00B2', steep.toFixed(2)+' m/s\u00B2',
              Math.abs(flat-steep)<1e-6]); }

  console.table(out.map(o=>({test:o[0], expected:o[1], got:o[2], pass:o[3]})));
  const fails=out.filter(o=>!o[3]).length;
  console.log(`[descent] self-test: ${out.length-fails}/${out.length} passed`);
  return out;
}
/* headless run for tuning: plan-time for any seed/rider/mode (mode 'known' only) */
window.simulateHeadless=function(seed, riderKey){
  const keep={T,PLAN};
  T=genTrail(String(seed));
  const p=planFull(RIDERS[riderKey]);
  const res={seed, rider:riderKey, len:T.totLen, drop:T.totDrop, time:p.time,
    avgKmh:T.totLen/p.time*3.6, maxKmh:Math.max(...p.v)*3.6};
  ({T,PLAN}=keep);
  return res;
};

/* ============================ keys ====================================== */
addEventListener('keydown',(e)=>{
  switch(e.key){
    case 'i': case 'I': document.body.classList.toggle('showinfo'); break;
    case 'n': case 'N': newRun(); break;
    case 'm': case 'M': newRun({seed:RUN.seed, rider:RUN.riderKey,
      mode:RUN.mode==='known'?'onsight':'known'}); break;
    case 'r': case 'R': newRun({seed:RUN.seed, mode:RUN.mode,
      rider:RUN.riderKey==='pro'?'weekend':'pro'}); break;
    case 'c': case 'C': camMode=CAMMODES[(CAMMODES.indexOf(camMode)+1)%CAMMODES.length]; break;
    case 'p': case 'P': case ' ': paused=!paused; break;
    case 't': case 'T': selfTest(); break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    default:
      /* The same rating stub the other pages carry, so a score pressed on the
         remote lands in the log with the seed that produced it - which is the
         only way to get back to a run worth keeping. */
      if (/^[0-9]$/.test(e.key)){
        const score = e.key === '0' ? 10 : parseInt(e.key, 10);
        console.log('[descent] RATING STUB - score', score, 'seed', RUN && RUN.seed,
                    RUN && RUN.riderKey, RUN && RUN.mode);
      }
  }
});

newRun();
requestAnimationFrame(frame);
