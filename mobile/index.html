   timestamp while the physics advanced on a clamped step, so the two clocks
   drifted apart whenever frames were slow - and anything that happens in a
   NARROW window of wind time, like the single puff in ?demo, could be stepped
   clean over. That is exactly what happened: the numbers said every rod should
   turn 75 degrees in nine seconds and the screen showed nothing at all, because
   the frame that should have delivered the puff jumped from before it to after.
   Now the wind is asked what it is doing at the simulation's own time, which is
   the only clock the mobile actually lives on. */
let last = 0, simT = 0, pan = 0, panReady = false;
function rootRX(){ return root.sx * fit.s; }
function rootRY(){
  const drop = Math.sqrt(Math.max(0,
        root.thread*root.thread - root.sx*root.sx - root.sz*root.sz));
  return (drop - root.thread) * fit.s;
}
function frame(ms){
  const t = ms / 1000;
  // CLAMPED AT BOTH ENDS. It used to be clamped only from above, so anything
  // that made the timestamp go backwards produced a NEGATIVE step - which ran
  // the physics in reverse and, once the view could pan, threw the mobile clean
  // off the screen. A step is never less than nothing.
  /* AND FROZEN ONCE ?at HAS ARRIVED. Pre-stepping the physics to ?at fixed
     where the capture STARTS, then handed the page to the animation clock,
     which kept stepping for however many frames the capture happened to allow:
     two screenshots of the same ?at differed in 28,102 pixels, which is enough
     to swamp any before-and-after you try to measure with them. A capture is a
     still, so it holds still. */
  const dt = AT_FREEZE ? 0 : Math.max(0, Math.min(0.05, last ? t - last : 0.016));
  last = t;

  // physics in fixed sub-steps: a dropped frame must not launch the mobile
  for (let left = dt; left > 1e-6; ){
    const h = Math.min(0.008, left); left -= h;
    simT += h;
    const push = stepWind(h, simT);
    locate(root, 0, 0, 0);                 // where everything is, for the cone
    stepBob(h, push * coverage());
    stepNode(root, h, 0, bobA, 0);
  }

  const air = ctx.createLinearGradient(0, 0, 0, H);
  for (const [u, c] of AIR_STOPS) air.addColorStop(u, 'rgb(' + c.join(',') + ')');
  ctx.fillStyle = air; ctx.fillRect(0, 0, W, H);
  // NO TITLE (Joe, 2026-09-16). The credit stays - it is an attribution, not a
  // heading. The line that went with the title said what the piece is doing
  // ("every animal cut the same size, every rod balanced by real mass"); if it
  // is wanted back it belongs in an episode beat, not printed in the corner.
  // the credit belongs to the animals; a fleet of boats borrows nothing
  if (MODE !== 'boats'){
    ctx.fillStyle = '#5c5952'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '26px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.fillText('silhouettes: PhyloPic, public domain', 72, H - 44);
  }

  if (DEMO){            // the page saying what it thinks it is doing
    ctx.fillStyle = '#9ad1ff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = '22px Menlo, monospace';
    const rs = [];
    (function walk(n){ if(!n.leaf){ rs.push(n); walk(n.a); walk(n.b); } })(root);
    ctx.fillText('simT ' + simT.toFixed(2) + '   frameT ' + t.toFixed(2) +
                 '   wind.mag ' + wind.mag.toFixed(3) +
                 '   dir ' + (wind.dir*180/Math.PI).toFixed(0), 72, 180);
    ctx.fillText('th  ' + rs.map(n => (n.th*180/Math.PI).toFixed(0)).join('  '), 72, 208);
    ctx.fillText('om  ' + rs.map(n => n.om.toFixed(3)).join('  '), 72, 236);
    ctx.fillText('sz  ' + rs.map(n => n.sz.toFixed(0)).join('  '), 72, 264);
  }

  /* KEEP IT ON THE GLASS. The scale comes from the mobile's resting pose, in
     which each rod's first child hangs to the LEFT. Turn every rod half a
     revolution and the whole cascade mirrors, reaching as far right as it used
     to reach left - so the fitted box is simply the wrong box, and by a hundred
     seconds the bottom of the mobile had walked off the right-hand edge.
     Rather than shrink everything to the worst case the mobile can ever reach
     (which is nearly twice as wide, and would cost 40% of its size for a pose
     it is rarely in), the view PANS to follow it: the scale never changes, so
     nothing about the drawing lies, and the framing drifts on a five-second
     time constant, slower than the mobile moves and far slower than the eye. */
  const items0 = [];
  collect(root, rootRX(), rootRY(), root.sz * fit.s, fit.s, items0, 1, 0);
  let bx0 = 1e9, bx1 = -1e9;
  for (const it of items0){
    const half = it.kind === 'card' ? cardBox(it.node.name).w * fit.s / 2 : 0;
    bx0 = Math.min(bx0, it.x - half); bx1 = Math.max(bx1, it.x + half);
  }
  const want = (bx0 + bx1) / 2;
  // the first frame SNAPS - easing from zero would slide the mobile across the
  // screen on every load, and after a ?at jump it would still be sliding
  if (!panReady){ pan = want; panReady = true; }
  else pan += (want - pan) * (1 - Math.exp(-dt / 5));

  if (location.search.indexOf('probe') >= 0){
    ctx.fillStyle = '#9ad1ff'; ctx.font = '20px Menlo, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('cast: ' + MAMMALS.map(m => m.name).join(', '), 40, 40);
    ctx.fillText('fit.s ' + fit.s.toFixed(4) + '  fit.x ' + fit.x.toFixed(0) +
                 '  fit.y ' + fit.y.toFixed(0) + '  pan ' + pan.toFixed(0), 40, 68);
    ctx.fillText('items ' + items0.length + '  artPending ' + artPending +
                 '  bx ' + bx0.toFixed(0) + '..' + bx1.toFixed(0), 40, 96);
    ctx.fillText('arms ' + (function f(n){ return n.leaf ? '' :
        (' ' + n.da.toFixed(0) + '/' + n.db.toFixed(0) + f(n.a) + f(n.b)); })(root), 40, 124);
    const revs = [], twists = [];
    (function f(n){ if (n.leaf) twists.push(((n.swept||0)/(2*Math.PI)).toFixed(2));
                    else { revs.push(((n.swept||0)/(2*Math.PI)).toFixed(2)); f(n.a); f(n.b); } })(root);
    ctx.fillText('rods turned  (revs in ' + simT.toFixed(0) + ' s): ' + revs.join('  '), 40, 152);
    ctx.fillText('hulls turned (revs in ' + simT.toFixed(0) + ' s): ' + twists.join('  '), 40, 180);
  }

  const bobPx = bob * fit.s;
  ctx.save(); ctx.translate(fit.x - pan, fit.y + bobPx);

  // the thread down from the ceiling. Its top is fixed up there, so it grows
  // and shortens as the piece rides - which is the bob made visible.
  ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.72 * RIG_VIS;
  ctx.lineWidth = Math.max(0.8, 1.7 * fit.s);
  // the ceiling anchor is FIXED; the mobile is what moves, so this thread
  // leans over as the piece swings and shortens as it rides up
  const rx = rootRX(), ry = rootRY();
  ctx.beginPath();
  ctx.moveTo(0, -(CEILING * fit.s + bobPx)); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.globalAlpha = 1;

  const items = items0;
  // cards must be painted once to learn their drawn height before their labels
  // can be placed under them, so the pass runs: measure, place, then sort the
  // whole lot - boards, rods and labels together - and paint back to front
  for (const it of items) if (it.kind === 'card') measureCard(it);
  if (MODE !== 'boats')
    items.push(...placeLabels(items.filter(i => i.kind === 'card'), fit.s, fit.y + bobPx));
  items.sort((p, q) => q.z - p.z);          // far first
  for (const it of items) paint(it);
  ctx.restore();

  /* Hand on when the ring's minutes are up - unless the viewer has pinned the
     page, in which case it stays until they say otherwise. */
  if (!PINNED && window.Wall && Wall.holdMs &&
      performance.now() - startedAt > Wall.holdMs(CONFIG.minutes)) {
    location.href = Wall.nextPage(CONFIG.nextPage);
    return;
  }

  requestAnimationFrame(frame);
}
const startedAt = performance.now();

/* ---- deterministic capture (mobile.html?at=9) --------------------------
   Headless Chrome will not run this page forward. Every screenshot, at any
   --virtual-time-budget from three seconds to five minutes, came back at
   simT ~0.6 s: the frames I was comparing differed only because each page load
   starts its rods at random angles, not because time had passed. So the page
   can be asked to advance its own physics, in the same fixed steps it uses
   normally, before it draws anything. ?at=9 means "show me nine seconds in",
   and it means it exactly - same answer every time, which a rAF-driven capture
   could never give. */
const AT = parseFloat((location.search.match(/[?&]at=([\d.]+)/) || [])[1]);
const AT_FREEZE = isFinite(AT) && AT > 0;  // a capture holds the pose it asked for
resize();
if (isFinite(AT) && AT > 0){
  for (let n = Math.round(AT / 0.008); n > 0; n--){
    simT += 0.008;
    const push = stepWind(0.008, simT);
    locate(root, 0, 0, 0);
    stepBob(0.008, push * coverage());
    stepNode(root, 0.008, 0, bobA, 0);
  }
  // last stays 0: it belongs to the ANIMATION clock, and simT is the
  // simulation's. Setting one from the other made the first frame's step
  // t - last come out at minus fifteen seconds.
}
requestAnimationFrame(frame);
</script>
