<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite Flying</title>
<link rel="stylesheet" href="wall.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 1.5s ease; pointer-events: none; }
  /* the readings ride in the wall's credit line (Joe: "like the font and
     format we use for the credits ... If I want to read this, I'll get off
     the couch"): .signature, bottom left, no plate */
  #readout { transition: opacity .6s ease; }
  body.showabout #readout { opacity: 0; }
</style>
<script src="wall.js"></script>
<script src="nav.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="readout" class="signature"></div>
<div id="fade"></div>
<script src="three.min.js"></script>
<script src="kite_engine.js"></script>
<script>
'use strict';
/* ==========================================================================
  kite.html · v0.2 · 2026-10-10

  A person flying a kite in a big grassy field under a blue sky with puffy
  clouds (Joe, 2026-10-10). The wind shifts in strength and direction; the
  flyer manages: pulls the kite up off the grass, lets out line as it
  climbs, takes line in when it sinks, runs in a lull, fetches it when it
  comes down. With the two-line delta the flyer pulls one hand or the other
  to turn it: passes across the wind, loops, dives. Some scenes have a tree
  downwind that eats kites. No text on screen; the up key's card says what
  is happening, and left/right on it choose the kite. Along the bottom, in
  the wall's credit line, the wind, the pull, the line out, the kite's
  height and what the flyer is doing (unless it is just flying it).

  THE PHYSICS is kite_engine.js (wind with gusts carried downwind, a kite of
  rigid frame and flat-plate sails, lines and tails as chains of masses,
  and the flyer's decisions). This page only draws it, and the grass shows
  the same gust field the kite flies in, so a gust ruffles the grass near
  the flyer a few seconds before it reaches the kite.

  EACH SCENE DRAWS the kite (diamond, two-line delta or dragon, unless one
  was chosen; the box kite waits, as Joe asked), the wind (4.5-8.5 m/s at
  10 m; the dragon 5.5-8.5), the line length (20-32 m single, 18-25 m two), the flyer's clothes, where the sun is, the
  camera's angle around the flyer (from behind, looking downwind at the
  kite, to side on), and in about a third of scenes a tree 22-40 m away to
  one side of the downwind line; the wind is then a little more likely to
  shift toward it.

  THE CAMERA stands 6-15 m from the flyer, a person's height or a little
  more off the grass, at the scene's angle around them, and zooms (34-72
  deg) to keep the flyer and the kite in frame: quickly wider, slowly
  closer, and ahead of a climbing kite. It backs off only if 72 deg is not
  enough. For the two-line kite it frames the whole wind window, so it does
  not chase the stunts. A close camera keeps the flyer big enough to see
  them run and pull.

  SHADOWS on the grass are worked in the shaders: the flyer's limbs and the
  kite as capsules projected along the sun, the tree's crown as ellipses.

  URL: ?seed=S repeats scenes · ?pin stays · ?solo=N holds the wall N min ·
       ?rs=0.5 draws smaller · ?kite=diamond|delta · ?tree=on|off · ?wind=6 ·
       ?off=blades,ground,sky,clouds,far,trees leaves parts out · ?gputest
       adds them one at a time (for finding what a GPU dislikes)

  CHANGED
    v0.2  Joe: kites bigger and lines shorter, the line white and finer, the
          readings along the bottom in the credit line (mph, feet, pounds),
          the dragon added as a Chinese centipede (discs, sticks, feathers,
          whiskers), the kite chosen from the card (left/right while open)
    v0.1  first draft: diamond and two-line delta, the tree in some scenes
========================================================================== */

const CONFIG = { holdMin: 6, nextPage: '' /* standalone: nowhere to hand on to; start again */, sceneSec: 170 };
const Q = new URLSearchParams(location.search);
const PINNED = Q.has('pin');
const SOLO_MIN = parseFloat(Q.get('solo') || '0');
const STANDALONE = !CONFIG.nextPage;                 // the GitHub build empties nextPage
const DPR = STANDALONE ? Math.min(2, window.devicePixelRatio || 1) : 1;
const RS = Math.min(1, Math.max(0.3, parseFloat(Q.get('rs') || (STANDALONE ? '1' : '0.5'))));
const SEED0 = Q.has('seed') ? parseInt(Q.get('seed'), 10) : (Date.now() % 1e9);
const E = KiteEngine;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lin = (r, g, b) => new THREE.Color().setRGB(Math.pow(r / 255, 2.2), Math.pow(g / 255, 2.2), Math.pow(b / 255, 2.2));

/* ------------------------------------------------------------- renderer */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: STANDALONE, powerPreference: 'high-performance' });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 9000);

/* everything the hand-written shaders share */
const V2 = () => new THREE.Vector2(), V4 = () => new THREE.Vector4();
const U = {
  sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color(1, 1, 1) }, skyAmb: { value: new THREE.Color(0.3, 0.35, 0.45) },
  zenith: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, haze: { value: new THREE.Color() }, fogD: { value: 1600 },
  gK: { value: Array.from({ length: 8 }, V4) }, gA: { value: Array.from({ length: 8 }, V2) }, gAdv: { value: V2() },
  gW: { value: V4() }, gT: { value: 0 },
  shSeg: { value: Array.from({ length: 16 }, V4) }, shRad: { value: Array.from({ length: 16 }, V2) },
  shEll: { value: Array.from({ length: 14 }, V4) }, sunStretch: { value: new THREE.Vector3(1, 0, 1) },
  shBox: { value: V4() }, ellBox: { value: V4() },
  res: { value: V2() },
};
const GLSL_COMMON = `
  uniform vec3 sunDir, sunCol, skyAmb, zenith, horizon, haze; uniform float fogD;
  uniform vec4 gK[8]; uniform vec2 gA[8]; uniform vec2 gAdv; uniform vec4 gW; uniform float gT;
  uniform vec4 shSeg[16]; uniform vec2 shRad[16]; uniform vec4 shEll[14]; uniform vec3 sunStretch; uniform vec4 shBox, ellBox;
  /* the along-wind gust at a point near the grass, m/s (the engine's own field) */
  float gustAt(vec2 p, float y) {
    vec2 q = p - gAdv; float s = 0.0;
    for (int i = 0; i < 8; i++) s += gA[i].x * sin(gK[i].x * q.x + gK[i].y * q.y + gK[i].z * y + gK[i].w + gA[i].y * gT);
    return s * gW.z;
  }
  float segDist(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
    return length(pa - ba * h);
  }
  /* shadow on the ground: the flyer and kite as projected capsules, the
     tree's crown as ellipses stretched away from the sun */
  float shadowAt(vec2 p) {
    float s = 0.0;
    /* most of the field is far from any shadow: test the boxes first */
    if (p.x > shBox.x && p.y > shBox.y && p.x < shBox.z && p.y < shBox.w)
    for (int i = 0; i < 16; i++) {
      vec2 rr = shRad[i]; if (rr.x <= 0.0) continue;
      float d = segDist(p, shSeg[i].xy, shSeg[i].zw);
      s = max(s, (1.0 - smoothstep(rr.x - rr.y, rr.x + rr.y, d)));
    }
    vec2 ax = sunStretch.xy, ay = vec2(-ax.y, ax.x);
    if (p.x > ellBox.x && p.y > ellBox.y && p.x < ellBox.z && p.y < ellBox.w)
    for (int i = 0; i < 14; i++) {
      vec4 e = shEll[i]; if (e.z <= 0.0) continue;
      vec2 q = p - e.xy; float d = length(vec2(dot(q, ax) / sunStretch.z, dot(q, ay)));
      s = max(s, 0.9 * (1.0 - smoothstep(e.z - e.w, e.z + e.w, d)));
    }
    return s;
  }
  vec3 fogged(vec3 c, float d) { return mix(c, haze, 1.0 - exp(-d / fogD)); }
`;
const OUT = `
  #ifdef TONE_MAPPING
    col = toneMapping(col);
  #endif
  gl_FragColor = linearToOutputTexel(vec4(col, alpha));
`;

/* ------------------------------------------------------------- textures
   painted once: grass detail (tiles every 1.6 m) and a soft noise for
   patches of greener and drier grass */
function mulberry32(a) { return E.mulberry32(a); }
const grassCan = document.createElement('canvas'); grassCan.width = grassCan.height = 512;
(() => {
  const c = grassCan.getContext('2d'), r = mulberry32(11);
  c.fillStyle = 'rgb(128,128,128)'; c.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 26000; i++) {
    const x = r() * 512, y = r() * 512, l = 6 + 18 * r(), a = (r() - 0.5) * 0.9, v = 70 + 120 * r();
    c.strokeStyle = `rgba(${v},${v},${v},0.55)`; c.lineWidth = 0.8 + 1.4 * r();
    for (const dx of [-512, 0, 512]) for (const dy of [-512, 0, 512]) {
      if (x + dx < -30 || x + dx > 542 || y + dy < -30 || y + dy > 542) continue;
      c.beginPath(); c.moveTo(x + dx, y + dy); c.lineTo(x + dx + Math.sin(a) * l, y + dy - Math.cos(a) * l); c.stroke();
    }
  }
})();
const grassTex = new THREE.CanvasTexture(grassCan);
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.anisotropy = 4;
const noiseCan = document.createElement('canvas'); noiseCan.width = noiseCan.height = 256;
(() => {
  /* tileable value noise, three octaves per channel */
  const c = noiseCan.getContext('2d'), img = c.createImageData(256, 256), r = mulberry32(5);
  const grid = (n) => { const g = []; for (let i = 0; i < n * n; i++) g.push(r()); return g; };
  const oct = [[8, grid(8)], [16, grid(16)], [32, grid(32)]], oct2 = [[4, grid(4)], [8, grid(8)], [16, grid(16)]];
  const val = (O, x, y) => {
    let s = 0, w = 0, amp = 1;
    for (const [n, g] of O) {
      const fx = x / 256 * n, fy = y / 256 * n, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const at = (a, b) => g[((b % n + n) % n) * n + ((a % n + n) % n)];
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const v = lerp(lerp(at(ix, iy), at(ix + 1, iy), sx), lerp(at(ix, iy + 1), at(ix + 1, iy + 1), sx), sy);
      s += v * amp; w += amp; amp *= 0.5;
    }
    return s / w;
  };
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const k = 4 * (y * 256 + x);
    img.data[k] = 255 * val(oct, x, y); img.data[k + 1] = 255 * val(oct2, x, y); img.data[k + 2] = 255 * val(oct, y, x); img.data[k + 3] = 255;
  }
  c.putImageData(img, 0, 0);
})();
const noiseTex = new THREE.CanvasTexture(noiseCan);
noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;

/* ------------------------------------------------------------- the sky */
const skyMat = new THREE.ShaderMaterial({
  uniforms: U, depthWrite: false, side: THREE.BackSide,
  vertexShader: `varying vec3 vD; void main() { vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: GLSL_COMMON + `
    varying vec3 vD;
    void main() {
      vec3 d = normalize(vD); float e = d.y, alpha = 1.0;
      vec3 col = mix(horizon, zenith, pow(clamp(e, 0.0, 1.0), 0.5));
      col = mix(col, haze, exp(-max(e, 0.0) * 18.0) * 0.6);          // haze along the horizon
      if (e < 0.0) col = haze;
      float cs = dot(d, sunDir);
      col += sunCol * (0.05 * pow(max(cs, 0.0), 6.0) + 0.3 * pow(max(cs, 0.0), 120.0));
      col += sunCol * 18.0 * smoothstep(0.99984, 0.99993, cs);         // the sun's disc
      ` + OUT + `
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(7000, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* ------------------------------------------------------------- clouds
   cumulus painted on canvases: puffs over a flat grey base, sunlit tops */
const CLOUD_TEX = [];
function paintCloud(seed) {
  const W = 512, H = 288, can = document.createElement('canvas'); can.width = W; can.height = H;
  const c = can.getContext('2d'), r = mulberry32(seed);
  const base = H * 0.80, P = [];
  const n = 18 + Math.floor(r() * 16), towers = 1 + Math.floor(r() * 3);
  const tw = Array.from({ length: towers }, () => [W * (0.25 + 0.5 * r()), 0.35 + 0.5 * r()]);
  for (let i = 0; i < n; i++) {
    const x = W * (0.12 + 0.76 * r()), prof = tw.reduce((m, [cx, h]) => Math.max(m, h * Math.exp(-(((x - cx) / (W * 0.22)) ** 2))), 0.18);
    const rad = H * (0.10 + 0.14 * r()) * (0.6 + prof);
    const y = base - rad * 0.55 - r() * prof * H * 0.55;
    P.push([x, Math.min(y, base - rad * 0.45), rad]);
  }
  for (const pass of [0, 1]) for (const [x, y, rad] of P) {
    c.save(); c.beginPath(); c.rect(0, 0, W, base); c.clip();
    const g = c.createRadialGradient(x, y - (pass ? rad * 0.35 : -rad * 0.1), 0, x, y, rad);
    if (pass === 0) { g.addColorStop(0, 'rgba(176,184,198,1)'); g.addColorStop(0.7, 'rgba(176,184,198,0.85)'); g.addColorStop(1, 'rgba(176,184,198,0)'); }
    else { g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.5, 'rgba(250,251,253,0.75)'); g.addColorStop(1, 'rgba(250,251,253,0)'); }
    c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 2 * Math.PI); c.fill(); c.restore();
  }
  /* a soft grey underside along the base */
  const gb = c.createLinearGradient(0, base - H * 0.16, 0, base);
  gb.addColorStop(0, 'rgba(160,168,184,0)'); gb.addColorStop(1, 'rgba(150,158,176,0.55)');
  c.globalCompositeOperation = 'source-atop'; c.fillStyle = gb; c.fillRect(0, base - H * 0.16, W, H * 0.16);
  const t = new THREE.CanvasTexture(can); t.encoding = THREE.sRGBEncoding;
  return t;
}
for (let i = 0; i < 6; i++) CLOUD_TEX.push(paintCloud(101 + i * 17));
let clouds = [];
function makeClouds(r, n) {
  for (const c of clouds) { scene.remove(c); c.material.dispose(); }
  clouds = [];
  for (let i = 0; i < n; i++) {
    const m = new THREE.SpriteMaterial({ map: CLOUD_TEX[Math.floor(r() * CLOUD_TEX.length)], transparent: true, depthWrite: false, fog: false });
    const s = new THREE.Sprite(m), w = 380 + 900 * Math.pow(r(), 1.4);
    s.scale.set(w, w * 0.5625, 1);
    s.position.set((r() * 2 - 1) * 7000, 900 + 700 * r(), (r() * 2 - 1) * 7000);
    s.userData.base = 0.9 + 0.1 * r();
    clouds.push(s); scene.add(s);
  }
}

/* ------------------------------------------------------------- the field */
const groundMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ grassTex: { value: grassTex }, noiseTex: { value: noiseTex },
    gA_: { value: new THREE.Color() }, gB_: { value: new THREE.Color() }, gC_: { value: new THREE.Color() } }, U),
  vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: GLSL_COMMON + `
    uniform sampler2D grassTex, noiseTex; uniform vec3 gA_, gB_, gC_;
    varying vec3 vW;
    void main() {
      vec2 p = vW.xz; float alpha = 1.0;
      float d = length(vW - cameraPosition);
      float det = texture2D(grassTex, p / 1.6).r, det2 = texture2D(grassTex, p / 7.3 + 0.37).r;
      vec3 nz = texture2D(noiseTex, p / 55.0).rgb, nz2 = texture2D(noiseTex, p / 420.0).rgb;
      vec3 col = mix(gA_, gB_, smoothstep(0.3, 0.7, nz.r));
      col = mix(col, gC_, smoothstep(0.55, 0.8, nz2.g) * 0.7);                 // drier stretches
      float fine = mix(0.75 + 0.5 * det * det2 * 1.6, 1.0, smoothstep(30.0, 140.0, d));
      col *= fine * (0.85 + 0.3 * nz.b);
      /* wind on the grass: bent blades show their paler sides where the gust is strong */
      float g = gustAt(p, 0.5) + gW.w;
      col = mix(col, col * vec3(1.18, 1.22, 1.08) + vec3(0.012, 0.015, 0.008), smoothstep(0.6, 1.8, g / max(gW.w, 0.5)) * 0.55);
      float sh = shadowAt(p);
      float sun = max(sunDir.y, 0.0);
      col = col * (sunCol * sun * (1.0 - 0.8 * sh) + skyAmb);
      col = fogged(col, d);
      ` + OUT + `
    }`,
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(14000, 14000).rotateX(-Math.PI / 2), groundMat);
ground.renderOrder = -5;
scene.add(ground);

/* ------------------------------------------------------------- far away: tree lines and hills */
const farMat = new THREE.ShaderMaterial({
  uniforms: U, vertexColors: true,
  vertexShader: `varying vec3 vW, vC; void main() { vC = color; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: GLSL_COMMON + `
    varying vec3 vW, vC;
    void main() {
      float alpha = 1.0, d = length(vW.xz - cameraPosition.xz);
      vec3 col = vC * (sunCol * max(sunDir.y, 0.0) * 0.55 + skyAmb * 1.1);
      col = fogged(col, d * 1.15);
      ` + OUT + `
    }`,
});
let farMesh = null;
function makeFar(r) {
  if (farMesh) { scene.remove(farMesh); farMesh.geometry.dispose(); }
  const P = [], C = [], I = [];
  const wave = (n) => { const w = []; for (let i = 0; i < n; i++) w.push([1 + Math.floor(r() * 9) + i * 3, r() * 6.28, r()]); return w; };
  const ring = (R0, dR, base, amp, bumps, col, cvar, gaps) => {
    const N = 900, wv = wave(7), gp = wave(4), start = P.length / 3;
    for (let i = 0; i <= N; i++) {
      const th = i / N * 2 * Math.PI;
      let n = 0; for (const [k, ph, a] of wv) n += a * Math.sin(k * th + ph);
      let g = 0; for (const [k, ph, a] of gp) g += a * Math.sin(k * th + ph);
      const R = R0 + dR * n * 0.3;
      let h = base + amp * (0.55 + 0.25 * n);
      if (bumps) h += bumps * Math.abs(Math.sin(th * R / 6.5 + 2 * Math.sin(th * 37)));
      if (gaps) h *= smoothstep(-0.2, 0.25, g + gaps);
      const x = Math.cos(th) * R, z = Math.sin(th) * R;
      P.push(x, -3, z, x, Math.max(h, -2), z);
      const v = 1 + cvar * (r() - 0.5);
      C.push(col[0] * 0.75 * v, col[1] * 0.75 * v, col[2] * 0.75 * v, col[0] * v, col[1] * v, col[2] * v);
      if (i < N) { const a = start + 2 * i; I.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
  };
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const tree = [0.05, 0.10, 0.04], hill = [0.10, 0.14, 0.09];
  ring(3200, 900, 30, 100, 0, hill, 0.1, 0);                  // low hills far off
  ring(1300, 260, 8, 14, 2.5, [0.06, 0.11, 0.05], 0.3, 0.8);  // a far tree line
  ring(650, 140, 7, 12, 3, tree, 0.3, 0.6);                   // a nearer one, with gaps
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  geo.setIndex(I);
  farMesh = new THREE.Mesh(geo, farMat); farMesh.frustumCulled = false;
  scene.add(farMesh);
}

/* ------------------------------------------------------------- grass blades
   a patch of blades round the flyer, bent by the same gusts; it follows
   the flyer and thins out at its edge */
const BLADES = STANDALONE ? 30000 : 18000, PATCH = 30;
const bladeGeo = new THREE.InstancedBufferGeometry();
(() => {
  const P = [], I = [];
  const hs = [0, 0.35, 0.7, 1.0], ws = [1, 0.85, 0.55, 0];
  for (let k = 0; k < 4; k++) { if (k < 3) P.push(-ws[k] * 0.5, hs[k], 0, ws[k] * 0.5, hs[k], 0); else P.push(0, 1, 0); }
  I.push(0, 1, 2, 1, 3, 2, 2, 3, 4, 3, 5, 4, 4, 5, 6);
  bladeGeo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  bladeGeo.setIndex(I);
  const r = mulberry32(31), inst = new Float32Array(BLADES * 4), var4 = new Float32Array(BLADES * 4);
  for (let i = 0; i < BLADES; i++) {
    inst.set([r(), r(), r() * 6.283, 0.12 + 0.2 * Math.pow(r(), 1.5)], 4 * i);
    var4.set([r(), r(), r(), r()], 4 * i);
  }
  bladeGeo.setAttribute('inst', new THREE.InstancedBufferAttribute(inst, 4));
  bladeGeo.setAttribute('vary', new THREE.InstancedBufferAttribute(var4, 4));
  bladeGeo.instanceCount = BLADES;
})();
const bladeMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ center: { value: new THREE.Vector2() }, bA: { value: new THREE.Color() }, bB: { value: new THREE.Color() } }, U),
  side: THREE.DoubleSide,
  vertexShader: GLSL_COMMON + `
    attribute vec4 inst, vary; uniform vec2 center; uniform vec3 bA, bB;
    varying vec3 vC; varying float vSh, vD;
    void main() {
      vec2 o = (fract(inst.xy - center / ${PATCH.toFixed(1)} + 0.5) - 0.5) * ${PATCH.toFixed(1)};
      vec2 base = center + o;
      float edge = (1.0 - smoothstep(0.3, 0.5, length(o) / ${PATCH.toFixed(1)})) * (1.0 - smoothstep(9.0, 20.0, length(base - cameraPosition.xz)));
      float h = inst.w * edge, t = position.y;
      float g = gustAt(base, 0.3) + gW.w;

  kitePending = KITE_OPTS[(i + d + KITE_OPTS.length) % KITE_OPTS.length];
  window.KITE.choice = KITE_WORD[kitePending];
  if (window.Wall && Wall.openCard) Wall.openCard();
  clearTimeout(kiteTimer);
  kiteTimer = setTimeout(() => {                     // a moment for more presses, then a new scene with that kite
    const changed = kitePending !== KITE_CHOICE;
    KITE_CHOICE = kitePending; kitePending = null;
    if (changed && !fading) endScene(true);
  }, 700);
}
if (window.Wall && Wall.claimKeys) Wall.claimKeys((e) => {
  if (!document.body.classList.contains('showabout')) return false;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return false;
  chooseKite(e.key === 'ArrowRight' ? 1 : -1);
  e.preventDefault(); e.stopImmediatePropagation();
  return true;
});
function newScene() {
  sceneNo++;
  const seed = (SEED0 + sceneNo * 7919) >>> 0, r = mulberry32(seed);
  const kite = KITE_CHOICE !== 'any' ? KITE_CHOICE : KITE_ANY[Math.floor(r() * KITE_ANY.length)];
  /* the dragon's long tail wants more wind */
  const U0 = Q.has('wind') ? parseFloat(Q.get('wind')) : kite === 'dragon' ? 5.5 + 3 * r() : 4.5 + 4 * r();
  const lineL = kite === 'delta' ? 18 + 7 * r() : kite === 'dragon' ? 22 + 10 * r() : 20 + 12 * r();   // short enough to see the kite well
  const treeOn = Q.get('tree') === 'on' ? true : Q.get('tree') === 'off' ? false : r() < 0.35;
  let tree = null;
  if (treeOn) {
    const side = r() < 0.5 ? -1 : 1, dn = 22 + 18 * r(), lat = side * (8 + 12 * r());
    tree = { x: dn, z: lat, size: 10 + 4 * r(), side };
  }
  S = { seed, r, kite, U0, lineL, tree, orbit: kite === 'delta' ? (r() * 2 - 1) * 0.95 : kite === 'dragon' ? (r() < 0.5 ? -1 : 1) * (0.5 + 0.45 * r()) : (r() * 2 - 1) * 1.9, camH: 1.2 + 1.2 * r(),
        camD: kite === 'delta' ? 6 + 5 * r() : 6 + 9 * r(),
        sunEl: (20 + 42 * r()) * Math.PI / 180, sunAz: r() * 2 * Math.PI, t: 0 };
  /* (the centipede is seen three-quarters on: its discs face the flyer, and side on they are slivers) */
  /* the sun, sky and field colours */
  const L = new THREE.Vector3(Math.cos(S.sunEl) * Math.cos(S.sunAz), Math.sin(S.sunEl), Math.cos(S.sunEl) * Math.sin(S.sunAz));
  U.sunDir.value.copy(L);
  const warm = clamp(1 - (S.sunEl - 0.35) / 0.6, 0, 1) * r();
  U.sunCol.value.setRGB(1.0, lerp(0.97, 0.86, warm), lerp(0.92, 0.72, warm)).multiplyScalar(1.5);
  U.zenith.value.copy(lin(lerp(52, 70, r()), lerp(108, 128, r()), lerp(190, 215, r())));
  U.horizon.value.copy(lin(170, 198, 228));
  U.haze.value.copy(lin(196, 212, 226));
  U.skyAmb.value.copy(lin(120, 140, 170)).multiplyScalar(0.55);
  const dry = r();
  groundMat.uniforms.gA_.value.copy(lin(lerp(60, 92, dry), lerp(98, 110, dry), lerp(34, 40, dry)));
  groundMat.uniforms.gB_.value.copy(lin(lerp(48, 72, dry), lerp(86, 92, dry), lerp(28, 32, dry)));
  groundMat.uniforms.gC_.value.copy(lin(128, 122, 62));
  bladeMat.uniforms.bA.value.copy(lin(38, 62, 22)); bladeMat.uniforms.bB.value.copy(lin(lerp(96, 130, dry), lerp(128, 134, dry), lerp(48, 58, dry)));
  sunLight.position.copy(L).multiplyScalar(50); sunLight.color.copy(U.sunCol.value).multiplyScalar(0.75);
  hemi.color.copy(U.zenith.value).lerp(new THREE.Color(1, 1, 1), 0.5); hemi.groundColor.copy(lin(96, 118, 64)); hemi.intensity = 1.05;
  /* the world: wind toward +x; the tree to one side downwind */
  const treePhys = tree ? makeTreeWorld(r, tree) : null;
  W = new E.World({ seed, kite, U0, dir: 0, gusty: 0.8 + 0.4 * r(), lineL, launchL: kite === 'delta' ? lineL - 0.5 : 16 + 4 * r(),
                    bias: tree ? tree.side : 0, tree: treePhys, fate: tree ? r() < 0.45 : false });
  /* cache the gust field's along-wind modes for the grass */
  const M0 = W.wind.M[0];
  for (let i = 0; i < 8; i++) { U.gK.value[i].set(M0[6 * i], M0[6 * i + 1], M0[6 * i + 2], M0[6 * i + 4]); U.gA.value[i].set(M0[6 * i + 3], M0[6 * i + 5]); }
  makeClouds(r, 14 + Math.floor(r() * 18));
  makeFar(r);
  makeTrees(r, S);
  if (typeof OFF !== 'undefined') {
    for (const c of clouds) c.visible = !OFF.includes('clouds');
    farMesh.visible = !OFF.includes('far');
    for (const t of trees) t.mesh.visible = !OFF.includes('trees');
  }
  buildPerson(r);
  buildKiteView(r);
  camState = null;
  Object.assign(window.KITE, { scene: sceneNo + 1, seed, kite: E.KITES[kite].label, lineL, tree: !!tree, sunEl: S.sunEl * 180 / Math.PI,
                               choice: KITE_WORD[KITE_CHOICE] + (KITE_CHOICE === 'any' ? ' (now ' + E.KITES[kite].label + ')' : '') });
}
/* the tree's physics shape is the one the mesh is built from */
function makeTreeWorld(r, tree) {
  const t = makeTree(mulberry32((S.seed ^ 0x5eed) >>> 0), tree.x, tree.z, tree.size, true);
  tree.built = t;
  return t.phys;
}

/* ------------------------------------------------------------- camera
   the flyer and the kite (for the two-line kite: the whole wind window)
   kept in frame from the scene's angle around the flyer */
let camState = null;
const _p = new THREE.Vector3(), _a = new THREE.Vector3();
function framePoints() {
  const P = W.person, I = W.info, pts = [[P.x, 0.02, P.z], [P.x, 1.85, P.z]];
  if (S.kite === 'delta') {
    const L = W.lines[0].L, th = W.wind.th, hx = P.x, hz = P.z;
    for (const [az, el] of [[0, 70], [-46, 14], [46, 14], [0, 16], [-28, 45], [28, 45]]) {
      const a = th + az * Math.PI / 180, e = el * Math.PI / 180;
      pts.push([hx + L * Math.cos(e) * Math.cos(a), 1.2 + L * Math.sin(e), hz + L * Math.cos(e) * Math.sin(a)]);
    }
  } else {
    pts.push([I.cx, I.cy + 1.0, I.cz], [I.cx, Math.max(0.1, I.cy - 1.2), I.cz]);
    const ld = 0.8;                                   // and where it will be in a moment
    pts.push([I.cx + I.vx * ld, Math.max(0.1, I.cy + I.vy * ld + 1.0), I.cz + I.vz * ld]);
    if (W.tail) { const k = W.tail.parts[Math.floor((W.tail.parts.length - 1) * (W.tail.train ? 1 : 0.6))], x = W.ph.x; pts.push([x[3 * k], Math.max(0.1, x[3 * k + 1]), x[3 * k + 2]]); }
    if (bigTree && (W.ai.state === 'snag' || W.ai.state === 'giveup')) { const t = bigTree.phys; pts.push([t.x, t.top, t.z], [t.x, 0, t.z]); }
  }
  return pts;
}
function fitCamera(dt, snap) {
  const P = W.person, I = W.info;
  const pts = framePoints();
  /* where the camera stands: a set distance from the flyer, at the scene's
     angle round from the kite's direction (the wind's, for the two-line kite) */
  const kb = S.kite === 'delta' ? W.wind.th : Math.atan2(I.cz - P.z, I.cx - P.x);
  if (!camState || snap) camState = { bear: kb, d: S.camD, fov: 50, look: new THREE.Vector3(I.cx, I.cy, I.cz), base: new THREE.Vector3(P.x, 0, P.z) };
  const db = Math.atan2(Math.sin(kb - camState.bear), Math.cos(kb - camState.bear));
  camState.bear += db * (snap ? 1 : 1 - Math.exp(-dt / 5));
  camState.base.x += (P.x - camState.base.x) * (snap ? 1 : 1 - Math.exp(-dt / 2.5));
  camState.base.z += (P.z - camState.base.z) * (snap ? 1 : 1 - Math.exp(-dt / 2.5));
  const ang = camState.bear + Math.PI + S.orbit;
  const put = (d, fov) => {
    camera.fov = fov; camera.updateProjectionMatrix();
    camera.position.set(camState.base.x + Math.cos(ang) * d, S.camH, camState.base.z + Math.sin(ang) * d);
    /* aim at the middle of the points' angular spread */
    let ys = [], ps = [];
    for (const p of pts) { const dx = p[0] - camera.position.x, dy = p[1] - camera.position.y, dz = p[2] - camera.position.z; ys.push(Math.atan2(dz, dx)); ps.push(Math.atan2(dy, Math.hypot(dx, dz))); }
    const y0 = ys[0]; ys = ys.map((y) => y0 + Math.atan2(Math.sin(y - y0), Math.cos(y - y0)));
    const yc = (Math.min(...ys) + Math.max(...ys)) / 2, pc = (Math.min(...ps) + Math.max(...ps)) / 2;
    _a.set(camera.position.x + Math.cos(yc) * Math.cos(pc), camera.position.y + Math.sin(pc), camera.position.z + Math.sin(yc) * Math.cos(pc));
    camera.up.set(0, 1, 0); camera.lookAt(_a); camera.updateMatrixWorld();
    for (const p of pts) { _p.set(p[0], p[1], p[2]).project(camera); if (Math.abs(_p.x) > 0.86 || Math.abs(_p.y) > 0.84 || _p.z > 1) return false; }
    return true;
  };
  /* zoom to fit from the scene's distance; back off only past a wide 72 deg */
  let wantD = S.camD, wantF;
  if (put(S.camD, 72)) {
    let lo = 34, hi = 72;
    for (let it = 0; it < 18; it++) { const m = (lo + hi) / 2; if (put(S.camD, m)) hi = m; else lo = m; }
    wantF = hi;
  } else {
    let lo = S.camD, hi = 160;
    for (let it = 0; it < 20; it++) { const m = (lo + hi) / 2; if (put(m, 72)) hi = m; else lo = m; }
    wantD = hi; wantF = 72;
  }
  /* widen quickly (keep the kite in), close in slowly (calm) */
  const k = (want, now, fast) => (snap ? 1 : 1 - Math.exp(-dt / (want > now ? fast : 5)));
  camState.fov += (wantF - camState.fov) * k(wantF, camState.fov, 0.25);
  camState.d += (wantD - camState.d) * k(wantD, camState.d, 0.6);
  put(camState.d, camState.fov);
  /* the aim eases too */
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const tgt = camera.position.clone().add(dir.multiplyScalar(30));
  if (snap) camState.look.copy(tgt); else camState.look.lerp(tgt, 1 - Math.exp(-dt / 0.9));
  camera.lookAt(camState.look);
  window.KITE.camD = camState.d; window.KITE.fov = camState.fov;
}

function resize() {
  renderer.setPixelRatio(DPR * RS);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const v = new THREE.Vector2(); renderer.getDrawingBufferSize(v); U.res.value.copy(v);
}

/* ------------------------------------------------------------- what the card reads */
const DOING = {
  prep: 'getting ready', pull: 'pulling it up off the grass', climb: 'letting out line as it climbs', fly: 'flying it',
  save: 'running upwind to keep it up', down: 'it is down', fetch: 'walking out to fetch it', pickup: 'picking it up',
  carry: 'launching it from the hand', setdown: 'standing it up again', walkout: 'walking back out', launch: 'launching',
  setup: 'standing it up again', walkback: 'walking back to the end of the lines', snag: 'tugging it out of the tree', giveup: 'the tree has it',
  tug: 'tugging to flip it upright',
};
const MPH = 2.23694, FT = 3.28084, LB = 1 / 4.44822;   // the strip and the card speak mph, feet and pounds
function readouts() {
  const I = W.info, wd = W.wind, ai = W.ai;
  let doing = DOING[ai.state] || ai.state;
  if (ai.state === 'fly' && ai.intent) doing = ai.intent;
  Object.assign(window.KITE, {
    U10: wd.U10, Ukite: wd.mean(Math.max(0.1, I.cy)), shift: (wd.th - wd.th0) * 180 / Math.PI, lull: wd.lullS, gust: wd.gustS,
    line: W.lines[0].L, pull: I.T, height: I.cy, beta: I.beta * 180 / Math.PI, speed: I.speed, doing,
    lines: W.lines.length,
  });
}
/* the readings along the bottom (Joe: "small text at the bottom of the
   screen"), refreshed four times a second */
const strip = document.getElementById('readout');
let stripAt = 0;
function drawStrip(now) {
  if (now - stripAt < 250) return;
  stripAt = now;
  const K = window.KITE, n0 = (x) => Math.round(x).toString();
  const wind = n0(K.U10 * MPH) + ' mph' + (K.lull > 0.3 ? ', a lull' : K.gust > 0.3 ? ', gusting' : '');
  const items = ['wind ' + wind, 'pull ' + (K.pull * LB < 9.5 ? (Math.round(K.pull * LB * 10) / 10).toString() : n0(K.pull * LB)) + ' lb',
                 'line out ' + (K.lines === 2 ? '2 × ' : '') + n0(K.line * FT) + ' ft', 'kite ' + n0(Math.max(0, K.height) * FT) + ' ft up'];
  if (K.doing && K.doing !== DOING.fly) items.push(K.doing);       // "flying it" goes without saying
  const text = items.join('  ·  ');
  if (text !== strip.textContent) strip.textContent = text;
}

/* ------------------------------------------------------------- loop */
let last = 0, sceneStart = 0, fading = false, fpsN = 0, fpsT = performance.now(), acc = 0, simAcc = 0, doneAt = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const s0 = performance.now();
  acc += dt;
  let n = 0;
  while (acc >= E.DT && n < 3) { W.step(E.DT); acc -= E.DT; n++; }
  if (n === 3) acc = 0;
  simAcc += performance.now() - s0;
  S.t += dt;
  const wd = W.wind;
  U.gAdv.value.set(wd.adv[0], wd.adv[1]); U.gT.value = wd.t;
  U.gW.value.set(wd.ex, wd.ez, wd.U10 * wd.gusty * Math.min(1, Math.log(0.5 / 0.03) / 4.2), wd.mean(0.5));
  /* clouds drift with the wind aloft, a little veered */
  const ua = wd.U10 * 2.2, ca = Math.cos(wd.th + 0.35), sa = Math.sin(wd.th + 0.35);
  for (const c of clouds) {
    c.position.x += ua * ca * dt; c.position.z += ua * sa * dt;
    const dx = c.position.x - camera.position.x, dz = c.position.z - camera.position.z;
    if (dx > 7000) c.position.x -= 14000; if (dx < -7000) c.position.x += 14000;
    if (dz > 7000) c.position.z -= 14000; if (dz < -7000) c.position.z += 14000;
    const hd = Math.hypot(dx, dz);
    c.material.opacity = c.userData.base * (1 - 0.65 * clamp((hd - 2500) / 4500, 0, 1));
  }
  drawPerson();
  drawKite(S.t);
  updateShadows();
  fitCamera(dt, false);
  sky.position.copy(camera.position);
  const cd = camera.getWorldDirection(_p), cdl = Math.hypot(cd.x, cd.z) || 1;
  bladeMat.uniforms.center.value.set(camera.position.x + cd.x / cdl * 11, camera.position.z + cd.z / cdl * 11);
  readouts();
  drawStrip(now);
  renderer.render(scene, camera);
  fpsN++;
  if (now - fpsT > 2000) {
    window.KITE.fps = Math.round(fpsN * 1000 / (now - fpsT)); window.KITE.simMs = +(simAcc / fpsN).toFixed(2);
    fpsN = 0; simAcc = 0; fpsT = now;
  }
  if (W.ai.done && !doneAt) doneAt = now;
  if (!fading && ((now - sceneStart) / 1000 > CONFIG.sceneSec || (doneAt && now - doneAt > 4000))) endScene();
  requestAnimationFrame(frame);
}
function holding() {
  if (PINNED || !CONFIG.nextPage) return true;
  const so = window.Wall && Wall.soloNow && Wall.soloNow();
  return !!(so && so.file === 'kite.html');
}
function startScene() {
  newScene();
  if (window.GPU_HIDE) window.GPU_HIDE();
  for (let i = 0; i < 2; i++) W.step(E.DT);
  drawPerson(); drawKite(0); updateShadows();
  fitCamera(0, true);
  doneAt = 0;
}
function endScene(chosen) {
  fading = true;
  document.getElementById('fade').style.opacity = 1;
  setTimeout(() => {
    if (!chosen && !holding() && shownFor() >= dwell()) return handOff();
    startScene(); sceneStart = performance.now(); fading = false;
    document.getElementById('fade').style.opacity = 0;
  }, 1700);
}
const shownAt = Date.now();
const shownFor = () => Date.now() - shownAt;
const dwell = () => (window.Wall && Wall.holdMs) ? Wall.holdMs(CONFIG.holdMin) : CONFIG.holdMin * 60000;
let handedOff = false;
function handOff() {
  if (handedOff) return; handedOff = true;
  location.href = (window.Wall && Wall.nextPage) ? Wall.nextPage(CONFIG.nextPage) : CONFIG.nextPage;
}
setInterval(() => {
  if (holding() || fading || handedOff) return;
  if (shownFor() >= dwell()) { fading = true; document.getElementById('fade').style.opacity = 1; setTimeout(handOff, 1700); }
}, 5000);
addEventListener('keydown', (e) => { if (e.key === 'n' && !fading) endScene(); });   // desk testing: next scene

/* ------------------------------------------------------------- boot */
/* ?off=blades,ground,clouds,far,trees,sky : leave parts out (finding what a GPU dislikes) */
const OFF = (Q.get('off') || '').split(',');
if (OFF.includes('blades')) blades.visible = false;
if (OFF.includes('ground')) ground.visible = false;
if (OFF.includes('sky')) sky.visible = false;
/* ?gputest : parts appear one at a time, 4 s apart; window.GPUTEST says
   which was showing when (if ever) the context was lost */
if (Q.has('gputest')) {
  const parts = [['sky', () => [sky]], ['ground', () => [ground]], ['far', () => [farMesh]], ['clouds', () => clouds],
                 ['trees', () => trees.map((t) => t.mesh)], ['person', () => PV.all], ['kite', () => [KV.sail, ...KV.segs.map((g) => g.strip.mesh)]],
                 ['lines', () => [...KV.lines.map((l) => l.mesh), ...(KV.tail ? [KV.tail.mesh] : [])]], ['blades', () => [blades]]];
  window.GPUTEST = { stage: 'none', lost: null };
  canvas.addEventListener('webglcontextlost', () => { window.GPUTEST.lost = window.GPUTEST.stage; });
  window.GPU_HIDE = () => { if (window.GPUTEST.stage === 'none') for (const [, f] of parts) for (const o of f()) o.visible = false; };
  setTimeout(() => {
    let k = 0;
    const tick = setInterval(() => {
      if (k >= parts.length) { clearInterval(tick); window.GPUTEST.stage = 'all'; return; }
      const [name, f] = parts[k++];
      for (const o of f()) o.visible = true;
      window.GPUTEST.stage = name;
    }, 4000);
  }, 500);
}
if (SOLO_MIN > 0 && window.Wall && Wall.startSolo) Wall.startSolo('kite.html', SOLO_MIN);
addEventListener('resize', () => { resize(); });
resize();
startScene();
renderer.render(scene, camera);
requestAnimationFrame((t) => { last = t; sceneStart = t; document.getElementById('fade').style.opacity = 0; requestAnimationFrame(frame); });
</script>
</body>
