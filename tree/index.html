  /* Base values are the ones tuned by hand earlier; a preset scales or replaces
     them, and then everything gets a final wobble so the preset is a FAMILY of
     looks rather than a single fixed one. */
  const L = {
    name:      chosen.name,
    leaves:    chosen.leaves !== false,
    jitGain:   jit(rng, CONFIG.jitterGain * (chosen.jitMul || 1), 0.16),
    ink:       Math.min(0.78, jit(rng, CONFIG.inkAlpha * (chosen.inkMul || 1), 0.13)),
    lw:        jit(rng, chosen.lw || CONFIG.lineW, 0.14),
    ramp:      jit(rng, 0.44 * (chosen.ramp || 1), 0.16),   // depth-ramp compression ("con")
    haze:      Math.min(0.45, jit(rng, PAL.haze * (chosen.haze || 1), 0.22)),
    leafSz:    jit(rng, 1.45 * (chosen.leafSz || 1), 0.14),
    leafNoise: jit(rng, chosen.leafNoise || 0.5, 0.25),     // spread of per-leaf size
    leafScat:  jit(rng, 1.7, 0.28),                         // how loosely leaves sit on the shoot
    leafA:     Math.min(1, jit(rng, chosen.leafA || 0.90, 0.10)),
    green:     jit(rng, chosen.green || 1.0, 0.09),
    leafV:     jit(rng, chosen.leafV || 0.37, 0.18),        // value lift with distance
    hue:       chosen.hue || 0,                             // a warm run starts part-turned
    shadow:    chosen.shadow !== false,
    shadowA:   jit(rng, 0.18 * (chosen.shadowA || 1), 0.22),
    lightAz:   (chosen.lightAz !== undefined ? chosen.lightAz : 40) + (rng() * 2 - 1) * 25,
    ground:    chosen.ground !== false,
    camEl:     (chosen.camEl !== undefined ? chosen.camEl : 12) + (rng() * 2 - 1) * 3.5,
    camAz0:    -37 + (rng() * 2 - 1) * 26,                  // where the slow orbit starts
    orbitDir:  rng() < 0.5 ? -1 : 1,

    /* THE PEN. build_strokes.m draws one continuous stroke per terminal tip,
       walking the real parent chain all the way to the ground: resample the
       path at ds, offset each sample perpendicular by gain*2*radius, SMOOTH
       that offset along the path, then spline through it. The smoothing is the
       whole trick -- unsmoothed offsets read as mange, smoothed ones read as a
       wandering hand -- and the continuity is what makes it a pen stroke
       instead of a chain of unrelated wobbles.
         penTips     how many lineages are drawn (tree_art's density slider).
                     Every one passes through the trunk, so this IS the overdraw
                     that makes the bole dark: tree_art measures 11.9x.
         penSpacing  ds, in px.
         penFlex     wobble wavelength in px -- tree_art's flex/sigma. Short is
                     nervous and sketchy, long is a slow confident line.
         penBase     how much wobble survives at the ground (basewidth 0.92):
                     1 = the base meets the ground at full trunk width, 0 = every
                     stroke funnels to a point and the trunk tapers to a toothpick. */
    penTips:   Math.round(jit(rng, 190, 0.45)),
    penSpacing: jit(rng, 6.5, 0.35),
    penFlex:   jit(rng, 46, 0.55),
    penBase:   Math.min(1, jit(rng, 0.86, 0.16)),
    penWidth:  jit(rng, 1.0, 0.22)
  };
  return L;
}

const PAL = {
  page:   [245, 240, 227],     // tree_art.m:63
  near:   [ 43,  26,  13],     // :64  dark wood, close to the eye
  far:    [194, 161, 117],     // :65  pale wood, far away
  ground: [204, 199, 179],     // :66
  shadow: [ 33,  28,  26],     // :989
  haze:   0.15                 // :133  far end fades toward the page
};
function woodColor(t) {
  /* base = near + t*(far-near), then haze blends toward the page (makeBrown.m:5-7).
     THE RAMP IS COMPRESSED. tree_art spends near-to-far across a whole scene; here
     the entire ramp goes on one tree perhaps 2 m deep, so half the wood landed at
     the pale end and the drawing read as beige. Running only the first ~55% of the
     ramp keeps the depth cue and keeps the wood dark. */
  t = t * (LOOK ? LOOK.ramp : 0.44);
  const h = (LOOK ? LOOK.haze : PAL.haze) * 0.5 * t;
  const r = (PAL.near[0] + t*(PAL.far[0]-PAL.near[0])) * (1-h) + PAL.page[0]*h;
  const g = (PAL.near[1] + t*(PAL.far[1]-PAL.near[1])) * (1-h) + PAL.page[1]*h;
  const b = (PAL.near[2] + t*(PAL.far[2]-PAL.near[2])) * (1-h) + PAL.page[2]*h;
  return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
}
/* Leaf colour in HSV, straight off tree_art.m:886-903: hue 0.27, saturation
   0.85 near falling to 0.20 far, value 0.55 near rising to 0.92 far -- so
   distant foliage goes pale and desaturated rather than dark. */
function leafColor(t, vNoise, autumn) {
  const Hn = 0.27*(1-autumn) + 0.06*autumn, Hf = 0.27*(1-autumn) + 0.11*autumn;
  const H = Hf + (1-t)*(Hn-Hf);
  const gSat = LOOK ? LOOK.green : 1;              // NB: r/g/b below are the HSV output
  const S = Math.max(0, (0.85 - 0.65*t) * gSat);
  const V = Math.min(1, 0.55 + (LOOK ? LOOK.leafV : 0.37)*t + vNoise);
  const i = Math.floor(H*6), f = H*6 - i;
  const q = V*(1-S), w = V*(1-S*f), e = V*(1-S*(1-f));
  let r, g, b;
  switch (i % 6) {
    case 0: r=V; g=e; b=q; break;  case 1: r=w; g=V; b=q; break;
    case 2: r=q; g=V; b=e; break;  case 3: r=q; g=w; b=V; break;
    case 4: r=e; g=q; b=V; break;  default: r=V; g=q; b=w;
  }
  const h = (LOOK ? LOOK.haze : PAL.haze)*t;
  return 'rgb(' + ((r*255)*(1-h) + PAL.page[0]*h | 0) + ','
                + ((g*255)*(1-h) + PAL.page[1]*h | 0) + ','
                + ((b*255)*(1-h) + PAL.page[2]*h | 0) + ')';
}

/* THE LEAF. Ported straight from build_leaf_template.m:20-22 -- the same eight
   control points tree_art uses for the sugar maple silhouette, given as radius
   against angle for the right half of the blade and mirrored to close the loop:

     phi  0  30  55  80  110  148  172  180 deg
     r  1.00 .46 .94 .42  .72  .40  .46  .36

   Tip at phi = 0, cordate base at 180, and the alternating high/low radii are
   the five palmate lobes with their sinuses between. Fourteen points, built
   once at unit scale with the tip along +x, then rotated and scaled per leaf.

   This is not more expensive than the ellipse it replaces -- probably less.
   ctx.ellipse expands to a run of bezier segments internally, whereas this is
   fourteen lineTo calls, and they batch into exactly the same three fills per
   depth band. At 4K a leaf lands at about 6-8 px, too small to read as a maple
   leaf on its own, but it makes the canopy edge SERRATED rather than bubbly,
   and that is what shows from across a room. */
const LEAF_POLY = (() => {
  const phi = [0, 30, 55, 80, 110, 148, 172, 180];
  const r   = [1.00, 0.46, 0.94, 0.42, 0.72, 0.40, 0.46, 0.36];
  const pts = [];
  for (let i = 0; i < phi.length; i++) {
    const a = phi[i] * Math.PI / 180;
    pts.push(r[i] * Math.cos(a), r[i] * Math.sin(a));
  }
  for (let i = phi.length - 2; i >= 1; i--) {           // mirrored left half, base -> tip
    const a = phi[i] * Math.PI / 180;
    pts.push(r[i] * Math.cos(a), -r[i] * Math.sin(a));
  }
  /* Shift so the blade is centred on its own area rather than on the petiole,
     otherwise every leaf hangs off one side of the point it is placed at. */
  let cx = 0; for (let i = 0; i < pts.length; i += 2) cx += pts[i];
  cx /= (pts.length / 2);
  for (let i = 0; i < pts.length; i += 2) pts[i] -= cx;
  return pts;
})();

/* Fixed orthographic camera at az -37 / el 12, tree_art's own default
   (tree_art.m:52, 736). Orthographic because the renderer has no lights and
   perspective buys nothing a growing tree does not already give. */
/* Camera. az and el are per-run now: the fixed plate at -37/12 was the model's
   own default, but a portrait wants to be framed a little differently each time
   and the elevation change alone re-reads the crown. camAz below adds the slow
   orbit on top. */
const CAM = { az: -37*Math.PI/180, el: 12*Math.PI/180 };
function project(x, y, z, V) {
  const ca = Math.cos((LOOK ? LOOK.camAz0*Math.PI/180 : CAM.az) + camAz);
  const sa = Math.sin((LOOK ? LOOK.camAz0*Math.PI/180 : CAM.az) + camAz);
  const x1 =  x*ca + y*sa;
  const y1 = -x*sa + y*ca;
  const el = LOOK ? LOOK.camEl*Math.PI/180 : CAM.el;
  const ce = Math.cos(el), se = Math.sin(el);
  return [V.cx + x1*V.s, V.cy - (z*ce - y1*se)*V.s, y1*ce + z*se];
}

/* Smooth noise along a stroke, by construction rather than by filtering.
   build_strokes draws white noise and then Gaussian-smooths it; three hashed
   sine octaves give the same wandering line for one multiply-add per sample and
   no smoothing pass, and the wavelength is a directly meaningful control. */
function penWobble(id, s, wavelen, ph) {
  return (Math.sin(s / wavelen + ph)
        + 0.42 * Math.sin(s / (wavelen * 0.41) + ph * 2.7 + 1.3)
        + 0.17 * Math.sin(s / (wavelen * 0.17) + ph * 5.1 + 2.6)) / 1.59;
}

/* ONE CONTINUOUS STROKE, tip to ground. Walks the node's real parent chain --
   laterals and the trunk relay alike -- resamples it at penSpacing, offsets each
   sample perpendicular by gain*2*radius (thickness is drawn as SCATTER, never as
   line width), and runs a quadratic through the offset points. Returns the number
   of samples drawn so the caller can budget. */
function penStroke(T, V, tip, ph, chainBuf) {
  let n = 0;
  for (let i = tip; i >= 0 && n < 128; i = T.parent[i]) chainBuf[n++] = i;
  if (n < 2) return 0;

  // root-first: project each node's base, then the tip of the outermost shoot
  const px = [], py = [], pr = [];
  for (let k = n - 1; k >= 0; k--) {
    const i = chainBuf[k];
    const q = project(T.px[i], T.py[i], T.pz[i], V);
    px.push(q[0]); py.push(q[1]); pr.push(Math.sqrt(T.area[i] / Math.PI));
  }
  const t0 = tipOf(T, chainBuf[0]);
  const qt = project(t0[0], t0[1], t0[2], V);
  px.push(qt[0]); py.push(qt[1]); pr.push(pr[pr.length - 1]);

  // cumulative arc length in screen px
  const m = px.length, arc = new Float64Array(m);
  for (let k = 1; k < m; k++) arc[k] = arc[k-1] + Math.hypot(px[k]-px[k-1], py[k]-py[k-1]);
  const total = arc[m-1];
  if (total < 2) return 0;

  const ds = LOOK.penSpacing;
  const nq = Math.max(2, Math.min(420, Math.ceil(total / ds) + 1));
  let seg = 1, first = true, prevX = 0, prevY = 0;
  for (let q = 0; q < nq; q++) {
    const sArc = total * q / (nq - 1);
    while (seg < m - 1 && arc[seg] < sArc) seg++;
    const a0 = arc[seg-1], a1 = arc[seg];
    const u = a1 > a0 ? (sArc - a0) / (a1 - a0) : 0;
    const x = px[seg-1] + (px[seg] - px[seg-1]) * u;
    const y = py[seg-1] + (py[seg] - py[seg-1]) * u;
    const r = pr[seg-1] + (pr[seg] - pr[seg-1]) * u;

    // perpendicular to the local tangent, in screen space
    let tx = px[seg] - px[seg-1], ty = py[seg] - py[seg-1];
    const tn = Math.hypot(tx, ty) || 1; tx /= tn; ty /= tn;

    /* The wobble is held at full strength down the shaft and only eased over
       the last stretch into the ground -- penBase sets how much survives there.
       (build_strokes.m:110) */
    const ramp = LOOK.penBase + (1 - LOOK.penBase) * Math.min(1, (total - sArc) / 90);
    const sd = LOOK.jitGain * 2 * r * V.s * ramp * LOOK.penWidth;
    const off = penWobble(tip, sArc, LOOK.penFlex, ph) * sd;
    const X = x - ty * off, Y = y + tx * off;

    if (first) { ctx.moveTo(X, Y); first = false; }
    else       { ctx.quadraticCurveTo(prevX, prevY, (prevX + X) * 0.5, (prevY + Y) * 0.5); }
    prevX = X; prevY = Y;
  }
  ctx.lineTo(prevX, prevY);
  return nq;
}

/* A standing human silhouette, normalised to height 1 with the feet at v = 0,
   lifted verbatim from personOutline() in tree_art.m: the right half from the
   crown of the head down to the crotch, mirrored for the left. Drawn at 1.75 m
   in WORLD units beside the tree, so as the maple grows the figure shrinks on
   screen -- which is the whole point. Without a fixed-size object in the frame
   there is nothing for the eye to measure the tree against, and a subject that
   holds a constant share of the screen reads as static however much it grows. */
const PERSON = (() => {
  const R = [[0.000,1.000],[0.050,0.985],[0.072,0.950],[0.072,0.905],[0.042,0.876],
             [0.090,0.858],[0.150,0.848],[0.150,0.610],[0.132,0.520],[0.100,0.535],
             [0.082,0.700],[0.088,0.470],[0.098,0.450],[0.086,0.020],[0.020,0.000],
             [0.030,0.440],[0.000,0.470]];
  const pts = R.slice();
  for (let i = R.length - 2; i >= 1; i--) pts.push([-R[i][0], R[i][1]]);  // mirror
  return pts;
})();
const PERSON_H = 1.75;                                    // [m]

function drawPerson(T, V) {
  /* Stands just past the crown edge, on the ground, facing the camera. Its
     screen size falls out of the same projection as the tree, so it is a true
     scale reference rather than a decoration. */
  let rmax = 0.4;
  for (let i = 0; i < T.n; i++) {
    if (!T.alive[i]) continue;
    const t = tipOf(T, i);
    const r = Math.hypot(t[0], t[1]);
    if (r > rmax) rmax = r;
  }
  const az = (LOOK ? LOOK.camAz0 * Math.PI/180 : CAM.az) + camAz;
  /* Offset ALONG the view azimuth, not across it. project() maps a world point
     to screen-x by (x*cos(az) + y*sin(az)), so an offset perpendicular to the
     azimuth is the DEPTH axis and contributes no horizontal screen movement at
     all -- the figure ends up dead centre, standing inside the trunk. Along the
     azimuth it displaces the full distance sideways. */
  const bx = Math.cos(az) * rmax * 1.25, by = Math.sin(az) * rmax * 1.25;
  const foot = project(bx, by, 0, V);
  const head = project(bx, by, PERSON_H, V);
  /* Remembered so the year Mark can sit on the OTHER side of the trunk without
     walking every node a second time to re-derive the crown radius. */
  V.personX = foot[0];
  const hpx = foot[1] - head[1];                          // screen height of 1.75 m
  if (hpx < 6) return;                                    // too small to read; leave it out

  ctx.beginPath();
  for (let k = 0; k < PERSON.length; k++) {
    const X = foot[0] + PERSON[k][0] * hpx;
    const Y = foot[1] - PERSON[k][1] * hpx;
    if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
  /* Quiet: it is a ruler, not a character. tree_art fills at 0.55 against a
     cream page and outlines thinly (tree_art.m:775); the same weight here reads
     heavier because the figure is much larger on screen early on, when the tree
     is still shorter than it is. */
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = 'rgb(96,98,106)';
  ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgb(64,64,70)';
  ctx.lineWidth = Math.max(0.5, hpx * 0.008);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

let cv, ctx, W = 0, H = 0, dpr = 1;
function layout() {
  cv = document.getElementById('page');
  ctx = cv.getContext('2d', { alpha: false });
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  markPx = tokenPx('--t4', 37 * 1.167 * W / 3840);
}

/* Resolve one of wall.css's type tokens to real pixels. Canvas cannot read a
   custom property -- getPropertyValue hands back the unevaluated max()/calc()
   -- so a throwaway span is styled with it and the computed font-size read
   back. Once per layout, never per frame. The point is that the Mark sits on
   the same ladder as every other piece of type on the wall, instead of a
   private copy of the arithmetic that drifts the first time --ts changes
   because the sofa moved. */
function tokenPx(name, fallback) {
  const el = document.createElement('span');
  el.style.cssText = 'position:absolute;visibility:hidden;font-size:var(' + name + ')';
  document.body.appendChild(el);
  const px = parseFloat(getComputedStyle(el).fontSize);
  el.remove();
  return (px > 0) ? px : fallback;
}

/* The view. A growing tree spans 9x in height over the piece, so a frame fitted
   to the FINAL tree leaves the first minute on an almost invisible seedling.
   The camera therefore tracks the crown with a lag. This is only affordable
   because the renderer is stateless -- it redraws everything every frame -- so
   there is no accumulated ink buffer that a zoom would invalidate. */
function fitView(T, V, ease) {
  let zmax = 0.4, rmax = 0.25;
  for (let i = 0; i < T.n; i++) {
    if (!T.alive[i]) continue;
    const t = tipOf(T, i);
    if (t[2] > zmax) zmax = t[2];
    const r = Math.hypot(t[0], t[1]);
    if (r > rmax) rmax = r;
  }
  /* THE TREE MUST GET BIGGER ON SCREEN, NOT JUST DETAILED.
     A plain auto-fit keeps the subject at a constant fraction of the frame for
     the whole run, so the only thing that visibly changes is the GROUND sliding
     down and away -- and the eye reads that as the tree shrinking, not growing.
     The fix is to let the fraction of the screen the tree occupies RISE with
     its height: a seedling gets a third of the frame, a grown tree nearly all
     of it. The zoom still only ever pulls back (never in), but far more slowly
     than the tree grows, so on-screen size increases monotonically throughout.
     The exponent is well under 1 so most of the gain happens early, while the
     tree is small and the change is otherwise hardest to see. */
  /* The figure is part of the composition, so the frame has to contain it --
     otherwise a seedling shorter than 1.75 m is fitted snugly and the person is
     cut off at the shins, which is precisely when the scale cue matters most. */
  if (CONFIG.person) zmax = Math.max(zmax, PERSON_H * 1.12);
  const grown  = Math.min(1, zmax / (P.handoff_h * 1.55));
  const frac   = CONFIG.fitMin + (CONFIG.fitMax - CONFIG.fitMin) * Math.pow(grown, 0.42);
  const wantH  = zmax * 1.015 + 0.06;
  const wantW  = rmax * 2.1 + 0.1;
  const s = Math.min(H * frac / wantH, W * (frac * 0.72) / wantW);
  const cx = W * 0.5;
  const cy = H * 0.90;
  if (!V.s) { V.s = s; V.cx = cx; V.cy = cy; }
  else { V.s += (s - V.s) * ease; V.cx += (cx - V.cx) * ease; V.cy += (cy - V.cy) * ease; }
  return V;
}

function draw(T, V, autumn) {
  ctx.fillStyle = 'rgb(' + PAL.page.join(',') + ')';
  ctx.fillRect(0, 0, W, H);

  // ---- ground wash: two radial stops, alpha 0.60 at the centre to 0 at the rim
  if (LOOK.ground) {
    const gy = V.cy, gr = Math.max(W, H) * 0.55;
    const gg = ctx.createRadialGradient(V.cx, gy, 0, V.cx, gy, gr);
    gg.addColorStop(0,    'rgba(204,199,179,0.60)');
    gg.addColorStop(0.45, 'rgba(204,199,179,0.50)');
    gg.addColorStop(1,    'rgba(204,199,179,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.ellipse(V.cx, gy, gr, gr*0.30, 0, 0, 6.2832); ctx.fill();
  }

  // ---- collect drawable segments, with depth
  const segs = [];
  let dLo = 1e9, dHi = -1e9;
  for (let i = 0; i < T.n; i++) {
    if (!T.alive[i] || T.ell[i] < 1e-4) continue;
    /* Don't draw a dead fine twig at the end of a branch. A leafless node with
       nothing beyond it and no thickness is a twig the tree would already have
       shed; drawn, it is a bare whisker sticking out past the foliage and it is
       the last thing spoiling the silhouette. Leafless wood that still CARRIES
       something stays -- that is the bare interior conduit, and it should show. */
    if (T.leafless[i] && T.subTip[i] <= 1 && Math.sqrt(T.area[i]/Math.PI) < 0.0018) continue;
    const q = T.parent[i];
    const b = project(T.px[i], T.py[i], T.pz[i], V);
    const tp = tipOf(T, i);
    const e = project(tp[0], tp[1], tp[2], V);
    const d = (b[2] + e[2]) * 0.5;
    if (d < dLo) dLo = d; if (d > dHi) dHi = d;
    segs.push([b[0], b[1], e[0], e[1], Math.sqrt(T.area[i]/Math.PI), d, i]);
  }
  if (!segs.length) return;
  const dSpan = Math.max(dHi - dLo, 1e-6);

  /* Back to front. Canvas has no z-buffer, so draw order IS the depth test;
     bucketing into bands also lets one colour and one path serve many
     segments, which is where the per-frame cost actually goes. */
  const NB = 22;
  const bands = Array.from({length: NB}, () => []);
  for (const sg of segs) bands[Math.min(NB-1, ((dHi - sg[5]) / dSpan * NB) | 0)].push(sg);

  // ---- cast shadow, drawn first and flat on the ground
  if (LOOK.shadow) {
    /* Light azimuth sets which way the shadow falls -- tree_art exposes the same
       as lightaz/lightel (default 40/35). Here it just skews the ground
       projection, which is all a flat cast shadow needs. */
    const lx = Math.cos(LOOK.lightAz * Math.PI/180) * 0.42;
    ctx.globalAlpha = LOOK.shadowA;
    ctx.strokeStyle = 'rgb(' + PAL.shadow.join(',') + ')';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    for (const sg of segs) {
      if (sg[4] < 0.004) continue;                     // only real limbs cast
      ctx.moveTo(sg[0] + (V.cy - sg[1])*lx, V.cy + (V.cy - sg[1])*0.055);
      ctx.lineTo(sg[2] + (V.cy - sg[3])*lx, V.cy + (V.cy - sg[3])*0.055);
    }
    ctx.stroke();
  }

  if (CONFIG.person) drawPerson(T, V);

  /* ---- THE PEN: continuous lineage strokes, tip to ground ----
     Lineages are sorted far-to-near by their TIP depth and coloured by it. A
     single stroke spans many depths and Canvas cannot colour along one; the
     crown is where the depth cue actually reads, and the trunk -- crossed by
     every lineage -- ends up an average of all of them, which is about right. */
  {
    const tips = [];
    for (let i = 1; i < T.n; i++) {
      if (!T.alive[i] || T.subTip[i] > 1) continue;         // a tip carries nothing beyond it
      if (T.leafless[i] && Math.sqrt(T.area[i]/Math.PI) < 0.0018) continue;
      tips.push(i);
    }
    if (tips.length) {
      const want = Math.min(LOOK.penTips, tips.length);
      const stride = tips.length / want;
      const chosen = [];
      for (let k = 0; k < want; k++) {
        const i = tips[Math.floor(k * stride)];
        const t0 = tipOf(T, i);
        chosen.push([i, project(t0[0], t0[1], t0[2], V)[2]]);
      }
      const chainBuf = new Int32Array(160);
      ctx.lineWidth = LOOK.lw * LOOK.penWidth;
      ctx.lineCap = 'round';
      ctx.globalAlpha = LOOK.ink * 0.62;                    // many passes overlap on the bole
      let budget = 26000;                                   // samples per frame, hard cap
      const NBP = 10;                                       // colour buckets for the pen
      for (let b = NBP - 1; b >= 0 && budget > 0; b--) {
        let opened = false;
        for (let c = 0; c < chosen.length; c++) {
          const bi = Math.min(NBP - 1, ((dHi - chosen[c][1]) / dSpan * NBP) | 0);
          if (bi !== b) continue;
          if (!opened) { ctx.strokeStyle = woodColor((b + 0.5) / NBP); ctx.beginPath(); opened = true; }
          budget -= penStroke(T, V, chosen[c][0], hash2(chosen[c][0], 7) * 6.2832, chainBuf);
          if (budget <= 0) break;
        }
        if (opened) ctx.stroke();
      }
    }
  }

  // ---- wood and foliage, INTERLEAVED band by band, back to front
  ctx.lineWidth = LOOK.lw;                              // constant hairline, always
  ctx.lineCap = 'round';
  let drawn = 0;
  const stride = Math.max(1, Math.ceil(T.nLeafy / CONFIG.leafCap));
  const lrBase = Math.sqrt(P.leaf_area / Math.PI) * V.s * 0.62;
  /* BACK TO FRONT. Canvas has no depth buffer, so draw order IS the depth test.
     Interleaving each band's foliage with its own wood matters too: drawing all
     the wood and then all the leaves puts every leaf in front of every branch, so
     near limbs sink behind far foliage and the wood stops reading as structure. */
  for (let bi = NB - 1; bi >= 0; bi--) {
    const band = bands[bi];
    if (!band.length) continue;
    const t = (bi + 0.5) / NB;

    ctx.globalAlpha = LOOK.ink;
    ctx.strokeStyle = woodColor(t);
    ctx.beginPath();
    for (const sg of band) {
      const [x0, y0, x1, y1, r, , id] = sg;
      /* One pass now. The overdraw that darkens the trunk and the limbs is done
         properly by the lineage strokes above -- every one of them runs through
         the bole, which is exactly how build_strokes gets its measured 11.9x.
         This pass exists only so every twig, including ones no selected lineage
         happens to pass through, is drawn at least once. */
      const sd = LOOK.jitGain * 2 * r * V.s;           // SD in PIXELS (build_strokes.m:115)
      const passes = sd > 3 ? 2 : 1;
      /* Passes are SPREAD ACROSS the band, not drawn from a gaussian. Gaussian
         offsets pile up at the centre and thin toward the edges, so a 20 px
         trunk read as a dark 4 px line with fuzz either side instead of a solid
         column. Sweeping k evenly across [-sd, +sd] and adding a small hashed
         wobble fills the band and still wanders like a hand. */
      const perp = Math.hypot(x1-x0, y1-y0) > 1e-6
        ? [-(y1-y0), (x1-x0)] : [1, 0];
      const pn = Math.hypot(perp[0], perp[1]) || 1;
      const ux = perp[0]/pn, uy = perp[1]/pn;
      for (let k = 0; k < passes; k++) {
        const spread = passes > 1 ? ((k / (passes - 1)) - 0.5) * 2 * sd : 0;
        const wob = 0.42 * sd;
        const a = spread + hashN(id, k*2) * wob;
        const b = spread + hashN(id, k*2+64) * wob;
        const ax = ux*a, ay = uy*a, bx = ux*b, by = uy*b;
        ctx.moveTo(x0 + ax, y0 + ay);
        ctx.quadraticCurveTo((x0+x1)*0.5 + (ax+bx)*0.55, (y0+y1)*0.5 + (ay+by)*0.55, x1 + bx, y1 + by);
      }
    }
    ctx.stroke();

    /* Foliage is BATCHED. One beginPath/fill per leaf meant ~5,000 fill calls a
       frame, which measured 23-27 ms on a fast laptop -- about 7 fps once scaled
       to a Pi, and essentially the entire frame cost. Leaves in a band differ
       only by a small value-noise term, so they are bucketed into three shades
       and each bucket is one path and one fill: 66 fills a frame instead of
       5,000, for a difference nobody can see at three metres. */
    ctx.globalAlpha = LOOK.leafA;
    if (LOOK.leaves && lrBase >= 0.7) {
      const NV = 3;
      for (let vb = 0; vb < NV; vb++) {
        // A warm look starts part-turned; the finale drives it the rest of the way.
        ctx.fillStyle = leafColor(t, ((vb + 0.5)/NV - 0.5) * 0.1,
                                  Math.min(1, LOOK.hue + autumn));
        ctx.beginPath();
        let any = false;
        for (const sg of band) {
          const id = sg[6];
          if (T.leafless[id] || (id % stride)) continue;
          const nl = Math.min(8, leafCount(T, id));
          if (!nl) continue;
          /* FEWER, BIGGER LEAVES. A fourteen-point silhouette costs about 2.6x
             an ellipse of the same size (39 ms a frame at 4K against 15 -- so
             much for lineTo being cheaper than ctx.ellipse). Halving the count
             and growing each blade buys the shape back at the old price, and a
             canopy of fewer larger lobed leaves reads BETTER at three metres
             than more, smaller blobs: the silhouette is what carries. */
          for (let k = 0; k < nl; k += 4) {
            if ((Math.floor(hash2(id, k+91) * NV) | 0) !== vb) continue;
            const f = (k + 0.5) / nl;
            const px = sg[0] + (sg[2]-sg[0])*f, py = sg[1] + (sg[3]-sg[1])*f;
            const a = T.azim[id] + k * P.phyllotaxis;
            const jx = (hash2(id, k) - 0.5) * lrBase * LOOK.leafScat;
            const jy = (hash2(id, k+31) - 0.5) * lrBase * LOOK.leafScat;
            const sz = lrBase * LOOK.leafSz
                     * (1 - LOOK.leafNoise/2 + LOOK.leafNoise * hash2(id, k+57));
            const cx = px + Math.cos(a)*lrBase*0.7 + jx;
            const cy = py + Math.sin(a)*lrBase*0.35 + jy;
            /* Rotated so the tip points away from the shoot, and squashed
               vertically by the same 0.78 the ellipse used -- the camera looks
               slightly down, so a blade held out flat foreshortens. */
            const ca = Math.cos(a), sn = Math.sin(a);
            const sx = sz, sy = sz * 0.78;
            ctx.moveTo(cx + sx*(ca*LEAF_POLY[0]) - sy*(sn*LEAF_POLY[1]),
                       cy + sx*(sn*LEAF_POLY[0]) + sy*(ca*LEAF_POLY[1]));
            for (let v = 2; v < LEAF_POLY.length; v += 2) {
              ctx.lineTo(cx + sx*(ca*LEAF_POLY[v]) - sy*(sn*LEAF_POLY[v+1]),
                         cy + sx*(sn*LEAF_POLY[v]) + sy*(ca*LEAF_POLY[v+1]));
            }
            ctx.closePath();
            any = true; drawn++;
          }
        }
        if (any) ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  drawYearMark(T, V);
  return drawn;
}

/* =======================================================================
   THE YEAR MARK -- the one number left on the wall.

   WHY IT IS DRAWN AND NOT PRINTED. Height, trunk width and crown spread are
   all drawn at true size against a 1.75 m human, so a viewer can read them off
   the picture. Time is the one dimension the picture cannot carry: nothing in
   the frame says whether this is year 3 or year 20. So the year is drawn into
   the artwork by the same code that draws the tree, and it moves when the tree
   moves -- change the window aspect and it stays at the foot of the trunk,
   which is the test that separates a Mark from an orphaned strip.

   WHERE. At the ground line, on the side of the trunk the human is NOT on.
   drawPerson() offsets the figure ALONG the view azimuth, and project() maps
   that to a purely rightward screen displacement, so the figure is always to
   the right of the trunk and the left of the ground line is always clear.

   CONTRAST. A halo of the page's own cream, not a plate. This ground is the
   quietest surface in the rotation; a pill on it would read as chrome bolted
   to a drawing.

   IT YIELDS TO THE LANE. Both want the bottom of the frame -- the closest this
   wall comes to re-running gravity's caption-inside-its-own-instrument bug.
   Rather than compute an offset to clear a box whose height is variable by
   design, the Mark simply stays dark while a sentence is lit: wall.js sets
   body.lane-lit for exactly this. It arrives at about second sixteen, when the
   opening sentence has dissolved, and nothing is lost by that.
   ======================================================================= */
function drawYearMark(T, V) {
  if (!markPx) return;
  const want = document.body.classList.contains('lane-lit') ? 0 : 1;
  /* Eased, not switched. draw() runs at up to ten paints a second, so 0.18 a
     paint is a fade of about eight tenths of a second -- long enough to read as
     arriving rather than blinking on. */
  markA += (want - markA) * 0.18;
  if (markA < 0.01) return;

  const label = 'year ' + (T.day / 365).toFixed(1) + ' of ' + CONFIG.simYears;
  ctx.save();
  ctx.font = '400 ' + markPx.toFixed(1) + 'px ui-monospace,"SF Mono",Menlo,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(label).width;

  /* Mirror of the human's screen offset about the trunk, then clamped: never
     inside the trunk, never outside the safe rectangle (--safe-x is 134 wall
     px; televisions overscan and LG's Just Scan resets itself on an HDMI
     source change). */
  const safe = W * (134 / 3840);
  let x = (V.personX != null) ? V.cx - (V.personX - V.cx) : V.cx - W * 0.16;
  x = Math.min(x, V.cx - w * 0.5 - markPx);
  x = Math.max(x, safe + w * 0.5);
  const y = V.cy - markPx * 0.30;                 // sits ON the drawn ground line

  ctx.globalAlpha = markA;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, 12 * W / 3840);     // a 6 wall px halo; stroke is centred
  ctx.strokeStyle = 'rgba(245,240,227,0.92)';     // PAL.page, the paper itself
  ctx.strokeText(label, x, y);
  ctx.fillStyle = 'rgba(46,38,28,0.95)';          // --ink-lt from wall.css
  ctx.fillText(label, x, y);
  ctx.restore();
}

/* =======================================================================
   THE CYCLE
   ======================================================================= */
/* titleEl, capWhat, capParams, capEl and setCaption() are gone with the two
   bands they wrote into. setCaption(what, params) was copied from the other
   pages in the rotation and it is the shape of the problem: a signature that
   takes a PERMANENT sentence and a PERMANENT parameter strip cannot help but
   produce a caption that is wrong about the picture most of the time. The
   episode calls below take a sentence and a moment to say it. */
const infoEl  = document.getElementById('info');
const curtain = document.getElementById('curtain');

let T = null, V = {}, runIndex = 0;
let runStart = 0, lastStepAt = 0, dayDebt = 0, finishedAt = 0;
let paused = false, handingOff = false, stepIdx = 0;
let fps = 0, lastFrame = performance.now(), lastDrawn = 0, msSim = 0, msDraw = 0, paints = 0;
let simFails = 0, camAz = 0, lastPaintAt = 0;
/* The leader retirement fires ONCE per run, so the flip has to be watched from
   out here rather than announced from inside events() -- the model file stays
   free of anything to do with language. markA is the year Mark's own fade. */
let wasHandedOff = false, markA = 0, markPx = 0;

const TOTAL_DAYS = () => CONFIG.simYears * 365;

/* ---- WHAT THIS PAGE SAYS, AND WHEN ---------------------------------------
   One sentence, three times in a 205-second run, and silence otherwise.

   The Name beat is the old title-card blurb, which was the better-written of
   the two duplicated sentences, with the one fact the caption had that the
   blurb did not folded into it: about seven in ten shoots are shed. That fact
   is the most interesting thing on the page and it is also the one thing a
   viewer cannot recover by looking, because dead shoots are not drawn. It
   therefore rides the sentence rather than a strip.

   On a REPEAT run (?pin, or r pressed) the wall's rule is that a returning
   episode says only what changed, so the second and later trees get the short
   line instead of the full recital. */
const NAME_LINE  = 'A sugar maple grows one shoot at a time; light decides which '
                 + 'buds open, and about seven in ten are shed.';
const AGAIN_LINE = 'Another seed, and the same rules build a different maple.';

function newRun() {
  const seed = 1 + Math.floor(Math.random()*999998);
  T = seedTree(seed);
  LOOK = pickLook(seed);          // same seed, derived stream: look travels with the tree
  V = {};
  stepIdx = 0; dayDebt = 0; finishedAt = 0; simFails = 0; camAz = 0; lastPaintAt = 0;
  runStart = performance.now(); lastStepAt = runStart;
  wasHandedOff = false; markA = 0;
  fitView(T, V, 1);

  /* THE EPISODE. Wall.episode() holds its tongue for two seconds first, so the
     seedling and the human establish alone -- the picture is the piece, and the
     old title card started talking over frame one. */
  Wall.clearTimers();
  Wall.episode(runIndex === 0 ? NAME_LINE : AGAIN_LINE, { light: true });
  /* THE HALFWAY REPEAT. This is the longest run in the rotation by some way,
     and a single opening sentence leaves anybody who arrives at minute two
     looking at an unexplained tree for three minutes. The wall's rule is that
     a run past about 150 s re-runs its Name beat once, near the middle. It
     costs a dozen seconds of silence and no new box. */
  Wall.after(CONFIG.runMs * 0.5, () => Wall.lane(NAME_LINE, { light: true }));
}

/* The tip of the leader, in CSS pixels, for the Moment to sit beside. Frame
   centre would be wrong here: on this page the trunk owns the centre line, so
   a centred word lands on the tree it is talking about. */
function leaderTip(T, V) {
  let bz = -1e9, best = null;
  for (let i = 0; i < T.n; i++) {
    if (!T.alive[i] || T.kind[i] !== KIND.TRUNK) continue;
    const t = tipOf(T, i);
    if (t[2] > bz) { bz = t[2]; best = t; }
  }
  if (!best) return null;
  const p = project(best[0], best[1], best[2], V);
  return { x: p[0], y: p[1] };
}

function simulate(nSteps) {
  const t0 = performance.now();
  for (let k = 0; k < nSteps; k++) {
    const yearBefore = Math.floor(T.day / 365);
    const st = step(T, stepIdx);
    // events() needs the child counts the reverse pass just built
    const nChild = new Int32Array(T.n);
    for (let i = 1; i < T.n; i++) if (T.alive[i] && T.parent[i] >= 0) nChild[T.parent[i]]++;
    events(T, nChild, V.s || 100);
    if (Math.floor(T.day / 365) > yearBefore) budSet(T);
    if (stepIdx % CONFIG.postureEvery === 0) posture(T);
    if (stepIdx % CONFIG.lightEvery === 0) gatherLight(T, buildLight(T));
    stepIdx++;
    T.lastCe = st.f_Ce; T.leaves = st.leaves;
  }
  msSim = msSim*0.85 + (performance.now() - t0)*0.15;
}

/* updateTicker() is gone. It rewrote the caption strip SIXTY TIMES A SECOND
   with seed, look, year, height, base diameter, shoot counts and leader state
   -- six live figures at 16 wall pixels, a thousand wall pixels from the tree,
   scrolling past illegibly for the whole run. Every one of them is still
   available: the year is drawn into the picture, the shoot counts are spoken
   once at the close, the leader retirement is a Moment when it happens, and
   the rest is in #info under the i key, which is where a number nobody can
   read from a sofa belongs. */
function updateInfo() {
  if (!T) return;
  const dbh = 2*Math.sqrt(T.area[0]/Math.PI)*100;
  infoEl.textContent =
    /* The seed and the render recipe both left the wall (the recipe read as a
       data legend for a colour channel that does not exist), and they are what
       lets a particularly good tree be found again -- so they land here. */
    'seed      ' + T.seed + '\n' +
    'look      ' + LOOK.name + '\n' +
    'day       ' + T.day.toFixed(0) + '  (yr ' + (T.day/365).toFixed(1) + ')\n' +
    'height    ' + T.H.toFixed(2) + ' m\n' +
    'base dia  ' + dbh.toFixed(1) + ' cm   H/D ' + (dbh > 0 ? (T.H*100/dbh).toFixed(0) : '-') + '\n' +
    'nodes     ' + T.nAlive + ' alive / ' + T.n + ' born   ' + T.deaths + ' dead\n' +
    'leafy     ' + T.nLeafy + '   leaves ' + (T.leaves|0) + '\n' +
    'apices    ' + T.apexCount + (T.handedOff
        ? '  (leader retired at ' + P.handoff_h + ' m, yr ' + (T.handoffDay/365).toFixed(1) + ')'
        : '  (single leader)') + '\n' +
    'C         ' + T.C.toFixed(1) + '   f_Ce ' + (T.lastCe||0).toFixed(2) + '\n' +
    'drawn     ' + lastDrawn + ' leaf sprites\n' +
    'sim/draw  ' + msSim.toFixed(1) + ' / ' + msDraw.toFixed(1) + ' ms\n' +
    'paints    ' + paints + '\n' +
    'fps       ' + fps.toFixed(0) + (paused ? '  [PAUSED]' : '');
}

function handOff() {
  if (handingOff) return;
  handingOff = true;
  /* Both, and first. clearEpisode() puts out whatever sentence is lit;
     clearTimers() kills the schedule behind it. A halfway repeat that fires
     during the curtain narrates a tree that is already fading out, and a
     sentence left lit through the fade is the one thing a hand-off cannot
     take back. */
  Wall.clearEpisode();
  Wall.clearTimers();
  curtain.classList.add('on');
  setTimeout(() => {
    runIndex++;
    /* An EMPTY nextPage means there is nowhere to hand on to - which is what
       build_github.py leaves behind when it cuts this page out of the wall's
       rotation for publishing. Start again instead. */
    if (!PINNED && runIndex >= CONFIG.runsPerTurn) {
      if (CONFIG.nextPage) location.href = CONFIG.nextPage; else location.reload();
      return;
    }
    newRun();
    curtain.classList.remove('on');
    handingOff = false;
  }, CONFIG.fadeMs);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dtms = now - lastFrame; lastFrame = now;
  fps = fps ? fps*0.9 + (1000/dtms)*0.1 : 1000/dtms;
  if (paused || handingOff || !T) return;

  let stepped = false;
  /* ABSOLUTE DEADLINE -- the escape hatch. handOff() was reachable only through
     finishedAt, which is set only when the day counter reaches its target, and
     runMs was used to derive the growth RATE rather than as a deadline. So if
     simulate() ever threw or the day counter stopped advancing, the wall sat on
     a frozen tree forever: rAF is rescheduled at the top of frame(), so an
     exception in the body does not stop the loop, it just repeats. Every other
     page in the rotation has one of these. (Pi session note 1.) */
  if (now - runStart > CONFIG.runMs * CONFIG.deadlineSlack) { handOff(); return; }

  const done = T.day >= TOTAL_DAYS();
  if (!done) {
    /* Simulated days are advanced on a CLOCK, not per frame, so the tree grows
       at the same speed whether the panel manages 60 fps or 24. */
    const perMs = TOTAL_DAYS() / CONFIG.runMs;
    /* Clamped. An unbounded delta lets any long stall bank arbitrary debt, and
       the tree then sprints at the 6-step cap to catch up -- years of growth in
       a second. Capping the delta means a stall costs a pause, not a lurch.
       (Pi session note 4.) */
    dayDebt += Math.min(250, Math.max(0, now - lastStepAt)) * perMs;
    lastStepAt = now;
    const want = Math.min(6, Math.floor(dayDebt / CONFIG.dt));
    if (want > 0) {
      dayDebt -= want * CONFIG.dt;
      /* A throw in here must not wedge the page. Losing one step is invisible;
         losing the rotation is not. */
      try { simulate(want); stepped = true; }
      catch (err) { console.error('[tree] sim step failed', err); simFails++; }
      if (simFails > 40) { handOff(); return; }
    }
    /* THE MOMENT. The tree loses its single leader to a ring of co-leaders --
       the event that turns a spire into a dome, and the one thing on this page
       that happens rather than accumulates. Four words, beside the leader that
       just retired, four seconds, gone. It cannot be seen coming and it cannot
       be read off the finished picture, which is what a Moment is for. The old
       parameter strip carried it as "leader retired at 4.5 m" for the rest of
       the run, i.e. as a state label, which is precisely what a Moment is not.
       The height and the year are in #info. */
    if (T.handedOff && !wasHandedOff) {
      wasHandedOff = true;
      Wall.moment('Leader retired', { at: leaderTip(T, V), light: true });
    }
  } else if (!finishedAt) {
    finishedAt = now;
    /* THE CLOSE BEAT. The run's actual result, spoken once, in the ten seconds
       the finished tree is held before the fade -- and true only now, which is
       why it was never a caption. About seven in ten shoots born were shed to
       get this crown, and here are the two numbers. */
    Wall.lane('The tree kept ' + T.nAlive.toLocaleString() + ' shoots and shed '
              + T.deaths.toLocaleString() + '.', { figures: true, light: true });
  }

  /* The finale. Growth stops, the leaves turn, and the piece ends on the bare
     winter skeleton -- which is the best-looking frame this renderer makes and
     the natural handoff to the next page. */
  let autumn = 0;
  if (finishedAt) {
    const k = (now - finishedAt) / CONFIG.holdMs;
    autumn = Math.min(1, Math.max(0, (k - 0.15) / 0.5));
    if (k > 1) { handOff(); return; }
  }

  /* ONLY REDRAW WHEN SOMETHING CHANGED. The simulation steps about thirteen
     times a second; redrawing on all sixty rAF ticks did the same work four or
     five times over for an identical picture. A frame is worth painting when
     the tree stepped, when the camera is still easing toward its new fit, or
     when the autumn hue is moving. Canvas keeps the last frame, so skipping a
     paint costs nothing visually. This is the difference between ~13 paints a
     second and 60. */
  const sBefore = V.s || 0;
  fitView(T, V, 0.045);
  const viewMoved = Math.abs((V.s || 0) - sBefore) > sBefore * 2e-4;
  camAz += CONFIG.camOrbit * Math.min(250, Math.max(0, dtms)) / 1000;
  /* The orbit means every frame is technically stale, which would undo the
     dirty-flag saving and put us back at 60 repaints a second. Cap the paint
     rate instead: at 20 fps a 0.0021 rad/s drift moves the far edge of the
     crown well under a pixel between paints. */
  const paintDue = (now - lastPaintAt) >= 1000 / CONFIG.maxPaintFps;
  if (paintDue && (stepped || viewMoved || finishedAt || CONFIG.camOrbit !== 0)) {
    lastPaintAt = now;
    const t0 = performance.now();
    lastDrawn = draw(T, V, autumn) || 0;
    msDraw = msDraw*0.85 + (performance.now() - t0)*0.15;
    paints++;
  }
  if (document.body.classList.contains('showinfo')) updateInfo();
}

addEventListener('resize', () => { layout(); if (T) V = {}; });
addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'i': case 'I': document.body.classList.toggle('showinfo'); updateInfo(); break;
    case 'n': case 'N': handOff(); break;
    case 'r': case 'R': newRun(); break;
    case 'p': case 'P': case ' ':
      paused = !paused; lastStepAt = performance.now(); updateInfo(); break;
    case 'ArrowRight': rotateTo(1); break;
    case 'ArrowLeft':  rotateTo(-1); break;
    default:
      if (/^[0-9]$/.test(e.key)) {
        const score = e.key === '0' ? 10 : parseInt(e.key, 10);
        console.log('[tree] RATING STUB - score', score, 'seed', T && T.seed);
      }
  }
});

layout();
newRun();
requestAnimationFrame(frame);
</script>
<script src="nav.js"></script>
</body>
</html>
